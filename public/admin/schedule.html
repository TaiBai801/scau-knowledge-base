<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>工作排期工作站</title>
<style>
/* ===== 基础与主题 ===== */
:root{
  --font-ui:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
  --bg:#F3F2ED;
  --paper:#FBFAF6;
  --surface:#FFFFFF;
  --surface-2:#F7F6F1;
  --rail:#F7F6EF;
  --ink:#1C2422;
  --muted:#565F5B;
  --faint:#767E79;
  --line:#DEDDD5;
  --line-strong:#C9C8BE;
  --grid-line:rgba(30,44,39,.085);
  --brand:#0D5C5A;
  --brand-strong:#084744;
  --accent:#0D5C5A;
  --accent-soft:#E4EFEC;
  --red:#BE413B;
  --red-soft:#F7E7E4;
  --amber:#9A6823;
  --amber-soft:#F5EBD9;
  --green:#2E6D55;
  --green-soft:#E7F0EA;
  --blue:#486C88;
  --blue-soft:#E9EFF3;
  --weekend-fill:#F0EFE8;
  --today-tint:#F8E8E5;
  --white:#FFFFFF;
  --row-h:30px;
  --head-h:48px;
  --lane-w:236px;
  --rail-w:178px;
  --drawer-w:400px;
  --radius:10px;
  --font-11:11px;
  --font-12:12px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#101614;
  --paper:#141C1A;
  --surface:#19221F;
  --surface-2:#1B2522;
  --rail:#131B19;
  --ink:#E9E6DE;
  --muted:#AFB8B2;
  --faint:#8B958F;
  --line:#2B3632;
  --line-strong:#3C4A45;
  --grid-line:rgba(226,232,226,.085);
  --brand:#0D5C5A;
  --brand-strong:#0A4644;
  --accent:#79C9C0;
  --accent-soft:#18322F;
  --red:#E3776F;
  --red-soft:#35211F;
  --amber:#D6A65F;
  --amber-soft:#302719;
  --green:#7FC0A4;
  --green-soft:#1B3028;
  --blue:#8EB4CE;
  --blue-soft:#1C2B33;
  --weekend-fill:#151D1B;
  --today-tint:#2B1E1C;
  --white:#FFFFFF;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--font-ui);
  font-size:12.5px;
  line-height:1.5;
  color:var(--ink);
  background:var(--bg);
  overflow:hidden;
  text-rendering:optimizeLegibility;
  -webkit-font-smoothing:antialiased;
}
body.hide-weekend{--weekend-fill:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
button:disabled{cursor:not-allowed}
a{color:var(--accent)}
::selection{background:color-mix(in srgb,var(--brand) 22%,transparent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.mono{font-family:var(--font-mono)}

/* ===== 通用控件 ===== */
.btn{
  height:32px;padding:0 11px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--surface);color:var(--ink);font-size:12px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  white-space:nowrap;transition:background .15s,border-color .15s,color .15s;
}
.btn:hover:not(:disabled){background:var(--surface-2);border-color:var(--line-strong)}
.btn:active:not(:disabled){background:var(--accent-soft)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--brand-strong);border-color:var(--brand-strong)}
.btn.primary kbd{color:rgba(255,255,255,.75);border-color:rgba(255,255,255,.3);background:transparent}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover:not(:disabled){color:var(--ink);background:var(--surface-2)}
.btn.icon{width:32px;padding:0;font-size:15px}
.btn.small{height:27px;padding:0 8px;font-size:12px;border-radius:8px}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 35%,var(--line))}
.btn.danger:hover:not(:disabled){background:var(--red-soft)}
kbd{
  font-family:var(--font-mono);font-size:11px;line-height:1.2;
  border:1px solid var(--line);border-bottom-color:var(--line-strong);
  border-radius:4px;padding:1px 4px;color:var(--muted);background:var(--paper);
}
.select,input[type="text"],input[type="search"],input[type="number"],input[type="color"],textarea{
  border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);
  outline:none;
}
input[type="text"],input[type="search"],input[type="number"],select{
  height:30px;padding:0 8px;font-size:12px;min-width:0;
}
input.date-iso{font-family:var(--font-mono);font-size:12px;letter-spacing:.015em}
input.date-iso::placeholder{color:var(--faint)}
textarea{padding:8px 9px;font-size:12px;resize:vertical;line-height:1.6}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
select{cursor:pointer}
input[type="color"]{width:30px;height:30px;padding:2px;cursor:pointer}
input[type="range"]{accent-color:var(--brand);width:100%;height:20px;cursor:pointer}
input[type="checkbox"]{accent-color:var(--brand);width:14px;height:14px;cursor:pointer;vertical-align:-2px}
.field-label{display:block;font-size:11.5px;letter-spacing:.06em;color:var(--muted);margin-bottom:4px;font-weight:500}
.hint{font-size:11.5px;color:var(--muted);line-height:1.5}
.divider{height:1px;background:var(--line);margin:14px 0}
.btn-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-family:var(--font-mono)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--green)}
.dot.warn{background:var(--amber)}
.dot.error{background:var(--red)}

/* ===== 应用骨架 ===== */
.app{height:100vh;height:100dvh;display:flex;flex-direction:column;min-height:0;overflow:hidden}

/* 顶部工具栏 */
.topbar{
  flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:9px 16px;background:var(--paper);border-bottom:1px solid var(--line);
  position:relative;z-index:100;
}
.brand{display:flex;align-items:center;gap:11px;min-width:242px}
.brand-mark{
  width:34px;height:34px;border:1px solid var(--brand);border-radius:10px;
  display:grid;place-items:center;color:var(--accent);font-size:13px;font-weight:600;
  letter-spacing:.04em;background:var(--accent-soft);flex:none;
}
.brand-copy{min-width:0}
.brand h1{margin:0;font-size:15.5px;line-height:1.25;font-weight:600;letter-spacing:.055em;white-space:nowrap}
.brand-meta{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);letter-spacing:.03em;margin-top:2px;white-space:nowrap}
.brand-meta .sep{color:var(--line-strong)}
.save-state{display:inline-flex;align-items:center;gap:4px}
.save-state.is-error{color:var(--red)}
.toolbar-controls{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap;min-width:0}
.search-box{
  position:relative;display:flex;align-items:center;width:246px;height:32px;
  border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);
}
.search-box:focus-within{border-color:var(--accent)}
.search-box .search-icon{position:absolute;left:9px;color:var(--faint);font-size:12px;pointer-events:none}
.search-box input{
  height:100%;width:100%;border:0;border-radius:var(--radius);background:transparent;
  padding:0 28px 0 27px;font-size:12px;
}
.search-box input:focus{border:0;outline:none}
.search-clear{
  position:absolute;right:5px;width:20px;height:20px;border-radius:50%;
  display:grid;place-items:center;color:var(--muted);font-size:13px;
}
.search-clear:hover{background:var(--surface-2);color:var(--ink)}
.toolbar-sep{width:1px;height:22px;background:var(--line);margin:0 2px}
.segmented{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface);height:32px}
.segmented button{padding:0 9px;font-size:11.5px;color:var(--muted);border-left:1px solid var(--line);font-family:var(--font-mono)}
.segmented button:first-child{border-left:0}
.segmented button.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.segmented button:hover:not(.active){background:var(--surface-2)}
.theme-btn{font-size:14px}

/* KPI */
.kpi-bar{
  flex:0 0 auto;display:flex;align-items:stretch;justify-content:space-between;gap:10px;
  min-height:40px;padding:0 16px;background:var(--paper);border-bottom:1px solid var(--line);
  position:relative;z-index:90;
}
.kpis{display:flex;align-items:center;flex-wrap:wrap;min-width:0;flex:1}
.kpi{display:flex;align-items:baseline;gap:6px;padding:7px 12px;border-left:1px solid var(--line);white-space:nowrap}
.kpi:first-child{border-left:0;padding-left:0}
.kpi-label{font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.kpi-value{font-family:var(--font-mono);font-size:14px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.kpi.is-alert .kpi-value{color:var(--red)}
.kpi-actions{display:flex;align-items:center;gap:3px;flex-wrap:wrap;justify-content:flex-end;padding:5px 0}
.kpi-action{
  height:26px;padding:0 8px;font-size:11.5px;border-radius:7px;color:var(--muted);
  border:1px solid transparent;display:inline-flex;gap:4px;align-items:center;white-space:nowrap;
}
.kpi-action:hover{background:var(--surface-2);border-color:var(--line);color:var(--ink)}
.kpi-action .badge{background:var(--accent-soft);color:var(--accent);font-family:var(--font-mono);font-size:11px;border-radius:4px;padding:0 4px;line-height:1.5}

/* 提醒条 */
.reminder-bar{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;min-height:40px;
  padding:5px 16px;background:var(--surface-2);border-bottom:1px solid var(--line);
  overflow:hidden;position:relative;z-index:85;
}
.reminder-kicker{display:flex;align-items:center;gap:6px;font-size:11.5px;letter-spacing:.08em;color:var(--muted);flex:none;white-space:nowrap}
.reminder-kicker .diamond{color:var(--amber);font-size:11px}
.reminder-groups{display:flex;align-items:center;gap:3px;flex:none;flex-wrap:nowrap}
.rgroup{
  display:inline-flex;align-items:center;gap:4px;height:23px;padding:0 7px;border-radius:6px;
  font-size:11.5px;color:var(--muted);border:1px solid transparent;white-space:nowrap;
}
.rgroup:hover{background:var(--paper);border-color:var(--line)}
.rgroup .num{font-family:var(--font-mono);font-size:11.5px;color:var(--ink)}
.rgroup.overdue{border-color:color-mix(in srgb,var(--red) 18%,transparent);color:var(--red)}
.rgroup.overdue .num{color:var(--red)}
.rgroup.upcoming{color:var(--green)}
.reminder-divider{width:1px;height:18px;background:var(--line);flex:none}
.reminder-chips{display:flex;align-items:center;gap:5px;flex:1;min-width:0;overflow:hidden;white-space:nowrap}
.reminder-empty{font-size:11.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reminder-more{
  height:22px;padding:0 7px;border-radius:6px;font-size:11.5px;color:var(--muted);
  border:1px solid var(--line);background:var(--paper);flex:none;
}
.reminder-more:hover{color:var(--ink);border-color:var(--line-strong)}
.mchip{
  display:inline-flex;align-items:center;gap:5px;max-width:180px;height:23px;padding:0 7px;
  border-radius:6px;border:1px solid var(--line);background:var(--paper);font-size:11.5px;
  color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none;
}
.mchip:hover{border-color:var(--line-strong);background:var(--surface)}
.mchip .d{font-size:10.5px;flex:none}
.mchip .t{overflow:hidden;text-overflow:ellipsis}
.mchip .when{font-family:var(--font-mono);font-size:11px;flex:none;color:var(--muted)}
.mchip.overdue,.mchip.today{background:var(--red-soft);border-color:color-mix(in srgb,var(--red) 28%,var(--line));color:var(--red)}
.mchip.urgent{background:var(--amber-soft);border-color:color-mix(in srgb,var(--amber) 28%,var(--line));color:var(--amber)}
.mchip.soon{border-color:color-mix(in srgb,var(--blue) 22%,var(--line))}
.mchip.later{color:var(--green);border-color:color-mix(in srgb,var(--green) 22%,var(--line))}
.reminder-actions{display:flex;align-items:center;gap:3px;flex:none}
.range-btn{height:23px;padding:0 6px;border-radius:6px;border:1px solid var(--line);background:var(--paper);font-size:11px;color:var(--muted);white-space:nowrap}
.range-btn:hover{color:var(--ink);border-color:var(--line-strong)}
.range-warning{font-size:11px;color:var(--red);border:1px solid color-mix(in srgb,var(--red) 25%,var(--line));background:var(--red-soft);height:22px;border-radius:6px;padding:0 6px;display:inline-flex;align-items:center;white-space:nowrap}

/* 画布 */
.canvas-shell{position:relative;flex:1 1 auto;min-height:0;display:flex;overflow:hidden;background:var(--bg)}
.canvas-wrap{
  flex:1 1 auto;min-width:0;min-height:0;overflow:auto;position:relative;
  margin-right:0;transition:margin-right .18s ease;
  overscroll-behavior:contain;
}
body.drawer-open .canvas-wrap{margin-right:calc(var(--drawer-w) + 22px)}
.board{
  display:flex;align-items:flex-start;min-width:max-content;position:relative;
  height:calc(var(--head-h) + var(--days,730) * var(--row-h));
  background:var(--surface);
}
.print-heading{display:none}

/* 时间标尺 */
.timeline{
  position:sticky;left:0;z-index:30;flex:0 0 var(--rail-w);width:var(--rail-w);
  height:calc(var(--head-h) + var(--days,730) * var(--row-h));
  background:var(--rail);border-right:1px solid var(--line-strong);
}
.timeline-head{
  position:sticky;top:0;z-index:50;height:var(--head-h);
  display:grid;grid-template-columns:46px 54px 78px;
  background:var(--paper);border-bottom:1px solid var(--line-strong);
}
.timeline-head .th{
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:9px;
  font-size:11px;letter-spacing:.14em;color:var(--muted);font-family:var(--font-mono);
  border-left:1px solid var(--line);
}
.timeline-head .th:first-child{border-left:0}
.timeline-body{position:relative;height:calc(var(--days,730) * var(--row-h))}
.tl-row{
  height:var(--row-h);display:grid;grid-template-columns:46px 54px 78px;
  border-top:1px solid var(--grid-line);background:var(--rail);
}
.tl-row:first-child{border-top:1px solid transparent}
.tl-row.weekend .tl-day-cell{background:var(--weekend-fill)}
.tl-row.today .tl-day-cell{background:var(--today-tint);position:relative}
.tl-row.today .tl-day-cell::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--red);
}
.tl-day-cell{
  grid-column:3;display:flex;align-items:center;justify-content:space-between;gap:4px;
  padding:0 8px;border-left:1px solid var(--line);min-width:0;
}
.tl-day-num{font-family:var(--font-mono);font-size:11.5px;color:var(--ink);font-variant-numeric:tabular-nums}
.tl-day-wd{font-size:11px;color:var(--muted);white-space:nowrap}
.tl-row.weekend .tl-day-num{color:var(--muted)}
.tl-row.today .tl-day-num,.tl-row.today .tl-day-wd{color:var(--red);font-weight:600}
.tl-year-block,.tl-month-block{position:absolute;top:0;z-index:1;pointer-events:none;overflow:visible}
.tl-year-block{left:0;width:46px;background:var(--rail);border-top:1px solid var(--line-strong)}
.tl-month-block{left:46px;width:54px;background:var(--rail);border-top:1px solid var(--line);border-left:1px solid var(--line)}
.tl-grp-label{
  position:sticky;top:calc(var(--head-h) + 8px);z-index:3;
  background:var(--rail);display:block;
}
.tl-year-block .tl-grp-label{
  padding:6px 0 6px 8px;font-family:var(--font-mono);font-size:11.5px;font-weight:600;
  color:var(--accent);letter-spacing:.03em;white-space:nowrap;overflow:hidden;
}
.tl-month-block .tl-grp-label{
  padding:6px 0 6px 8px;font-size:11.5px;color:var(--muted);
  white-space:nowrap;overflow:hidden;
}
.tl-month-block .tl-grp-label::before{
  content:"";display:inline-block;width:8px;height:1px;background:var(--line-strong);
  vertical-align:middle;margin-right:5px;
}

/* 登记列 */
.lanes{display:flex;align-items:flex-start;position:relative;z-index:2;flex:0 0 auto}
.lane-col{
  width:var(--lane-w);flex:0 0 var(--lane-w);position:relative;
  border-right:1px solid var(--line);background:var(--surface);
  height:calc(var(--head-h) + var(--days,730) * var(--row-h));
}
.lane-head{
  position:sticky;top:0;z-index:22;height:var(--head-h);
  display:flex;align-items:center;gap:7px;padding:0 8px 0 11px;
  background:var(--paper);border-bottom:1px solid var(--line-strong);
}
.lane-swatch{width:8px;height:8px;border-radius:2px;flex:none;border:1px solid color-mix(in srgb,#000 11%,transparent)}
.lane-title-wrap{min-width:0;flex:1;display:flex;flex-direction:column;justify-content:center;gap:1px}
.lane-name{
  font-size:12px;font-weight:600;letter-spacing:.025em;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:text;
}
.lane-meta{font-size:10.5px;color:var(--faint);font-family:var(--font-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lane-head .lane-menu-btn{
  width:24px;height:24px;border-radius:6px;font-size:15px;line-height:1;color:var(--muted);
  display:grid;place-items:center;flex:none;
}
.lane-head .lane-menu-btn:hover{background:var(--surface-2);color:var(--ink)}
.lane-grid{
  position:relative;height:calc(var(--days,730) * var(--row-h));
  background-color:var(--surface);
  background-image:
    repeating-linear-gradient(to bottom,var(--grid-line) 0,var(--grid-line) 1px,transparent 1px,transparent var(--row-h)),
    linear-gradient(to bottom,transparent 0 71.4285714%,var(--weekend-fill) 71.4285714% 100%);
  background-size:100% var(--row-h),100% calc(var(--row-h) * 7);
  background-position:0 0,0 calc(var(--start-wd,0) * var(--row-h) * -1);
  background-repeat:repeat-y,repeat-y;
  cursor:crosshair;
}
.lane-grid::after{
  content:"在空白处纵向拖拽以新建排期";position:absolute;left:50%;bottom:26px;
  transform:translateX(-50%);font-size:11px;color:var(--faint);white-space:nowrap;
  pointer-events:none;opacity:.65;display:none;
}
.lane-col:hover .lane-grid::after{display:block}
.period-line{
  position:absolute;left:0;right:0;top:calc(var(--row-h) * var(--idx,0));
  border-top:1px solid color-mix(in srgb,var(--line-strong) 72%,transparent);
  pointer-events:none;z-index:1;
}
.period-line.year{border-top:1px dashed var(--line-strong)}
.today-line{
  position:absolute;left:0;right:0;top:calc(var(--row-h) * var(--today-idx,0));
  height:2px;background:#BE413B;opacity:.9;z-index:5;pointer-events:none;
}
.today-line::after{
  content:"今天";position:absolute;right:5px;top:-15px;background:var(--red);color:#fff;
  font-size:10.5px;line-height:1;padding:2px 4px;border-radius:3px;font-family:var(--font-ui);
  letter-spacing:.04em;
}

/* 排期块 */
.bar{
  position:absolute;left:7px;right:8px;z-index:10;overflow:hidden;
  border:1px solid color-mix(in srgb,var(--bar-color) 30%,var(--line));
  border-radius:10px;
  background:color-mix(in srgb,var(--bar-color) 8%,var(--surface));
  color:var(--ink);
  cursor:grab;user-select:none;
  outline:none;
}
.bar::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--bar-color);z-index:8;
}
.bar:hover{border-color:color-mix(in srgb,var(--bar-color) 62%,var(--line))}
.bar:active{cursor:grabbing}
.bar:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.bar.is-selected{outline:2px solid color-mix(in srgb,var(--accent) 75%,transparent);outline-offset:1px}
.bar.has-conflict{border:1px dashed var(--red);background:color-mix(in srgb,var(--red) 7%,var(--surface))}
.bar.has-conflict::before{background:var(--red)}
.bar.has-unmet{border:1px solid color-mix(in srgb,var(--red) 78%,var(--line))}
.bar.is-dim{opacity:.45}
.bar.is-dragging{opacity:.92;z-index:18;cursor:grabbing}
.bar.is-resizing{opacity:.92;z-index:18}
body.dragging-active,body.dragging-active *{user-select:none!important;cursor:grabbing!important}
body.dragging-active .resize-handle{cursor:ns-resize!important}
.bar .ms-name{overflow:hidden;text-overflow:ellipsis;min-width:0}
.bar.flash{animation:barflash 1s ease-out 1}
@keyframes barflash{
  0%{outline:3px solid color-mix(in srgb,var(--brand) 55%,transparent)}
  100%{outline:2px solid transparent}
}
.bar-head{
  position:absolute;top:0;left:4px;right:5px;z-index:6;
  display:flex;align-items:flex-start;gap:5px;padding:5px 5px 4px 7px;
  pointer-events:none;min-width:0;
}
.bar-status{width:6px;height:6px;border-radius:50%;margin-top:5px;flex:none;background:var(--faint)}
.bar-status.todo{background:var(--faint)}
.bar-status.doing{background:var(--brand)}
.bar-status.done{background:var(--green)}
.bar-status.blocked{background:var(--red)}
.bar-status.cancel{background:var(--line-strong)}
.bar-title{
  font-size:11.5px;font-weight:600;line-height:1.35;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;min-width:0;flex:1;letter-spacing:.015em;
}
.bar-caption{font-size:9.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
.bar-badges{display:flex;align-items:center;gap:3px;flex:none;pointer-events:none}
.bar-badge{
  font-size:9.5px;line-height:1;padding:2px 4px;border-radius:4px;background:var(--surface);
  border:1px solid var(--line);color:var(--muted);white-space:nowrap;display:inline-flex;gap:2px;align-items:center;
}
.bar-badge.prio-high{color:var(--red);border-color:color-mix(in srgb,var(--red) 30%,var(--line))}
.bar-badge.prio-mid{color:var(--amber)}
.bar-badge.dep{color:var(--red);border-color:color-mix(in srgb,var(--red) 35%,var(--line))}
.bar-badge.conflict{color:var(--red);border-color:color-mix(in srgb,var(--red) 35%,var(--line))}
.bar-badge.ms{color:var(--blue);border-color:color-mix(in srgb,var(--blue) 26%,var(--line))}
.bar-badge.overdue{color:var(--red);border-color:color-mix(in srgb,var(--red) 25%,var(--line))}
.bar-topline{display:flex;align-items:center;gap:4px;min-width:0;width:100%}
.bar-title-line{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.bar-owner{font-size:9.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-stages{position:absolute;top:0;left:4px;right:0;bottom:0;z-index:2;pointer-events:none;overflow:hidden;border-radius:8px}
.stage-band{
  position:absolute;left:0;right:0;display:flex;align-items:center;
  border-top:1px solid color-mix(in srgb,var(--bar-color) 16%,transparent);
  background:color-mix(in srgb,var(--bar-color) 5%,transparent);
  overflow:hidden;
}
.stage-band:nth-child(even){background:color-mix(in srgb,var(--bar-color) 9%,transparent)}
.stage-band.done-stage{opacity:.8}
.stage-label{
  display:flex;align-items:center;gap:4px;min-width:0;max-width:100%;
  margin:0 7px;padding:2px 5px;border-radius:4px;
  background:color-mix(in srgb,var(--surface) 84%,transparent);
  border:1px solid color-mix(in srgb,var(--bar-color) 14%,var(--line));
  pointer-events:auto;cursor:default;
}
.stage-band.is-first .stage-label{align-self:flex-start;margin-top:27px;max-width:calc(100% - 16px)}
.stage-check{
  width:12px;height:12px;min-width:12px;border:1px solid var(--line-strong);border-radius:3px;
  background:var(--surface);display:grid;place-items:center;font-size:10.5px;line-height:1;
  color:transparent;padding:0;cursor:pointer;
}
.stage-check:hover{border-color:var(--accent)}
.stage-check.checked{background:var(--brand);border-color:var(--brand);color:#fff}
.stage-name{font-size:10px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.stage-dates{font-size:9px;color:var(--muted);font-family:var(--font-mono);white-space:nowrap;flex:none}
.stage-band.done-stage .stage-name{text-decoration:line-through;color:var(--muted)}
.bar-milestones{position:absolute;left:0;right:0;top:0;bottom:0;z-index:4;pointer-events:none;overflow:hidden;border-radius:8px}
.ms-pin{
  position:absolute;right:7px;display:flex;align-items:center;gap:3px;
  max-width:calc(100% - 24px);transform:translateY(-1px);
  background:var(--surface);border:1px solid color-mix(in srgb,var(--bar-color) 25%,var(--line));
  border-radius:4px;padding:1px 4px;font-size:10.5px;line-height:1.25;white-space:nowrap;
  color:var(--ink);overflow:hidden;text-overflow:ellipsis;
}
.ms-pin .diamond{font-size:9.5px;color:var(--bar-color);flex:none}
.ms-pin .ms-date{font-family:var(--font-mono);font-size:9px;color:var(--muted);flex:none}
.ms-pin.is-done{opacity:.62;text-decoration:line-through}
.ms-pin.is-near{border-color:color-mix(in srgb,var(--red) 55%,var(--line));color:var(--red)}
.ms-pin.is-near .diamond{color:var(--red)}
.ms-pin.is-today{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.bar-progress{
  position:absolute;left:4px;right:0;bottom:0;height:3px;background:color-mix(in srgb,var(--bar-color) 12%,transparent);
  z-index:7;overflow:hidden;pointer-events:none;
}
.bar-progress > i{display:block;height:100%;background:var(--bar-color);width:0;transition:width .15s}
.resize-handle{
  position:absolute;left:0;right:0;bottom:0;height:8px;z-index:12;cursor:ns-resize;
}
.resize-handle::after{
  content:"";position:absolute;left:50%;bottom:2px;width:18px;height:2px;border-radius:2px;
  background:color-mix(in srgb,var(--bar-color) 35%,transparent);transform:translateX(-50%);opacity:0;
}
.bar:hover .resize-handle::after{opacity:1}
.bar.is-compact .bar-head{position:absolute;inset:0;left:9px;right:7px;padding:0 0 3px;align-items:center;gap:4px}
.bar.is-compact .bar-topline{align-items:center;gap:4px}
.bar.is-compact .bar-title-line{flex-direction:row;align-items:center;gap:4px}
.bar.is-compact .bar-title{font-size:11px;line-height:1.25}
.bar.is-compact .bar-owner,.bar.is-compact .bar-caption,.bar.is-compact .bar-stages,.bar.is-compact .bar-milestones{display:none!important}
.bar.is-compact .bar-status{margin-top:0}
.bar.is-compact .bar-badges{gap:2px}
.bar.is-compact .bar-badge{padding:1px 3px;font-size:9px}
.bar.is-compact .bar-badge.prio-badge,.bar.is-compact .bar-badge.dep,.bar.is-compact .bar-badge.conflict,.bar.is-compact .bar-badge.overdue{display:none}
.bar.is-compact .bar-progress{height:2px}
.bar-date-float{
  position:fixed;z-index:260;pointer-events:none;background:var(--ink);color:var(--paper);
  border-radius:6px;padding:5px 8px;font-size:11.5px;font-family:var(--font-mono);
  white-space:nowrap;transform:translate(-50%,-100%);
}
.create-selection{
  position:absolute;left:7px;right:8px;z-index:16;border-radius:9px;
  border:1px dashed var(--brand);background:color-mix(in srgb,var(--brand) 10%,transparent);
  pointer-events:none;display:flex;align-items:center;padding:0 9px;
}
.create-selection span{
  background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:2px 6px;
  font-size:11px;color:var(--accent);white-space:nowrap;font-family:var(--font-mono);
}
.empty-overlay{
  position:absolute;inset:0;z-index:70;display:flex;align-items:flex-start;justify-content:center;
  padding-top:72px;pointer-events:none;
}
.empty-guide{
  pointer-events:auto;width:min(540px,calc(100% - 40px));background:var(--paper);
  border:1px solid var(--line);border-radius:10px;padding:22px 24px 20px;
  margin-left:var(--rail-w);
}
.empty-guide .eyebrow{margin-bottom:6px}
.empty-guide h2{margin:0 0 6px;font-size:18px;font-weight:600;letter-spacing:.02em}
.empty-guide p{margin:0 0 14px;color:var(--muted);font-size:12px;line-height:1.7}
.empty-steps{display:flex;flex-direction:column;gap:7px;margin:14px 0 16px}
.empty-step{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--muted);line-height:1.6}
.empty-step b{font-family:var(--font-mono);font-size:11px;color:var(--accent);width:17px;height:17px;border:1px solid var(--line);border-radius:4px;display:grid;place-items:center;flex:none;margin-top:1px}
.empty-step span{min-width:0}
.nolane-overlay{z-index:69}

/* 抽屉 */
.drawer{
  position:fixed;top:calc(var(--chrome-h,128px) + 8px);right:10px;bottom:10px;
  width:var(--drawer-w);max-width:calc(100vw - 28px);
  background:var(--paper);border:1px solid var(--line-strong);border-radius:var(--radius);
  z-index:150;display:flex;flex-direction:column;overflow:hidden;
  transform:translateX(calc(100% + 24px));visibility:hidden;
  transition:transform .18s ease,visibility .18s;
}
body.drawer-open .drawer{transform:translateX(0);visibility:visible}
.drawer-head{
  flex:none;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
  padding:13px 14px 10px 16px;border-bottom:1px solid var(--line);background:var(--paper);
}
.drawer-head-copy{min-width:0}
.drawer-kicker{font-size:11px;letter-spacing:.11em;color:var(--muted);font-family:var(--font-mono);margin-bottom:2px}
.drawer-title-input{
  width:100%;height:auto!important;border:0!important;background:transparent!important;padding:0!important;
  font-size:16px!important;font-weight:600;letter-spacing:.015em;border-radius:0!important;
}
.drawer-title-input:focus{outline:none;border-bottom:1px solid var(--accent)!important}
.drawer-sub{font-size:11px;color:var(--faint);margin-top:3px;font-family:var(--font-mono)}
.drawer-close{width:27px;height:27px;border-radius:7px;display:grid;place-items:center;color:var(--muted);font-size:16px;flex:none}
.drawer-close:hover{background:var(--surface-2);color:var(--ink)}
.drawer-scroll{flex:1;min-height:0;overflow:auto;padding:0 16px 20px}
.drawer-section{padding:13px 0 2px;border-bottom:1px solid var(--line)}
.drawer-section:last-child{border-bottom:0}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.section-title{font-size:11.5px;font-weight:600;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.section-hint{font-size:11px;color:var(--faint)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.form-grid.one{grid-template-columns:1fr}
.form-grid.three{grid-template-columns:1fr 1fr auto}
.form-field{min-width:0}
.form-field.full{grid-column:1/-1}
.form-field input[type="text"],.form-field input[type="number"],.form-field select{width:100%}
.form-field .row-control{display:flex;gap:5px;align-items:center}
.form-field .row-control input[type="number"]{width:56px;flex:none}
.form-field .row-control input[type="range"]{flex:1}
.color-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.color-swatch{
  width:23px;height:23px;border-radius:6px;border:2px solid transparent;position:relative;
  padding:0;background:var(--swatch);outline:1px solid color-mix(in srgb,#000 12%,transparent);
}
.color-swatch.active{border-color:var(--surface);outline:2px solid var(--ink)}
.color-swatch:hover{transform:translateY(-1px)}
.color-custom{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);margin-left:2px}
.tag-editor{display:flex;flex-wrap:wrap;gap:4px;padding:4px 5px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-height:30px}
.tag-editor input{border:0!important;height:21px!important;flex:1;min-width:60px;padding:0 2px!important;background:transparent!important}
.tag-chip{display:inline-flex;align-items:center;gap:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:1px 4px;font-size:11px;color:var(--muted)}
.tag-chip button{color:var(--faint);font-size:11.5px;line-height:1;padding:0}
.tag-chip button:hover{color:var(--red)}
.stage-editor,.ms-editor{display:flex;flex-direction:column;gap:7px}
.stage-item,.ms-item{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:7px}
.stage-item.done,.ms-item.done{background:var(--surface-2)}
.stage-item.done .stage-item-head input[type="text"],.ms-item.done .ms-item-head input[type="text"]{text-decoration:line-through;color:var(--muted)}
.ms-item.drawer-focus,.stage-item.drawer-focus{outline:2px solid var(--accent);outline-offset:1px}
.stage-item-head,.ms-item-head{display:flex;align-items:center;gap:6px;min-width:0}
.drag-dot{width:9px;height:9px;border-radius:2px;background:color-mix(in srgb,var(--brand) 20%,var(--line));flex:none}
.stage-item-head input[type="text"],.ms-item-head input[type="text"]{flex:1;min-width:0;height:26px;font-size:12px;border-color:transparent;background:transparent;padding:0 4px;font-weight:500}
.stage-item-head input[type="text"]:hover,.ms-item-head input[type="text"]:hover{border-color:var(--line)}
.stage-item-head input[type="text"]:focus,.ms-item-head input[type="text"]:focus{border-color:var(--accent);background:var(--surface)}
.icon-mini{width:21px;height:21px;border-radius:5px;color:var(--faint);display:grid;place-items:center;font-size:12px;flex:none}
.icon-mini:hover{background:var(--surface-2);color:var(--red)}
.stage-item-meta,.ms-item-meta{display:flex;align-items:center;gap:5px;margin-top:5px;flex-wrap:wrap}
.stage-item-meta input.date-iso,.ms-item-meta input.date-iso{height:24px;font-size:11.5px;padding:0 5px;flex:none;background:var(--surface);width:92px}
.ms-item-meta input[type="text"]:not(.date-iso){height:24px;font-size:11.5px;flex:1;min-width:80px;padding:0 6px}
.stage-empty,.ms-empty,.dep-empty{border:1px dashed var(--line);border-radius:8px;padding:10px;color:var(--faint);font-size:11.5px;text-align:center}
.mini-add{width:100%;height:27px;border:1px dashed var(--line-strong);border-radius:7px;background:transparent;color:var(--muted);font-size:11.5px;margin-top:7px}
.mini-add:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.stage-tools{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-top:7px}
.template-select{height:26px!important;font-size:11.5px!important;padding:0 4px!important;max-width:120px}
.dep-list{display:flex;flex-direction:column;gap:5px}
.dep-item{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--surface);font-size:11.5px;min-width:0}
.dep-item .dep-icon{color:var(--amber);flex:none;font-size:11px}
.dep-item .dep-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.dep-item .dep-status{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);flex:none}
.dep-item .dep-status.unmet{color:var(--red)}
.dep-add-row{display:flex;gap:5px;align-items:center;margin-top:7px}
.dep-add-row select{flex:1;min-width:0;height:27px;font-size:11.5px}
.drawer-note{font-size:11px;color:var(--faint);line-height:1.5}
.drawer-foot{
  flex:none;display:flex;align-items:center;gap:6px;padding:9px 12px;border-top:1px solid var(--line);
  background:var(--paper);
}
.drawer-foot .spacer{flex:1}
.drawer-foot .btn{height:28px;font-size:11.5px;padding:0 8px}
.drawer-foot .danger-btn{width:28px;padding:0;color:var(--red)}
.drawer-foot .danger-btn:hover{background:var(--red-soft)}

/* 菜单层 */
.menu-layer{position:fixed;inset:0;z-index:190;display:none}
.menu-layer.open{display:block}
.menu-backdrop{position:absolute;inset:0}
.popover{
  position:fixed;min-width:190px;max-width:260px;max-height:70vh;overflow:auto;
  background:var(--paper);border:1px solid var(--line-strong);border-radius:10px;
  padding:5px;z-index:195;
}
.popover-section{font-size:10.5px;letter-spacing:.12em;color:var(--faint);padding:6px 8px 3px;text-transform:uppercase;font-family:var(--font-mono)}
.popover-item{
  display:flex;align-items:center;gap:7px;width:100%;min-height:28px;padding:5px 8px;
  text-align:left;border-radius:6px;font-size:12px;color:var(--ink);
}
.popover-item:hover{background:var(--surface-2)}
.popover-item .shortcut{margin-left:auto;color:var(--faint);font-family:var(--font-mono);font-size:11px;flex:none}
.popover-item .mi{width:14px;text-align:center;color:var(--muted);font-size:12px;flex:none}
.popover-item.danger{color:var(--red)}
.popover-item.danger .mi{color:var(--red)}
.popover-sep{height:1px;background:var(--line);margin:4px 2px}
.popover-empty{font-size:11.5px;color:var(--faint);padding:7px 8px}

/* 模态层 */
.modal-layer{
  position:fixed;inset:0;z-index:210;display:none;align-items:center;justify-content:center;
  background:rgba(15,26,23,.34);padding:18px;
}
:root[data-theme="dark"] .modal-layer{background:rgba(0,0,0,.55)}
.modal-layer.open{display:flex}
.modal{
  width:min(560px,calc(100vw - 30px));max-height:min(88vh,820px);display:flex;flex-direction:column;
  background:var(--paper);border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;
}
.modal.wide{width:min(900px,calc(100vw - 30px))}
.modal.xwide{width:min(1080px,calc(100vw - 30px))}
.modal-head{display:flex;align-items:flex-start;gap:12px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.modal-title-wrap{min-width:0;flex:1}
.modal-kicker{font-size:11px;letter-spacing:.14em;color:var(--muted);font-family:var(--font-mono);margin-bottom:3px}
.modal-title{margin:0;font-size:17px;line-height:1.35;font-weight:600;letter-spacing:.015em}
.modal-close{width:27px;height:27px;border-radius:7px;display:grid;place-items:center;color:var(--muted);font-size:17px;flex:none}
.modal-close:hover{background:var(--surface-2);color:var(--ink)}
.modal-body{padding:14px 18px 16px;overflow:auto;min-height:0}
.modal-foot{display:flex;align-items:center;gap:7px;justify-content:flex-end;padding:11px 18px;border-top:1px solid var(--line);background:var(--paper)}
.modal-foot .left-note{margin-right:auto;font-size:11px;color:var(--muted)}
.form-stack{display:flex;flex-direction:column;gap:11px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-row.three{grid-template-columns:1fr 1fr 1fr}
.form-row.one{grid-template-columns:1fr}
.dialog-copy{font-size:12px;line-height:1.7;color:var(--muted);margin:0}
.dialog-copy strong{color:var(--ink);font-weight:600}
.modal-callout{border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:9px 10px;font-size:11.5px;color:var(--muted);line-height:1.6}
.modal-callout.warn{border-color:color-mix(in srgb,var(--amber) 35%,var(--line));background:var(--amber-soft);color:var(--amber)}
.modal-callout.danger{border-color:color-mix(in srgb,var(--red) 30%,var(--line));background:var(--red-soft);color:var(--red)}
.lane-manage-list{display:flex;flex-direction:column;gap:5px}
.lane-manage-row{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--surface)}
.lane-manage-row .lm-swatch{width:8px;height:8px;border-radius:2px;flex:none}
.lane-manage-row .lm-name{font-size:12px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lane-manage-row .lm-count{font-family:var(--font-mono);font-size:11px;color:var(--faint);flex:none}
.lane-manage-row .lm-hidden{font-size:11px;color:var(--muted)}
.lane-manage-row label{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);cursor:pointer;flex:none}
.lane-manage-actions{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;flex-wrap:wrap}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0 1px}
.switch-label{font-size:12px;color:var(--ink)}
.switch-desc{font-size:11px;color:var(--faint);margin-top:1px}
.switch{position:relative;width:30px;height:17px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;background:var(--line-strong);border-radius:9px;transition:background .15s;cursor:pointer}
.switch span::after{content:"";position:absolute;width:13px;height:13px;left:2px;top:2px;background:var(--surface);border-radius:50%;transition:transform .15s}

.badge-pill.done{color:var(--green);border-color:color-mix(in srgb,var(--green) 28%,var(--line))}

.badge-pill.blocked{color:var(--red);border-color:color-mix(in srgb,var(--red) 28%,var(--line))}

.report-week-nav{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.report-week-label{font-size:12px;font-family:var(--font-mono);color:var(--ink);min-width:190px;text-align:center}

.dep-graph-note{font-size:11px;color:var(--muted);line-height:1.7;margin-bottom:10px}

.help-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.help-section h3{font-size:12px;letter-spacing:.08em;color:var(--muted);margin:0 0 7px;font-weight:600}

.conflict-stat-note{font-size:11px;color:var(--faint);margin-top:8px}
.empty-table a{color:var(--accent);text-decoration:underline;cursor:pointer}
.file-note{font-size:11px;color:var(--faint);margin-top:7px}
.color-grid{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.color-grid .color-swatch{width:28px;height:28px;border-radius:7px}
.import-preview{display:flex;gap:14px;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--surface);font-size:11.5px;color:var(--muted);margin:9px 0}
.import-preview b{font-family:var(--font-mono);color:var(--ink)}
.storage-alert{
  display:none;background:var(--red-soft);border-bottom:1px solid color-mix(in srgb,var(--red) 35%,var(--line));
  color:var(--red);font-size:11.5px;padding:5px 16px;align-items:center;justify-content:space-between;gap:10px;
  flex:none;z-index:110;
}
body.storage-error .storage-alert{display:flex}
.storage-alert button{color:var(--red);text-decoration:underline;font-size:11.5px}
.toast-layer{
  position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:300;
  display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:min(520px,calc(100vw - 24px));
}
.toast{
  background:var(--ink);color:var(--paper);border:1px solid transparent;border-radius:8px;
  padding:7px 12px;font-size:12px;line-height:1.45;max-width:100%;
  opacity:0;transform:translateY(4px);transition:opacity .18s,transform .18s;
  pointer-events:auto;
}
.toast.show{opacity:1;transform:translateY(0)}
.toast.error{background:var(--red);color:#fff}
.toast.success{background:var(--brand);color:#fff}
.toast.warn{background:var(--amber);color:#fff}
.toast-action{margin-left:8px;text-decoration:underline;font-size:11.5px;color:inherit}
.print-only{display:none}

<script>
(() => {
'use strict';

/* ============================================================
   常量与基础工具
   ============================================================ */
const STORAGE_KEY = 'schedule-station-v1';
const DAY_MS = 86400000;
const HISTORY_LIMIT = 60;
const RANGE_LIMIT = 1500;
const PRESET_COLORS = ['#0D5C5A','#BE413B','#C08A3E','#4A6FA5','#6B5B8E','#3E7A5E','#A05C73','#777F8A'];
const COLOR_RE = /^#[0-9a-fA-F]{6}$/;
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
const STATUS = {
  todo:   { label:'未开始', order:0 },
  doing:  { label:'进行中', order:1 },
  done:   { label:'已完成', order:2 },
  blocked:{ label:'阻塞',   order:3 },
  cancel: { label:'已取消', order:4 }
};
const PRIORITY = {
  high:{ label:'高', order:0, short:'高' },
  mid: { label:'中', order:1, short:'中' },
  low: { label:'低', order:2, short:'低' }
};
const WEEKDAYS = ['周日','周一','周二','周三','周四','周五','周六'];

let db = makeBlankState();
let currentRange = null;
let selectedBarId = null;
let currentQuery = '';
let currentStatus = 'all';
let undoStack = [];
let redoStack = [];
let pendingFieldEdit = null;
let activePopover = null;
let modalState = null;
let suppressBarClickUntil = 0;
let pointerOp = null;
let dragFloatEl = null;
let saveErrorToastAt = 0;
let bootIssues = [];
let lastAutoScrolled = false;
let activeLoadMode = 'week';

function $(id){ return document.getElementById(id); }
function qs(sel, root=document){ return root.querySelector(sel); }
function qsa(sel, root=document){ return Array.from(root.querySelectorAll(sel)); }
function clamp(n,min,max){ return Math.max(min, Math.min(max, n)); }
function esc(value){
  return String(value == null ? '' : value).replace(/[&<>"']/g, ch => (
    ch === '&' ? '&amp;' : ch === '<' ? '&lt;' : ch === '>' ? '&gt;' : ch === '"' ? '&quot;' : '&#39;'
  ));
}
function escAttr(value){ return esc(value); }
function uid(prefix='id'){
  let rand = '';
  try {
    if (window.crypto && typeof window.crypto.randomUUID === 'function') {
      rand = window.crypto.randomUUID().replace(/-/g,'').slice(0,12);
    }
  } catch (_) {}
  if (!rand) rand = Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
  return prefix + '_' + rand;
}
function uniqueId(prefix, used){
  let id = uid(prefix);
  while (used.has(id)) id = uid(prefix);
  used.add(id);
  return id;
}

/* ---------- UTC 日期工具：所有日期运算只用 UTC ---------- */
function utcDate(iso){
  if (typeof iso !== 'string' || !DATE_RE.test(iso)) return null;
  const d = new Date(iso + 'T00:00:00Z');
  if (Number.isNaN(d.getTime())) return null;
  if (d.toISOString().slice(0,10) !== iso) return null;
  return d;
}
function isValidDate(iso){ return !!utcDate(iso); }
function isoFromDate(d){
  return d.toISOString().slice(0,10);
}
function localTodayISO(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function todayISO(){ return localTodayISO(); }
function addDays(iso, n){
  const d = utcDate(iso) || utcDate(todayISO());
  d.setUTCDate(d.getUTCDate() + Number(n || 0));
  return isoFromDate(d);
}
function diffDays(fromISO, toISO){
  const a = utcDate(fromISO), b = utcDate(toISO);
  if (!a || !b) return 0;
  return Math.round((b.getTime() - a.getTime()) / DAY_MS);
}
function startOfMonthISO(iso){
  return iso.slice(0,7) + '-01';
}
function endOfMonthISO(iso){
  const d = utcDate(iso);
  if (!d) return iso;
  const y = d.getUTCFullYear(), m = d.getUTCMonth();
  return isoFromDate(new Date(Date.UTC(y, m+1, 0)));
}
function addMonthsClamped(iso, n){
  const d = utcDate(iso);
  if (!d) return iso;
  const day = d.getUTCDate();
  const target = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + Number(n || 0), 1));
  const last = new Date(Date.UTC(target.getUTCFullYear(), target.getUTCMonth()+1, 0)).getUTCDate();
  target.setUTCDate(Math.min(day, last));
  return isoFromDate(target);
}
function weekdayIndex(iso){
  const d = utcDate(iso);
  return d ? d.getUTCDay() : 0;
}
function mondayIndex(iso){
  return (weekdayIndex(iso) + 6) % 7;
}
function weekdayCN(iso){ return WEEKDAYS[weekdayIndex(iso)]; }
function fmtMD(iso){
  if (!isValidDate(iso)) return '';
  return `${Number(iso.slice(5,7))}/${Number(iso.slice(8,10))}`;
}
function fmtYMD(iso){
  if (!isValidDate(iso)) return '';
  return `${iso.slice(0,4)}-${iso.slice(5,7)}-${iso.slice(8,10)}`;
}
function fmtRange(a,b){
  if (!isValidDate(a) || !isValidDate(b)) return '';
  if (a === b) return fmtYMD(a);
  if (a.slice(0,4) === b.slice(0,4)) return `${fmtYMD(a)} → ${b.slice(5,10).replace('-','.')}`;
  return `${fmtYMD(a)} → ${fmtYMD(b)}`;
}
function fmtShortRange(a,b){
  if (!isValidDate(a) || !isValidDate(b)) return '';
  if (a === b) return fmtMD(a);
  return `${fmtMD(a)}–${fmtMD(b)}`;
}
function startOfWeekISO(iso){
  return addDays(iso, -mondayIndex(iso));
}
function bufferToHex(hex, alpha){
  const clean = normalizeHex(hex, PRESET_COLORS[0]).slice(1);
  const r = parseInt(clean.slice(0,2),16);
  const g = parseInt(clean.slice(2,4),16);
  const b = parseInt(clean.slice(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}
function normalizeHex(value, fallback=PRESET_COLORS[0]){
  let v = typeof value === 'string' ? value.trim() : '';
  if (/^#[0-9a-fA-F]{3}$/.test(v)) {
    v = '#' + v.slice(1).split('').map(ch => ch + ch).join('');
  }
  if (!COLOR_RE.test(v)) return fallback;
  return v.toUpperCase();
}
function isDarkTheme(){ return db.settings.theme === 'dark'; }

/* ============================================================
   数据模型：默认值、清洗、读取与保存
   ============================================================ */
function makeDefaultWindow(){
  const y = Number((utcDate(todayISO()) || new Date()).getUTCFullYear());
  return { start: `${y}-01-01`, end: `${y+1}-12-31` };
}
function makeDefaultSettings(){
  return {
    window: makeDefaultWindow(),
    rowH: 30,
    theme: 'light',
    extraBefore: 0,
    extraAfter: 0,
    showWeekend: true,
    hiddenLanes: [],
    stageTemplates: []
  };
}
function makeBlankState(){
  return { lanes: [], bars: [], settings: makeDefaultSettings() };
}

function normalizeTags(value){
  let arr = [];
  if (Array.isArray(value)) arr = value;
  else if (typeof value === 'string') arr = value.split(/[,，、\s]+/);
  const used = new Set();
  return arr
    .map(v => String(v == null ? '' : v).trim())
    .filter(Boolean)
    .filter(v => {
      if (used.has(v)) return false;
      used.add(v);
      return true;
    })
    .slice(0, 20);
}

function sanitizeStage(raw, fallbackStart, fallbackEnd, usedIds){
  const src = raw && typeof raw === 'object' ? raw : {};
  let start = isValidDate(src.start) ? src.start : fallbackStart;
  let end = isValidDate(src.end) ? src.end : fallbackEnd;
  if (end < start) end = start;
  let id = typeof src.id === 'string' && src.id && !usedIds.has(src.id) ? src.id : '';
  if (!id) id = uniqueId('stage', usedIds);
  else usedIds.add(id);
  return {
    id,
    name: String(src.name == null ? '未命名阶段' : src.name).slice(0, 120),
    start,
    end,
    done: !!src.done
  };
}

function sanitizeMilestone(raw, fallbackDate, usedIds){
  const src = raw && typeof raw === 'object' ? raw : {};
  let id = typeof src.id === 'string' && src.id && !usedIds.has(src.id) ? src.id : '';
  if (!id) id = uniqueId('ms', usedIds);
  else usedIds.add(id);
  return {
    id,
    name: String(src.name == null ? '未命名节点' : src.name).slice(0, 120),
    date: isValidDate(src.date) ? src.date : fallbackDate,
    note: String(src.note == null ? '' : src.note).slice(0, 1000),
    done: !!src.done
  };
}

function sanitizeTemplate(raw, usedIds){
  const src = raw && typeof raw === 'object' ? raw : {};
  const stages = Array.isArray(src.stages) ? src.stages.map(s => {
    const ss = s && typeof s === 'object' ? s : {};
    return {
      name: String(ss.name == null ? '' : ss.name).slice(0,120),
      offset: Math.max(0, Math.floor(Number(ss.offset) || 0)),
      duration: Math.max(1, Math.floor(Number(ss.duration) || 1))
    };
  }).filter(s => s.name).slice(0, 40) : [];
  let id = typeof src.id === 'string' && src.id && !usedIds.has(src.id) ? src.id : '';
  if (!id) id = uniqueId('tpl', usedIds);
  else usedIds.add(id);
  return {
    id,
    name: String(src.name == null ? '未命名模板' : src.name).slice(0,80),
    stages
  };
}

function sanitizeState(raw){
  const issues = [];
  const src = raw && typeof raw === 'object' ? raw : {};
  const defaults = makeDefaultSettings();
  const settingsRaw = (src.settings && typeof src.settings === 'object') ? src.settings : {};
  const lanesRaw = Array.isArray(src.lanes) ? src.lanes : [];
  const barsRaw = Array.isArray(src.bars) ? src.bars : [];

  const lanes = [];
  const laneIds = new Set();
  lanesRaw.forEach((item, index) => {
    if (!item || typeof item !== 'object') return;
    let id = typeof item.id === 'string' && item.id ? item.id : '';
    if (!id || laneIds.has(id)) {
      id = uniqueId('lane', laneIds);
    } else {
      laneIds.add(id);
    }
    const name = String(item.name == null ? `工作线 ${index+1}` : item.name).slice(0,80) || `工作线 ${index+1}`;
    lanes.push({
      id,
      name,
      color: normalizeHex(item.color, PRESET_COLORS[index % PRESET_COLORS.length]),
      hidden: !!item.hidden,
      order: Number.isFinite(Number(item.order)) ? Number(item.order) : index
    });
  });
  lanes.sort((a,b) => (a.order - b.order) || a.name.localeCompare(b.name, 'zh-CN'));
  lanes.forEach((lane, i) => { lane.order = i; });

  // window
  const winRaw = (settingsRaw.window && typeof settingsRaw.window === 'object') ? settingsRaw.window : {};
  let winStart = isValidDate(winRaw.start) ? winRaw.start : defaults.window.start;
  let winEnd = isValidDate(winRaw.end) ? winRaw.end : defaults.window.end;
  if (winEnd < winStart) winEnd = winStart;

  const extraBefore = clamp(Math.floor(Number(settingsRaw.extraBefore) || 0), 0, 10000);
  const extraAfter = clamp(Math.floor(Number(settingsRaw.extraAfter) || 0), 0, 10000);
  const rowH = [24,30,40].includes(Number(settingsRaw.rowH)) ? Number(settingsRaw.rowH) : 30;
  const theme = settingsRaw.theme === 'dark' ? 'dark' : 'light';
  const showWeekend = settingsRaw.showWeekend === false ? false : true;

  const tplIds = new Set();
  const stageTemplates = Array.isArray(settingsRaw.stageTemplates)
    ? settingsRaw.stageTemplates.map(t => sanitizeTemplate(t, tplIds)).filter(t => t.stages.length > 0).slice(0,30)
    : [];

  const hiddenFromSettings = new Set(Array.isArray(settingsRaw.hiddenLanes) ? settingsRaw.hiddenLanes.filter(x => typeof x === 'string') : []);
  lanes.forEach(lane => {
    if (hiddenFromSettings.has(lane.id)) lane.hidden = true;
  });

  const bars = [];
  const barIds = new Set();
  const rawIdMap = new Map();
  barsRaw.forEach((item, index) => {
    if (!item || typeof item !== 'object') return;
    let laneId = typeof item.laneId === 'string' ? item.laneId : (lanes[0] ? lanes[0].id : '');
    if (!lanes.some(l => l.id === laneId)) {
      if (!lanes.length) return;
      laneId = lanes[0].id;
    }
    let start = isValidDate(item.start) ? item.start : todayISO();
    let end = isValidDate(item.end) ? item.end : start;
    if (end < start) end = start;
    let id = typeof item.id === 'string' && item.id ? item.id : '';
    if (!id || barIds.has(id)) {
      id = uniqueId('bar', barIds);
    } else {
      barIds.add(id);
    }
    if (typeof item.id === 'string' && item.id) rawIdMap.set(item.id, id);
    const lane = lanes.find(l => l.id === laneId);
    const status = Object.prototype.hasOwnProperty.call(STATUS, item.status) ? item.status : 'todo';
    const prio = Object.prototype.hasOwnProperty.call(PRIORITY, item.prio) ? item.prio : 'mid';
    const progress = clamp(Math.round(Number(item.progress) || 0), 0, 100);
    const stageIds = new Set();
    const stages = Array.isArray(item.stages) ? item.stages.map(s => sanitizeStage(s, start, end, stageIds)).slice(0,100) : [];
    const msIds = new Set();
    const milestones = Array.isArray(item.milestones) ? item.milestones.map(m => sanitizeMilestone(m, start, msIds)).slice(0,200) : [];
    const dependsOn = Array.isArray(item.dependsOn)
      ? item.dependsOn.filter(x => typeof x === 'string').filter((x,i,a) => a.indexOf(x) === i)
      : [];
    bars.push({
      id,
      laneId,
      title: String(item.title == null ? '未命名排期' : item.title).slice(0,200),
      start,
      end,
      color: normalizeHex(item.color, lane ? lane.color : PRESET_COLORS[0]),
      status,
      prio,
      progress,
      owner: String(item.owner == null ? '' : item.owner).slice(0,80),
      tags: normalizeTags(item.tags),
      note: String(item.note == null ? '' : item.note).slice(0,3000),
      stages,
      milestones,
      dependsOn
    });
  });

  const actualIds = new Set(bars.map(b => b.id));
  bars.forEach(bar => {
    bar.dependsOn = bar.dependsOn
      .filter(dep => dep !== bar.id && actualIds.has(dep))
      .filter((dep,i,a) => a.indexOf(dep) === i);
  });

  const settings = {
    window: { start: winStart, end: winEnd },
    rowH,
    theme,
    extraBefore,
    extraAfter,
    showWeekend,
    hiddenLanes: lanes.filter(l => l.hidden).map(l => l.id),
    stageTemplates
  };

  if (raw && typeof raw === 'object' && !Array.isArray(raw.lanes) && (raw.lanes != null)) issues.push('lanes 格式无效，已忽略');
  if (raw && typeof raw === 'object' && !Array.isArray(raw.bars) && (raw.bars != null)) issues.push('bars 格式无效，已忽略');
  return { state:{ lanes, bars, settings }, issues };
}

function loadStateFromStorage(){
  let rawText = null;
  try {
    rawText = localStorage.getItem(STORAGE_KEY);
  } catch (err) {
    bootIssues.push('无法读取 localStorage：' + err.message);
    return makeBlankState();
  }
  if (!rawText) return makeBlankState();
  try {
    const parsed = JSON.parse(rawText);
    const result = sanitizeState(parsed);
    if (result.issues.length) bootIssues.push(...result.issues);
    return result.state;
  } catch (err) {
    bootIssues.push('本机数据解析失败，已以空状态启动：' + err.message);
    return makeBlankState();
  }
}

function syncHiddenLanes(){
  if (!db || !db.settings) return;
  db.settings.hiddenLanes = db.lanes.filter(l => l.hidden).map(l => l.id);
}

function setSaveIndicator(kind, message){
  const wrap = $('saveState');
  const text = $('saveStateText');
  if (!wrap || !text) return;
  const dot = wrap.querySelector('.dot');
  dot.className = 'dot ' + (kind === 'error' ? 'error' : kind === 'saved' ? 'ok' : 'warn');
  text.textContent = message || (kind === 'error' ? '保存失败' : kind === 'saved' ? '已保存' : '待保存');
  wrap.classList.toggle('is-error', kind === 'error');
  wrap.title = kind === 'error'
    ? '本地保存失败。请立即导出 JSON 备份；数据可能无法保留。'
    : '所有数据仅保存在本机浏览器 localStorage；建议定期导出 JSON 备份。';
  document.body.classList.toggle('storage-error', kind === 'error');
  $('storageAlertText').textContent = kind === 'error'
    ? '本地保存失败，数据可能无法保留。请立即导出 JSON 备份，并检查浏览器是否禁用了本地存储。'
    : '';
}

function saveState(options = {}){
  syncHiddenLanes();
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      lanes: db.lanes,
      bars: db.bars,
      settings: db.settings
    }));
    setSaveIndicator('saved', '已保存');
    scheduleCloudSync();
    return true;
  } catch (err) {
    setSaveIndicator('error', '保存失败');
    const now = Date.now();
    if (!options.quiet && now - saveErrorToastAt > 5000) {
      saveErrorToastAt = now;
      showToast('本地保存失败：' + err.message + '。请马上导出 JSON 备份。', 'error', 7000);
    }
    return false;
  }
}

function snapshotData(){
  return JSON.stringify({ lanes: db.lanes, bars: db.bars });
}
function pushHistory(snapshot = null){
  undoStack.push(snapshot || snapshotData());
  if (undoStack.length > HISTORY_LIMIT) undoStack.shift();
  redoStack = [];
  updateHistoryButtons();
}
function updateHistoryButtons(){
  const undoBtn = $('undoBtn'), redoBtn = $('redoBtn');
  if (!undoBtn || !redoBtn) return;
  undoBtn.disabled = undoStack.length === 0;
  redoBtn.disabled = redoStack.length === 0;
  undoBtn.title = undoStack.length ? `撤销 (Ctrl+Z) · 还有 ${undoStack.length} 步` : '没有可撤销的操作';
  redoBtn.title = redoStack.length ? `重做 (Ctrl+Y / Ctrl+Shift+Z) · 还有 ${redoStack.length} 步` : '没有可重做的操作';
}
function restoreSnapshot(str){
  try {
    const data = JSON.parse(str);
    if (!data || !Array.isArray(data.lanes) || !Array.isArray(data.bars)) return false;
    db.lanes = data.lanes;
    db.bars = data.bars;
    syncHiddenLanes();
    return true;
  } catch (_) {
    return false;
  }
}
function undo(){
  if (modalState) return;
  finalizeFieldEdit();
  if (!undoStack.length) {
    showToast('没有可撤销的操作', 'info');
    return;
  }
  const current = snapshotData();
  const snap = undoStack.pop();
  if (!restoreSnapshot(snap)) {
    showToast('撤销失败：快照数据无效', 'error');
    updateHistoryButtons();
    return;
  }
  redoStack.push(current);
  closeDrawer({ silent:true });
  closePopover();
  saveState();
  refreshAll({ preserveView:true });
  updateHistoryButtons();
  showToast('已撤销', 'info');
}
function redo(){
  if (modalState) return;
  finalizeFieldEdit();
  if (!redoStack.length) {
    showToast('没有可重做的操作', 'info');
    return;
  }
  const current = snapshotData();
  const snap = redoStack.pop();
  if (!restoreSnapshot(snap)) {
    showToast('重做失败：快照数据无效', 'error');
    updateHistoryButtons();
    return;
  }
  undoStack.push(current);
  if (undoStack.length > HISTORY_LIMIT) undoStack.shift();
  closeDrawer({ silent:true });
  closePopover();
  saveState();
  refreshAll({ preserveView:true });
  updateHistoryButtons();
  showToast('已重做', 'info');
}

/* ============================================================
   当前数据查询与范围计算
   ============================================================ */
function findBar(id){ return db.bars.find(b => b.id === id) || null; }
function findLane(id){ return db.lanes.find(l => l.id === id) || null; }
function getVisibleLanesSorted(){
  return db.lanes.filter(l => !l.hidden).sort((a,b) => (a.order - b.order) || a.name.localeCompare(b.name, 'zh-CN'));
}
function getAllLanesSorted(){
  return db.lanes.slice().sort((a,b) => (a.order - b.order) || a.name.localeCompare(b.name, 'zh-CN'));
}
function makeRange(){
  const settings = db.settings;
  const today = todayISO();
  let baseStart = isValidDate(settings.window.start) ? settings.window.start : makeDefaultWindow().start;
  let baseEnd = isValidDate(settings.window.end) ? settings.window.end : makeDefaultWindow().end;
  if (baseEnd < baseStart) baseEnd = baseStart;
  let minRaw = addDays(baseStart, -clamp(Number(settings.extraBefore)||0,0,10000));
  let maxRaw = addDays(baseEnd, clamp(Number(settings.extraAfter)||0,0,10000));
  let minDate = minRaw, maxDate = maxRaw;

  db.bars.forEach(bar => {
    if (isValidDate(bar.start)) {
      if (bar.start < minDate) minDate = bar.start;
      if (bar.start > maxDate) maxDate = bar.start;
    }
    if (isValidDate(bar.end)) {
      if (bar.end < minDate) minDate = bar.end;
      if (bar.end > maxDate) maxDate = bar.end;
    }
    (bar.milestones || []).forEach(ms => {
      if (isValidDate(ms.date)) {
        if (ms.date < minDate) minDate = ms.date;
        if (ms.date > maxDate) maxDate = ms.date;
      }
    });
  });

  let start = startOfMonthISO(minDate);
  let end = endOfMonthISO(maxDate);
  let days = diffDays(start,end) + 1;
  let truncated = false;

  if (days > RANGE_LIMIT) {
    truncated = true;
    // 以今天为中心的 1500 天窗口，取整月后逐步收束，保证不超出上限。
    let centerStart = startOfMonthISO(addDays(today, -Math.floor(RANGE_LIMIT/2)));
    let centerEnd = endOfMonthISO(addDays(today, Math.floor(RANGE_LIMIT/2)));
    while (diffDays(centerStart, centerEnd) + 1 > RANGE_LIMIT) {
      centerEnd = addDays(startOfMonthISO(centerEnd), -1);
      if (centerEnd < centerStart) { centerEnd = centerStart; break; }
    }
    start = centerStart;
    end = centerEnd;
    days = diffDays(start,end) + 1;
    // 极端情况下检查
    if (days > RANGE_LIMIT) {
      end = addDays(start, RANGE_LIMIT - 1);
      days = RANGE_LIMIT;
    }
  }

  const todayIdx = (today >= start && today <= end) ? diffDays(start,today) : -1;
  return {
    start,
    end,
    days,
    startWd: mondayIndex(start),
    today,
    todayIndex: todayIdx,
    truncated,
    requestedStart: minDate,
    requestedEnd: maxDate
  };
}

function computeStats(){
  const today = todayISO();
  let doing = 0, done = 0, blocked = 0, overdue = 0, nearMilestones = 0;
  db.bars.forEach(bar => {
    if (bar.status === 'doing') doing++;
    if (bar.status === 'done') done++;
    if (bar.status === 'blocked') blocked++;
    if (bar.status !== 'done' && bar.status !== 'cancel' && bar.end < today) overdue++;
    (bar.milestones || []).forEach(ms => {
      if (ms.done) return;
      const diff = diffDays(today, ms.date);
      if (diff >= 0 && diff <= 14) nearMilestones++;
    });
  });
  const conflictInfo = computeConflicts();
  return {
    total: db.bars.length,
    doing, done, blocked, overdue, nearMilestones,
    conflicts: conflictInfo.pairs,
    conflictMap: conflictInfo.map
  };
}

function computeConflicts(){
  const map = new Map();
  let pairs = 0;
  const laneGroups = new Map();
  db.bars.forEach(bar => {
    if (bar.status === 'done' || bar.status === 'cancel') return;
    if (!laneGroups.has(bar.laneId)) laneGroups.set(bar.laneId, []);
    laneGroups.get(bar.laneId).push(bar);
  });
  laneGroups.forEach(list => {
    const sorted = list.slice().sort((a,b) => (a.start < b.start ? -1 : a.start > b.start ? 1 : (a.end < b.end ? -1 : a.end > b.end ? 1 : 0)));
    for (let i=0; i<sorted.length; i++) {
      const a = sorted[i];
      for (let j=i+1; j<sorted.length; j++) {
        const b = sorted[j];
        if (b.start > a.end) break;
        if (a.start <= b.end && b.start <= a.end) {
          pairs++;
          map.set(a.id, (map.get(a.id) || 0) + 1);
          map.set(b.id, (map.get(b.id) || 0) + 1);
        }
      }
    }
  });
  return { pairs, map };
}

function unmetDependencies(bar, barMap = null){
  const map = barMap || new Map(db.bars.map(b => [b.id, b]));
  const list = [];
  (bar.dependsOn || []).forEach(id => {
    const dep = map.get(id);
    if (dep && dep.status !== 'done') list.push(dep);
  });
  return list;
}
function isOverdueBar(bar){
  return bar.status !== 'done' && bar.status !== 'cancel' && bar.end < todayISO();
}
function milestoneBucket(diff){
  if (diff < 0) return 'overdue';
  if (diff === 0) return 'today';
  if (diff <= 3) return 'urgent';
  if (diff <= 7) return 'soon';
  if (diff <= 14) return 'later';
  return 'future';
}
function getPendingMilestones(){
  const result = [];
  const barMap = new Map(db.bars.map(b => [b.id, b]));
  const laneMap = new Map(db.lanes.map(l => [l.id, l]));
  const today = todayISO();
  db.bars.forEach(bar => {
    (bar.milestones || []).forEach(ms => {
      if (ms.done) return;
      const diff = diffDays(today, ms.date);
      result.push({
        bar, milestone: ms, lane: laneMap.get(bar.laneId) || null,
        diff, bucket: milestoneBucket(diff), barMap
      });
    });
  });
  result.sort((a,b) => a.diff - b.diff || (a.bar.title || '').localeCompare(b.bar.title || '', 'zh-CN'));
  return result;
}

/* ============================================================
   KPI / 提醒条 / 空状态
   ============================================================ */
function setKpi(id, value){
  const el = $(id);
  if (el) el.textContent = String(value);
}
function updateKpis(){
  const stats = computeStats();
  setKpi('kpiTotal', stats.total);
  setKpi('kpiDoing', stats.doing);
  setKpi('kpiDone', stats.done);
  setKpi('kpiNearMs', stats.nearMilestones);
  setKpi('kpiOverdue', stats.overdue);
  setKpi('kpiBlocked', stats.blocked);
  setKpi('kpiConflicts', stats.conflicts);
  const map = { doing:'doing', done:'done', nearMilestones:'nearMilestones', overdue:'overdue', blocked:'blocked', conflicts:'conflicts' };
  Object.entries(map).forEach(([key,dataKey]) => {
    const wrap = qs(`.kpi[data-kpi="${key}"]`);
    if (!wrap) return;
    const val = stats[dataKey];
    const alert = (key === 'conflicts' || key === 'overdue' || key === 'blocked') && val > 0;
    wrap.classList.toggle('is-alert', alert || (key === 'conflicts' && val > 0));
  });
  const hiddenCount = db.lanes.filter(l => l.hidden).length;
  const badge = $('hiddenLaneBadge');
  if (badge) {
    badge.hidden = hiddenCount === 0;
    badge.textContent = String(hiddenCount);
    badge.title = `${hiddenCount} 条登记列已隐藏`;
  }
  updateHistoryButtons();
}

function renderReminderBar(){
  const groupsEl = $('reminderGroups');
  const chipsEl = $('reminderChips');
  if (!groupsEl || !chipsEl) return;
  const all = getPendingMilestones();
  const counts = { overdue:0, today:0, urgent:0, soon:0, later:0 };
  all.forEach(item => {
    if (Object.prototype.hasOwnProperty.call(counts, item.bucket)) counts[item.bucket]++;
  });
  const groupDefs = [
    ['overdue','逾期','overdue'],
    ['today','今天','overdue'],
    ['urgent','≤3天','urgent'],
    ['soon','≤7天','soon'],
    ['later','≤14天','later']
  ];
  groupsEl.innerHTML = groupDefs.map(([key,label,cls]) => (
    `<button class="rgroup ${cls}" type="button" data-reminder-group="${key}" title="查看${label}未完成节点">
      <span>${label}</span><span class="num">${counts[key]}</span>
    </button>`
  )).join('');

  const urgent = all.filter(item => item.diff <= 14);
  if (!urgent.length) {
    chipsEl.innerHTML = `<span class="reminder-empty">${all.length ? '14 天内暂无可提醒的未完成节点' : '暂无未完成节点 · 新建排期后可添加里程碑'}</span>`;
    return;
  }
  const shown = urgent.slice(0, 8);
  const chips = shown.map(({bar, milestone, diff, bucket}) => {
    const cls = bucket === 'overdue' || bucket === 'today' ? 'overdue' : bucket;
    let when = '';
    if (diff < 0) when = `逾期 ${Math.abs(diff)} 天`;
    else if (diff === 0) when = '今天';
    else when = `还有 ${diff} 天`;
    return `<button class="mchip ${cls}" type="button" data-reminder-bar="${escAttr(bar.id)}" data-reminder-ms="${escAttr(milestone.id)}" data-reminder-date="${escAttr(milestone.date)}" title="${escAttr(bar.title)} · ${escAttr(milestone.name)} · ${escAttr(fmtYMD(milestone.date))} · ${escAttr(when)}">
      <span class="d">◆</span><span class="t">${esc(milestone.name || '未命名节点')}</span><span class="when">${esc(when)}</span>
    </button>`;
  }).join('');
  const more = urgent.length > shown.length
    ? `<button class="reminder-more" type="button" data-reminder-all="1">还有 ${urgent.length - shown.length} 个</button>`
    : '';
  chipsEl.innerHTML = chips + more;
}
