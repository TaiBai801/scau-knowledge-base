/* ============================================================
   全局 Toast
   ============================================================ */
function showToast(message, type='info', duration=3400, action=null){
  const layer = $('toastLayer');
  if (!layer) return;
  const toast = document.createElement('div');
  toast.className = 'toast ' + (type || 'info');
  toast.textContent = message;
  if (action && action.label && typeof action.onClick === 'function') {
    const btn = document.createElement('button');
    btn.className = 'toast-action';
    btn.type = 'button';
    btn.textContent = action.label;
    btn.addEventListener('click', () => {
      try { action.onClick(); } finally { toast.remove(); }
    });
    toast.appendChild(document.createTextNode(' '));
    toast.appendChild(btn);
  }
  layer.appendChild(toast);
  while (layer.children.length > 4) layer.firstElementChild.remove();
  requestAnimationFrame(() => toast.classList.add('show'));
  const timeout = setTimeout(() => {
    toast.classList.remove('show');
    setTimeout(() => toast.remove(), 220);
  }, Math.max(1200, duration));
  toast.addEventListener('click', (e) => {
    if (e.target.closest('.toast-action')) return;
    clearTimeout(timeout);
    toast.classList.remove('show');
    setTimeout(() => toast.remove(), 220);
  });
}

/* ============================================================
   筛选（不重建时间轴，不隐藏内容，只降低透明度）
   ============================================================ */
function barMatchesFilter(bar){
  if (currentStatus !== 'all' && bar.status !== currentStatus) return false;
  if (!currentQuery) return true;
  const q = currentQuery.toLocaleLowerCase('zh-CN');
  const lane = findLane(bar.laneId);
  const haystack = [
    bar.title, bar.owner, (bar.tags || []).join(' '), bar.note,
    ...(bar.stages || []).map(s => s.name),
    ...(bar.milestones || []).map(m => m.name + ' ' + (m.note || '')),
    lane ? lane.name : ''
  ].join('\n').toLocaleLowerCase('zh-CN');
  return haystack.includes(q);
}
function applyFilters(){
  qsa('.bar', $('lanes')).forEach(el => {
    const bar = findBar(el.dataset.barId);
    if (!bar) return;
    el.classList.toggle('is-dim', !barMatchesFilter(bar));
  });
}
function setSearchQuery(value){
  currentQuery = String(value || '').trim();
  const input = $('searchInput');
  if (input && input.value !== value) input.value = value;
  const clear = $('clearSearch');
  if (clear) clear.hidden = !currentQuery;
  applyFilters();
}
function setStatusFilter(value){
  currentStatus = Object.prototype.hasOwnProperty.call(STATUS, value) ? value : 'all';
  const sel = $('statusFilter');
  if (sel && sel.value !== currentStatus) sel.value = currentStatus;
  applyFilters();
}

/* ============================================================
   时间轴 / 列 / 排期块的渲染
   ============================================================ */
function setBoardRangeVars(range){
  const board = $('board');
  if (!board) return;
  board.style.setProperty('--days', String(range.days));
  board.style.setProperty('--start-wd', String(range.startWd));
  board.style.setProperty('--today-idx', String(Math.max(0, range.todayIndex)));
}

function ensurePrintHeading(){
  const wrap = $('canvas');
  if (!wrap) return null;
  let heading = qs('.print-heading', wrap);
  if (!heading) {
    heading = document.createElement('div');
    heading.className = 'print-heading';
    wrap.insertBefore(heading, $('board'));
  }
  return heading;
}

function renderTimeline(){
  currentRange = makeRange();
  const range = currentRange;
  setBoardRangeVars(range);
  const startDate = utcDate(range.start);
  const today = range.today;
  const rows = [];
  for (let i=0; i<range.days; i++) {
    const iso = addDays(range.start, i);
    const wd = (startDate.getUTCDay() + i) % 7;
    const weekend = wd === 0 || wd === 6;
    const isToday = iso === today;
    rows.push(
      `<div class="tl-row${weekend ? ' weekend' : ''}${isToday ? ' today' : ''}" data-date="${iso}">`+
        `<div class="tl-day-cell"><span class="tl-day-num">${iso.slice(8,10)}</span><span class="tl-day-wd">${WEEKDAYS[wd]}</span></div>`+
      `</div>`
    );
  }

  const yearBlocks = [];
  const startYear = Number(range.start.slice(0,4));
  const endYear = Number(range.end.slice(0,4));
  for (let y=startYear; y<=endYear; y++) {
    const ys = `${y}-01-01`, ye = `${y}-12-31`;
    const gs = ys < range.start ? range.start : ys;
    const ge = ye > range.end ? range.end : ye;
    if (gs > ge) continue;
    const topIdx = diffDays(range.start, gs);
    const count = diffDays(gs, ge) + 1;
    yearBlocks.push(
      `<div class="tl-year-block" style="top:calc(var(--row-h) * ${topIdx});height:calc(var(--row-h) * ${count})">`+
        `<span class="tl-grp-label">${y}</span>`+
      `</div>`
    );
  }
  const monthBlocks = [];
  let curMonth = startOfMonthISO(range.start);
  while (curMonth <= range.end) {
    const gs = curMonth < range.start ? range.start : curMonth;
    const geRaw = endOfMonthISO(curMonth);
    const ge = geRaw > range.end ? range.end : geRaw;
    if (gs <= ge) {
      const topIdx = diffDays(range.start, gs);
      const count = diffDays(gs, ge) + 1;
      monthBlocks.push(
        `<div class="tl-month-block" style="top:calc(var(--row-h) * ${topIdx});height:calc(var(--row-h) * ${count})">`+
          `<span class="tl-grp-label">${Number(curMonth.slice(5,7))}月</span>`+
        `</div>`
      );
    }
    curMonth = addMonthsClamped(startOfMonthISO(curMonth), 1);
    curMonth = startOfMonthISO(curMonth);
  }

  const body = $('timelineBody');
  body.innerHTML = rows.join('') + yearBlocks.join('') + monthBlocks.join('');
  const board = $('board');
  board.style.height = `calc(var(--head-h) + var(--row-h) * ${range.days})`;
  const warning = $('rangeWarning');
  if (warning) {
    warning.hidden = !range.truncated;
    warning.title = range.truncated ? `原始范围 ${fmtYMD(range.requestedStart)} → ${fmtYMD(range.requestedEnd)} 超出 ${RANGE_LIMIT} 天上限，当前已截断为 ${range.days} 天。` : '时间范围未截断';
  }
  const printHeading = ensurePrintHeading();
  if (printHeading) {
    printHeading.innerHTML = `<h2>工作排期工作站</h2><span>${esc(fmtYMD(range.start))} → ${esc(fmtYMD(range.end))} · 共 ${range.days} 天 · 仅本机</span>`;
  }
  document.body.classList.toggle('hide-weekend', !db.settings.showWeekend);
  applyTheme();
}

function computeBarTiers(list){
  const sorted = list.slice().sort((a,b) => {
    if (a.start !== b.start) return a.start < b.start ? -1 : 1;
    if (a.end !== b.end) return a.end < b.end ? 1 : -1;
    return String(a.title).localeCompare(String(b.title), 'zh-CN');
  });
  const tierEnds = [];
  const tierMap = new Map();
  sorted.forEach(bar => {
    let tier = tierEnds.findIndex(end => end < bar.start);
    if (tier === -1) {
      tier = tierEnds.length;
      tierEnds.push(bar.end);
    } else {
      tierEnds[tier] = bar.end;
    }
    tierMap.set(bar.id, Math.min(tier, 4));
  });
  return tierMap;
}

function monthAndYearLinesHtml(range){
  const out = [];
  let cur = startOfMonthISO(range.start);
  while (cur <= range.end) {
    if (cur >= range.start) {
      const idx = diffDays(range.start, cur);
      out.push(`<div class="period-line${cur.slice(5,7) === '01' ? ' year' : ''}" style="--idx:${idx}"></div>`);
    }
    cur = startOfMonthISO(addMonthsClamped(cur, 1));
  }
  return out.join('');
}

function barStatusCaption(bar){
  const parts = [STATUS[bar.status].label];
  if (bar.owner) parts.push(bar.owner);
  if (bar.tags && bar.tags.length) parts.push(bar.tags.slice(0,2).map(t => '#' + t).join(' '));
  return parts.join(' · ');
}

function makeBarMarkup(bar, lane, conflictInfo, barMap, tier){
  if (!currentRange) return '';
  const range = currentRange;
  const rawStartIdx = diffDays(range.start, bar.start);
  const rawEndIdx = diffDays(range.start, bar.end);
  if (rawEndIdx < 0 || rawStartIdx > range.days - 1) return '';
  const startIdx = clamp(rawStartIdx, 0, range.days - 1);
  const endIdx = clamp(rawEndIdx, 0, range.days - 1);
  const visibleDays = endIdx - startIdx + 1;
  if (visibleDays <= 0) return '';
  const totalDays = Math.max(1, diffDays(bar.start, bar.end) + 1);
  const compact = visibleDays * db.settings.rowH < 82;
  const conflictCount = conflictInfo.map.get(bar.id) || 0;
  const unmet = unmetDependencies(bar, barMap);
  const overdue = isOverdueBar(bar);
  const inset = Math.min(tier, 4) * 5;
  const z = 10 + Math.min(tier, 8);
  const startTop = startIdx * db.settings.rowH + 2;
  const heightValue = visibleDays * db.settings.rowH - 4;
  const stageBands = [];
  if (bar.stages && bar.stages.length) {
    const sortedStages = bar.stages.slice().sort((a,b) => (a.start < b.start ? -1 : a.start > b.start ? 1 : 0));
    sortedStages.forEach((stage, index) => {
      const offset = diffDays(bar.start, stage.start);
      const length = Math.max(1, diffDays(stage.start, stage.end) + 1);
      const isFirst = offset <= 0;
      stageBands.push(
        `<div class="stage-band${isFirst ? ' is-first' : ''}${stage.done ? ' done-stage' : ''}" style="top:calc(var(--row-h) * ${offset});height:calc(var(--row-h) * ${length})">`+
          `<span class="stage-label" title="${escAttr(stage.name)} · ${escAttr(fmtRange(stage.start,stage.end))}${stage.done ? ' · 已完成' : ''}">`+
            `<button class="stage-check${stage.done ? ' checked' : ''}" type="button" data-action="toggle-stage" data-stage-id="${escAttr(stage.id)}" title="勾选 / 取消阶段完成" aria-label="阶段完成状态">${stage.done ? '✓' : ''}</button>`+
            `<span class="stage-name">${esc(stage.name || '未命名阶段')}</span>`+
            `<span class="stage-dates">${esc(fmtShortRange(stage.start,stage.end))}</span>`+
          `</span>`+
        `</div>`
      );
    });
  }
  const msPins = [];
  const today = todayISO();
  if (bar.milestones && bar.milestones.length) {
    bar.milestones.slice().sort((a,b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0)).forEach(ms => {
      const offset = diffDays(bar.start, ms.date);
      if (offset < 0 || offset >= totalDays) return;
      const diff = diffDays(today, ms.date);
      const near = !ms.done && diff <= 3;
      const isToday = !ms.done && diff === 0;
      msPins.push(
        `<div class="ms-pin${ms.done ? ' is-done' : ''}${near ? ' is-near' : ''}${isToday ? ' is-today' : ''}" style="top:calc(var(--row-h) * ${offset} + 2px)" title="${escAttr('◆ ' + ms.name + ' · ' + fmtYMD(ms.date) + (ms.note ? ' · ' + ms.note : '') + (ms.done ? ' · 已完成' : ' · 未完成'))}">`+
          `<span class="diamond">◆</span><span class="ms-name">${esc(ms.name || '未命名节点')}</span><span class="ms-date">${esc(ms.date.slice(5).replace('-','.'))}</span>`+
        `</div>`
      );
    });
  }
  const badges = [];
  const prio = PRIORITY[bar.prio] || PRIORITY.mid;
  badges.push(`<span class="bar-badge prio-badge prio-${esc(bar.prio)}">${prio.label}</span>`);
  if (overdue) badges.push(`<span class="bar-badge overdue">逾期</span>`);
  if (conflictCount) badges.push(`<span class="bar-badge conflict" title="与同列排期日期重叠">冲突</span>`);
  if (unmet.length) badges.push(`<span class="bar-badge dep" title="前置排期尚未完成">前置未完成</span>`);
  if (bar.milestones && bar.milestones.length) {
    const pendingMs = bar.milestones.filter(m => !m.done).length;
    badges.push(`<span class="bar-badge ms" title="${bar.milestones.length} 个里程碑 · ${pendingMs} 个未完成">◆ ${bar.milestones.length}</span>`);
  }
  const caption = barStatusCaption(bar);
  const color = normalizeHex(bar.color, lane ? lane.color : PRESET_COLORS[0]);
  const title = bar.title || '未命名排期';
  const aria = `${title}，${fmtYMD(bar.start)} 至 ${fmtYMD(bar.end)}，${STATUS[bar.status].label}，优先级${prio.label}，进度${bar.progress}%`;
  return `<div class="bar${compact ? ' is-compact' : ''}${conflictCount ? ' has-conflict' : ''}${unmet.length ? ' has-unmet' : ''}${selectedBarId === bar.id ? ' is-selected' : ''}"
      data-bar-id="${escAttr(bar.id)}" data-days="${totalDays}" tabindex="0" role="button"
      aria-label="${escAttr(aria)}" title="${escAttr(aria)}"
      style="--bar-color:${color};top:calc(var(--row-h) * ${startIdx} + 2px);height:calc(var(--row-h) * ${visibleDays} - 4px);left:calc(7px + ${inset}px);z-index:${z}">
      <div class="bar-stages" aria-hidden="false">${stageBands.join('')}</div>
      <div class="bar-milestones">${msPins.join('')}</div>
      <div class="bar-head">
        <div class="bar-topline">
          <span class="bar-status ${esc(bar.status)}" title="${escAttr(STATUS[bar.status].label)}"></span>
          <div class="bar-title-line">
            <div class="bar-title">${esc(title)}</div>
            <div class="bar-caption bar-owner">${esc(caption)}</div>
          </div>
          <div class="bar-badges">${badges.join('')}</div>
        </div>
      </div>
      <div class="bar-progress" title="进度 ${bar.progress}%"><i style="width:${clamp(Number(bar.progress)||0,0,100)}%"></i></div>
      <div class="resize-handle" data-resize-handle="1" title="拖拽调整结束日期"></div>
    </div>`;
}

function renderLanes(options = {}){
  if (!currentRange) currentRange = makeRange();
  const range = currentRange;
  const lanesRoot = $('lanes');
  if (!lanesRoot) return;
  const anchor = options.preserveView === false ? null : captureScrollAnchor();
  const visibleLanes = getVisibleLanesSorted();
  const conflictInfo = computeConflicts();
  const barMap = new Map(db.bars.map(b => [b.id, b]));
  const fragments = [];
  visibleLanes.forEach(lane => {
    const laneBars = db.bars.filter(b => b.laneId === lane.id);
    const tierMap = computeBarTiers(laneBars);
    const barCount = laneBars.length;
    const msCount = laneBars.reduce((n,b) => n + (b.milestones ? b.milestones.length : 0), 0);
    const barsHtml = laneBars
      .slice()
      .sort((a,b) => (a.start < b.start ? -1 : a.start > b.start ? 1 : (a.end < b.end ? -1 : 1)))
      .map(bar => makeBarMarkup(bar, lane, conflictInfo, barMap, tierMap.get(bar.id) || 0))
      .join('');
    const todayLine = range.todayIndex >= 0 ? `<div class="today-line" aria-hidden="true"></div>` : '';
    fragments.push(
      `<div class="lane-col" data-lane-col-id="${escAttr(lane.id)}">`+
        `<header class="lane-head">`+
          `<span class="lane-swatch" style="background:${normalizeHex(lane.color, PRESET_COLORS[0])}" aria-hidden="true"></span>`+
          `<div class="lane-title-wrap">`+
            `<span class="lane-name" data-lane-name-id="${escAttr(lane.id)}" tabindex="0" title="双击重命名">${esc(lane.name)}</span>`+
            `<span class="lane-meta">${barCount} 项 · ${msCount} 节点</span>`+
          `</div>`+
          `<button class="lane-menu-btn" type="button" data-lane-menu="${escAttr(lane.id)}" aria-label="工作线菜单 ${escAttr(lane.name)}" aria-haspopup="menu">⋯</button>`+
        `</header>`+
        `<div class="lane-grid" data-lane-id="${escAttr(lane.id)}">`+
          monthAndYearLinesHtml(range)+todayLine+barsHtml+
        `</div>`+
      `</div>`
    );
  });
  lanesRoot.innerHTML = fragments.join('');
  if (anchor) restoreScrollAnchor(anchor);
}

function captureScrollAnchor(){
  const canvas = $('canvas');
  if (!canvas || !currentRange) return null;
  const rh = Number(db.settings.rowH) || 30;
  const idx = clamp(Math.floor(canvas.scrollTop / rh), 0, Math.max(0,currentRange.days-1));
  return {
    date: addDays(currentRange.start, idx),
    frac: canvas.scrollTop - idx * rh,
    left: canvas.scrollLeft
  };
}
function restoreScrollAnchor(anchor){
  const canvas = $('canvas');
  if (!canvas || !anchor || !currentRange) return;
  const rh = Number(db.settings.rowH) || 30;
  const idx = clamp(diffDays(currentRange.start, anchor.date), 0, Math.max(0,currentRange.days-1));
  canvas.scrollTop = Math.max(0, idx * rh + (anchor.frac || 0));
  canvas.scrollLeft = Math.max(0, anchor.left || 0);
}

function updateRangeChecks(){
  const warning = $('rangeWarning');
  if (!warning) return;
  warning.hidden = !(currentRange && currentRange.truncated);
}

function refreshChrome(){
  updateKpis();
  renderReminderBar();
  renderEmptyState();
  updateHistoryButtons();
  updateRangeChecks();
  updateSaveIndicatorEmpty();
  syncChromeHeightSoon();
}
function updateSaveIndicatorEmpty(){
  // 保存状态由 saveState 管理；此处仅确保提示文本不会覆盖错误状态。
}
function refreshLanes(){
  renderLanes({ preserveView:true });
  refreshChrome();
  applyFilters();
}
function refreshAll(options = {}){
  const preserve = options.preserveView !== false;
  const anchor = preserve ? captureScrollAnchor() : null;
  renderTimeline();
  renderLanes({ preserveView:false });
  if (anchor) restoreScrollAnchor(anchor);
  if (options.autoToday) requestAnimationFrame(() => scrollToToday({ smooth:false }));
  refreshChrome();
  applyFilters();
  syncChromeHeightSoon();
}

function applyTheme(){
  document.documentElement.dataset.theme = db.settings.theme === 'dark' ? 'dark' : 'light';
  const btn = $('themeBtn');
  if (btn) {
    btn.textContent = db.settings.theme === 'dark' ? '☀' : '◐';
    btn.title = db.settings.theme === 'dark' ? '切换到浅色主题' : '切换到深色主题';
    btn.setAttribute('aria-label', btn.title);
  }
}

function syncChromeHeight(){
  const topbar = qs('.topbar');
  const kpi = qs('.kpi-bar');
  const reminder = qs('.reminder-bar');
  const storage = $('storageAlert');
  const isStorageVisible = storage && getComputedStyle(storage).display !== 'none';
  const h = (topbar ? topbar.offsetHeight : 0) +
            (kpi ? kpi.offsetHeight : 0) +
            (reminder ? reminder.offsetHeight : 0) +
            (isStorageVisible ? storage.offsetHeight : 0);
  document.documentElement.style.setProperty('--chrome-h', String(h) + 'px');
}
let chromeHeightRaf = 0;
function syncChromeHeightSoon(){
  if (chromeHeightRaf) cancelAnimationFrame(chromeHeightRaf);
  chromeHeightRaf = requestAnimationFrame(() => {
    chromeHeightRaf = 0;
    syncChromeHeight();
  });
}

/* ============================================================
   滚动与定位
   ============================================================ */
function getViewportMetrics(){
  const canvas = $('canvas');
  const rect = canvas.getBoundingClientRect();
  return { canvas, rect, width: canvas.clientWidth, height: canvas.clientHeight, rail: 178 };
}
function scrollCanvasToDate(iso, options = {}){
  if (!currentRange) return;
  const idx = diffDays(currentRange.start, iso);
  if (idx < 0 || idx >= currentRange.days) {
    return false;
  }
  const canvas = $('canvas');
  const rh = Number(db.settings.rowH) || 30;
  // 让目标日期位于吸顶表头之下约 82px 处，避免被表头遮住。
  const targetTop = Math.max(0, idx * rh - 82);
  canvas.scrollTo({ top: targetTop, left: canvas.scrollLeft, behavior: options.smooth ? 'smooth' : 'auto' });
  if (options.laneId) {
    requestAnimationFrame(() => scrollLaneIntoView(options.laneId, options.smooth));
  }
  return true;
}
function scrollToToday(options = {}){
  if (!currentRange) currentRange = makeRange();
  const today = todayISO();
  if (currentRange.todayIndex < 0) {
    if (options.resetIfMissing) {
      db.settings.window = makeDefaultWindow();
      db.settings.extraBefore = 0;
      db.settings.extraAfter = 0;
      saveState({ quiet:true });
      refreshAll({ preserveView:false });
      requestAnimationFrame(() => scrollToToday({ smooth:true }));
      showToast('已把时间范围重置为当前年份与次年', 'info');
      return true;
    }
    showToast('今天不在当前时间范围内。可按 T 重设范围，或使用「前扩 / 后扩」调整。', 'warn', 5000);
    return false;
  }
  return scrollCanvasToDate(today, { smooth: options.smooth !== false });
}
function scrollLaneIntoView(laneId, smooth=false){
  const canvas = $('canvas');
  const laneEl = qs(`.lane-col[data-lane-col-id="${CSS.escape(laneId)}"]`);
  if (!canvas || !laneEl) return;
  const cRect = canvas.getBoundingClientRect();
  const lRect = laneEl.getBoundingClientRect();
  const contentLeft = lRect.left - cRect.left + canvas.scrollLeft;
  const rail = 178;
  const target = Math.max(0, contentLeft - rail - 10);
  canvas.scrollTo({ left: target, top: canvas.scrollTop, behavior: smooth ? 'smooth' : 'auto' });
}
function flashBar(barId){
  const el = qs(`.bar[data-bar-id="${CSS.escape(barId)}"]`);
  if (!el) return;
  el.classList.remove('flash');
  void el.offsetWidth;
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 1100);
}
function navigateToBarDate(barId, date, options = {}){
  const bar = findBar(barId);
  if (!bar) {
    showToast('对应排期已不存在', 'warn');
    return;
  }
  const lane = findLane(bar.laneId);
  if (lane && lane.hidden) {
    // 用户主动从提醒跳转时，恢复被隐藏的列以便定位。
    lane.hidden = false;
    syncHiddenLanes();
    saveState({ quiet:true });
    refreshAll({ preserveView:true });
    showToast(`已恢复显示「${lane.name}」`, 'info', 2600);
  }
  const targetDate = isValidDate(date) ? date : bar.start;
  requestAnimationFrame(() => {
    if (!scrollCanvasToDate(targetDate, { smooth:true, laneId: bar.laneId })) {
      scrollCanvasToDate(bar.start, { smooth:true, laneId: bar.laneId });
    }
    openDrawer(barId, { focusTitle:false, milestoneDate: date || null });
    setTimeout(() => flashBar(barId), 180);
  });
}

   字段编辑历史（输入过程不重建抽屉/时间轴）
   ============================================================ */
function beginFieldEdit(){
  if (!selectedBarId) return;
  if (pendingFieldEdit) {
    if (pendingFieldEdit.barId === selectedBarId) return;
    finalizeFieldEdit();
  }
  pendingFieldEdit = { barId: selectedBarId, snapshot: snapshotData() };
}
function finalizeFieldEdit(){
  if (!pendingFieldEdit) return false;
  const pending = pendingFieldEdit;
  pendingFieldEdit = null;
  const current = snapshotData();
  if (current !== pending.snapshot) {
    pushHistory(pending.snapshot);
    saveState({ quiet:true });
    return true;
  }
  return false;
}
function beginImmediateAction(){
  finalizeFieldEdit();
  pushHistory();
}

function updateDrawerHeaderMeta(){
  const bar = selectedBarId ? findBar(selectedBarId) : null;
  if (!bar) return;
  const lane = findLane(bar.laneId);
  const titleInput = $('drawerTitle');
  if (titleInput && document.activeElement !== titleInput) titleInput.value = bar.title;
  const sub = $('drawerSub');
  if (sub) {
    sub.textContent = `${fmtRange(bar.start, bar.end)} · ${lane ? lane.name : '未归属列'} · ${bar.id.slice(0,18)}`;
  }
}

function colorPaletteHtml(selected, prefix){
  return PRESET_COLORS.map(c => (
    `<button class="color-swatch${normalizeHex(selected,c) === c ? ' active' : ''}" type="button"
      style="--swatch:${c}" data-${prefix}-color="${c}"
      title="${c}" aria-label="选择颜色 ${c}"></button>`
  )).join('');
}

function stageTemplateOptionsHtml(bar){
  const templates = Array.isArray(db.settings.stageTemplates) ? db.settings.stageTemplates : [];
  if (!templates.length) return '<option value="">暂无已保存模板</option>';

    `<option value="${escAttr(t.id)}">${esc(t.name)} · ${t.stages.length} 段</option>`
  )).join('');
}

function dependencyOptionsHtml(bar){
  const existing = new Set(bar.dependsOn || []);
  const options = [];
  getAllLanesSorted().forEach(lane => {
    const laneBars = db.bars
      .filter(b => b.laneId === lane.id && b.id !== bar.id && !existing.has(b.id))
      .sort((a,b) => a.start.localeCompare(b.start));
    laneBars.forEach(b => {
      const status = STATUS[b.status] ? STATUS[b.status].label : b.status;
      options.push(`<option value="${escAttr(b.id)}">${esc(lane.name)} / ${esc(b.title || '未命名排期')} · ${esc(fmtYMD(b.start))} · ${esc(status)}</option>`);
    });
  });
  return options.join('');
}

function renderDrawer(){
  if (!selectedBarId) return;
  const bar = findBar(selectedBarId);
  if (!bar) {
    closeDrawer({ silent:true });
    return;
  }
  const lane = findLane(bar.laneId);
  const barMap = new Map(db.bars.map(b => [b.id,b]));
  const unmet = unmetDependencies(bar, barMap);
  updateDrawerHeaderMeta();
  const kicker = $('drawerKicker');
  if (kicker) kicker.textContent = `${lane ? lane.name : '未归属'} / DETAIL`;
  const body = $('drawerBody');
  if (!body) return;
  const stageItems = (bar.stages || []).slice().sort((a,b) => a.start.localeCompare(b.start)).map(stage => (
    `<div class="stage-item${stage.done ? ' done' : ''}" data-stage-id="${escAttr(stage.id)}">
      <div class="stage-item-head">
        <input type="checkbox" data-stage-field="done" title="标记该阶段完成" ${stage.done ? 'checked' : ''}>
        <input type="text" data-stage-field="name" value="${escAttr(stage.name)}" placeholder="阶段名称" maxlength="120">
        <button class="icon-mini" type="button" data-drawer-action="delete-stage" data-stage-id="${escAttr(stage.id)}" title="删除阶段">×</button>
      </div>
      <div class="stage-item-meta">
        <input class="date-iso" type="text" inputmode="numeric" maxlength="10" autocomplete="off" spellcheck="false" data-stage-field="start" value="${escAttr(stage.start)}" placeholder="YYYY-MM-DD" title="阶段开始日期，格式 YYYY-MM-DD">
        <span class="hint">→</span>
        <input class="date-iso" type="text" inputmode="numeric" maxlength="10" autocomplete="off" spellcheck="false" data-stage-field="end" value="${escAttr(stage.end)}" placeholder="YYYY-MM-DD" title="阶段结束日期，格式 YYYY-MM-DD">
        <span class="hint stage-range-hint" title="阶段按日期在块内纵向分段，超出块范围会裁剪显示">${esc(fmtShortRange(stage.start, stage.end))}</span>
      </div>
    </div>`
  )).join('');
  const milestoneItems = (bar.milestones || []).slice().sort((a,b) => a.date.localeCompare(b.date)).map(ms => {
    const diff = diffDays(todayISO(), ms.date);
    let when = '';
    if (ms.done) when = '已完成';
    else if (diff < 0) when = `逾期 ${Math.abs(diff)} 天`;
    else if (diff === 0) when = '今天';
    else when = `还有 ${diff} 天`;
    return `<div class="ms-item${ms.done ? ' done' : ''}" data-ms-id="${escAttr(ms.id)}" data-ms-date="${escAttr(ms.date)}">
      <div class="ms-item-head">
        <input type="checkbox" data-ms-field="done" title="标记节点完成" ${ms.done ? 'checked' : ''}>
        <input type="text" data-ms-field="name" value="${escAttr(ms.name)}" placeholder="节点名称" maxlength="120">
        <button class="icon-mini" type="button" data-drawer-action="delete-ms" data-ms-id="${escAttr(ms.id)}" title="删除里程碑">×</button>
      </div>
      <div class="ms-item-meta">
        <input class="date-iso" type="text" inputmode="numeric" maxlength="10" autocomplete="off" spellcheck="false" data-ms-field="date" value="${escAttr(ms.date)}" placeholder="YYYY-MM-DD" title="节点日期，格式 YYYY-MM-DD">
        <span class="hint ms-when" style="color:${!ms.done && diff <= 3 ? 'var(--red)' : 'var(--faint)'}">◆ ${esc(when)}</span>
      </div>
      <div class="ms-item-meta">
        <input type="text" data-ms-field="note" value="${escAttr(ms.note || '')}" placeholder="备注（可选）" maxlength="1000">
      </div>
    </div>`;
  }).join('');
  const depItems = (bar.dependsOn || []).map(id => {
    const dep = barMap.get(id);
    if (!dep) return '';
    const unmetThis = dep.status !== 'done';
    return `<div class="dep-item">
      <span class="dep-icon">↳</span>

function openDrawer(barId, options = {}){
  const bar = findBar(barId);
  if (!bar) return;
  finalizeFieldEdit();
  selectedBarId = barId;
  renderDrawer();
  document.body.classList.add('drawer-open');
  const drawer = $('drawer');
  if (drawer) {
    drawer.classList.add('open');
    drawer.setAttribute('aria-hidden','false');
  }
  qsa('.bar.is-selected').forEach(el => el.classList.remove('is-selected'));
  const barEl = qs(`.bar[data-bar-id="${CSS.escape(barId)}"]`);
  if (barEl) barEl.classList.add('is-selected');
  syncChromeHeightSoon();
  requestAnimationFrame(() => {
    if (options.focusTitle) {
      const input = $('drawerTitle');
      if (input) {
        input.focus();
        input.select();
      }
    } else {
      const closeBtn = $('drawerClose');
      if (closeBtn) closeBtn.focus({ preventScroll:true });
    }
    if (options.milestoneDate) {
      scrollDrawerToMilestone(options.milestoneDate);
    }
  });
}

function closeDrawer(options = {}){
  if (!selectedBarId && !document.body.classList.contains('drawer-open')) return;
  if (!options.silent) finalizeFieldEdit();
  else pendingFieldEdit = null;
  selectedBarId = null;
  document.body.classList.remove('drawer-open');
  const drawer = $('drawer');
  if (drawer) {
    drawer.classList.remove('open');
    drawer.setAttribute('aria-hidden','true');
  }
  qsa('.bar.is-selected').forEach(el => el.classList.remove('is-selected'));
  if (!options.keepFocus) {
    const canvas = $('canvas');
    if (canvas) canvas.focus({ preventScroll:true });
  }
  syncChromeHeightSoon();
}

function scrollDrawerToMilestone(date){
  const scroll = $('drawerScroll');
  if (!scroll) return;
  const rows = qsa('.ms-item', scroll);
  if (!rows.length) return;
  let target = rows.find(row => row.dataset.msDate === date) || rows.find(row => row.dataset.msDate >= date) || rows[rows.length-1];
  if (!target) return;
  rows.forEach(row => row.classList.remove('drawer-focus'));
  target.classList.add('drawer-focus');
  const top = target.offsetTop - scroll.offsetTop - 20;
  scroll.scrollTo({ top: Math.max(0, top), behavior:'smooth' });
  setTimeout(() => target.classList.remove('drawer-focus'), 2200);
}

function syncProgressControls(value){
  const label = $('dfProgressLabel');
  if (label) label.textContent = `${value}%`;
  const range = qs('[data-field="progress"]', $('drawerBody'));
  const num = qs('[data-field="progress-number"]', $('drawerBody'));
  if (range && Number(range.value) !== value) range.value = String(value);
  if (num && Number(num.value) !== value) num.value = String(value);
}

function applyBarField(bar, field, rawValue, el){
  switch (field) {
    case 'laneId':
      if (findLane(rawValue)) bar.laneId = rawValue;
      break;
    case 'start': {
      if (!isValidDate(rawValue)) return false;
      const oldEnd = bar.end;
      bar.start = rawValue;
      if (bar.end < bar.start) bar.end = bar.start;
      if (bar.end === bar.start && oldEnd !== bar.end) {
        const endInput = qs('[data-field="end"]', $('drawerBody'));
        if (endInput) endInput.value = bar.end;
      }
      break;
    }
    case 'end': {
      if (!isValidDate(rawValue)) return false;
      bar.end = rawValue < bar.start ? bar.start : rawValue;
      if (rawValue < bar.start) {
        const endInput = qs('[data-field="end"]', $('drawerBody'));
        if (endInput) endInput.value = bar.end;
        showToast('结束日期不能早于开始日期，已收束到开始日', 'warn', 2600);
      }
      break;
    }
    case 'status':
      if (STATUS[rawValue]) bar.status = rawValue;
      break;
    case 'prio':
      if (PRIORITY[rawValue]) bar.prio = rawValue;
      break;
    case 'progress':
    case 'progress-number': {
      const val = clamp(Math.round(Number(rawValue) || 0), 0, 100);
      bar.progress = val;
      syncProgressControls(val);
      break;
    }
    case 'owner':
      bar.owner = String(rawValue || '').slice(0,80);
      break;
    case 'tags':
      bar.tags = normalizeTags(rawValue);
      break;
    case 'note':
      bar.note = String(rawValue || '').slice(0,3000);
      break;
    case 'color': {
      const color = normalizeHex(rawValue, bar.color);
      bar.color = color;
      qsa('[data-drawer-color]', $('drawerBody')).forEach(btn => btn.classList.toggle('active', btn.dataset.drawerColor === color));
      break;
    }
    default:
      return false;
  }
  return true;
}

function onBarFieldInput(el){
  if (!selectedBarId) return;
  const bar = findBar(selectedBarId);
  if (!bar) return;
  const field = el.id === 'drawerTitle' ? 'title' : el.dataset.field;
  if (!field) return;
  beginFieldEdit();
  let ok = false;
  if (field === 'title') {
    bar.title = String(el.value || '').slice(0,200);
    ok = true;
  } else {
    ok = applyBarField(bar, field, el.value, el);
  }
  if (!ok) return;
  updateDrawerHeaderMeta();
  saveState({ quiet:true });
  refreshLanes();
  // 保持当前输入焦点与数值，不重建抽屉。
}

function onStageFieldInput(el, stage){
  if (!selectedBarId || !stage) return;
  const bar = findBar(selectedBarId);
  if (!bar) return;
  beginFieldEdit();
  const field = el.dataset.stageField;
  if (field === 'name') stage.name = String(el.value || '').slice(0,120);
  else if (field === 'start' || field === 'end') {
    if (!isValidDate(el.value)) return;
    stage[field] = el.value;
    if (stage.end < stage.start) {
      if (field === 'start') stage.end = stage.start;
      else stage.start = stage.end;
      updateStageInputs(stage);
    }
    updateStageRowMeta(stage);
    // 阶段超出块日期时仅裁剪显示，不强行修改用户输入。
  } else return;
  saveState({ quiet:true });
  refreshLanes();
}
function updateStageRowMeta(stage){
  const row = qs(`.stage-item[data-stage-id="${CSS.escape(stage.id)}"]`, $('drawerBody'));
  if (!row) return;
  const hint = qs('.stage-range-hint', row);
  if (hint) hint.textContent = fmtShortRange(stage.start, stage.end);
}
function updateStageInputs(stage){
  const row = qs(`.stage-item[data-stage-id="${CSS.escape(stage.id)}"]`, $('drawerBody'));
  if (!row) return;
  const start = qs('[data-stage-field="start"]', row);
  const end = qs('[data-stage-field="end"]', row);
  if (start && start !== document.activeElement) start.value = stage.start;
  if (end && end !== document.activeElement) end.value = stage.end;
  updateStageRowMeta(stage);
}
function milestoneWhenLabel(ms){
  if (ms.done) return '已完成';
  const diff = diffDays(todayISO(), ms.date);
  if (diff < 0) return `逾期 ${Math.abs(diff)} 天`;
  if (diff === 0) return '今天';
  return `还有 ${diff} 天`;
}
function updateMilestoneRowMeta(ms, row = null){
  const msRow = row || qs(`.ms-item[data-ms-id="${CSS.escape(ms.id)}"]`, $('drawerBody'));
  if (!msRow) return;
  msRow.classList.toggle('done', !!ms.done);
  const hint = qs('.ms-when', msRow);
  if (hint) {
    const diff = diffDays(todayISO(), ms.date);
    hint.textContent = '◆ ' + milestoneWhenLabel(ms);
    hint.style.color = (!ms.done && diff <= 3) ? 'var(--red)' : 'var(--faint)';
  }
}
function onMilestoneFieldInput(el, ms){
  if (!selectedBarId || !ms) return;
  beginFieldEdit();
  const field = el.dataset.msField;
  if (field === 'name') ms.name = String(el.value || '').slice(0,120);
  else if (field === 'note') ms.note = String(el.value || '').slice(0,1000);
  else if (field === 'date') {
    if (!isValidDate(el.value)) return;
    ms.date = el.value;
    updateMilestoneRowMeta(ms, el.closest('.ms-item'));
  } else return;
  saveState({ quiet:true });
  refreshLanes();
}

function onDrawerInput(e){
  const el = e.target;
  if (!(el instanceof HTMLElement)) return;
  if (el.id === 'drawerTitle') {
    onBarFieldInput(el);
    return;
  }
  if (el.matches('[data-field]')) {
    onBarFieldInput(el);
    return;
  }
  const stageRow = el.closest('[data-stage-id]');
  if (stageRow && el.dataset.stageField && el.type !== 'checkbox') {
    const bar = selectedBarId ? findBar(selectedBarId) : null;
    const stage = bar ? (bar.stages || []).find(s => s.id === stageRow.dataset.stageId) : null;
    onStageFieldInput(el, stage);
    return;
  }
  const msRow = el.closest('[data-ms-id]');
  if (msRow && el.dataset.msField && el.type !== 'checkbox') {
    const bar = selectedBarId ? findBar(selectedBarId) : null;
    const ms = bar ? (bar.milestones || []).find(m => m.id === msRow.dataset.msId) : null;
    onMilestoneFieldInput(el, ms);
  }
}

function handleSpecialFieldChange(el){
  if (!selectedBarId) return false;
  const bar = findBar(selectedBarId);
  if (!bar) return false;
  if (el.id === 'drawerTitle' || (el.matches('[data-field]') && el.type === 'text')) {
    finalizeFieldEdit();
    refreshAll({ preserveView:true });
    return true;
  }
  if (el.matches('[data-field]')) {
    const field = el.dataset.field;
    if (['start','end','laneId','status','prio','owner','tags','note','color'].includes(field)) {
      beginFieldEdit();
      applyBarField(bar, field, el.value, el);
      finalizeFieldEdit();
      saveState();
      // 日期、归属变化可能改变范围，必须在 change 时重建时间轴一次。
      refreshAll({ preserveView:true });
      updateDrawerHeaderMeta();
      return true;
    }
    if (field === 'progress' || field === 'progress-number') {
      finalizeFieldEdit();
      refreshLanes();
      return true;
    }
  }
  if (el.matches('[data-stage-field="done"]')) {
    const row = el.closest('[data-stage-id]');
    if (!row) return true;
    finalizeFieldEdit();
    const stage = (bar.stages || []).find(s => s.id === row.dataset.stageId);
    if (stage) {
      pushHistory();
      stage.done = !!el.checked;
      saveState();
      refreshLanes();
      updateDrawerHeaderMeta();
    }
    return true;
  }
  if (el.matches('[data-ms-field="done"]')) {
    const row = el.closest('[data-ms-id]');
    if (!row) return true;
    finalizeFieldEdit();
    const ms = (bar.milestones || []).find(m => m.id === row.dataset.msId);
    if (ms) {
      pushHistory();
      ms.done = !!el.checked;
      saveState();
      refreshLanes();
    }
    return true;
  }
  if (el.matches('[data-stage-field]')) {
    if (el.dataset.stageField === 'start' || el.dataset.stageField === 'end') {
      finalizeFieldEdit();
      saveState();
      refreshAll({ preserveView:true });
      return true;
    }
    finalizeFieldEdit();
    saveState();
    refreshLanes();
    return true;
  }
  if (el.matches('[data-ms-field]')) {
    finalizeFieldEdit();
    saveState();
    if (el.dataset.msField === 'date') refreshAll({ preserveView:true });
    else refreshLanes();
    return true;
  }
  return false;
}

function makeNewStage(bar){
  const existing = (bar.stages || []).slice().sort((a,b) => a.end.localeCompare(b.end));
  let start = bar.start;
  if (existing.length) {
    const lastEnd = existing[existing.length-1].end;
    start = lastEnd >= bar.end ? bar.end : addDays(lastEnd, 1);
  }
  const maxEnd = bar.end;
  let end = addDays(start, 2);
  if (end > maxEnd) end = maxEnd;
  if (end < start) end = start;
  return {
    id: uid('stage'),
    name: existing.length ? `新阶段 ${existing.length + 1}` : '新阶段',
    start,
    end,
    done:false
  };
}
function makeNewMilestone(bar){
  const today = todayISO();
  const date = (today >= bar.start && today <= bar.end) ? today : bar.start;
  return {
    id: uid('ms'),
    name: '新节点',
    date,
    note: '',
    done:false
  };
}

function handleDrawerAction(actionEl){
  if (!selectedBarId) return;
  const bar = findBar(selectedBarId);
  if (!bar) return;
  if (actionEl.dataset.drawerColor) {
    const color = normalizeHex(actionEl.dataset.drawerColor, bar.color);
    beginImmediateAction();
    bar.color = color;
    saveState();
    refreshLanes();
    renderDrawer();
    return;
  }
  const action = actionEl.dataset.drawerAction;
  if (!action) return;
  if (action === 'add-stage') {
    beginImmediateAction();
    bar.stages = bar.stages || [];
    bar.stages.push(makeNewStage(bar));
    saveState();
    refreshAll({ preserveView:true });
    renderDrawer();
    return;
  }
  if (action === 'delete-stage') {
    const stageId = actionEl.dataset.stageId;
    beginImmediateAction();
    bar.stages = (bar.stages || []).filter(s => s.id !== stageId);
    saveState();
    refreshAll({ preserveView:true });
    renderDrawer();
    return;
  }
  if (action === 'add-ms') {
    beginImmediateAction();
    bar.milestones = bar.milestones || [];
    bar.milestones.push(makeNewMilestone(bar));
    saveState();
    refreshAll({ preserveView:true });
    renderDrawer();
    return;
  }
  if (action === 'delete-ms') {
    const msId = actionEl.dataset.msId;
    beginImmediateAction();
    bar.milestones = (bar.milestones || []).filter(m => m.id !== msId);
    saveState();
    refreshAll({ preserveView:true });
    renderDrawer();
    return;
  }
  if (action === 'remove-dep') {
    const depId = actionEl.dataset.depId;
    beginImmediateAction();
    bar.dependsOn = (bar.dependsOn || []).filter(id => id !== depId);
    saveState();
    refreshLanes();
    renderDrawer();
    return;
  }
  if (action === 'save-template') {
    openTemplateNameModal(bar);
    return;
  }
}

function onDrawerChange(e){
  const el = e.target;
  if (!(el instanceof HTMLElement)) return;
  if (!selectedBarId) return;
  const bar = findBar(selectedBarId);
  if (!bar) return;
  if (el.dataset.drawerActionSelect) {
    handleDrawerSelectChange(el);
    return;
  }
  if (el.matches('[data-stage-field="done"]') || el.matches('[data-ms-field="done"]')) {
    finalizeFieldEdit();
    const stageRow = el.closest('[data-stage-id]');
    const msRow = el.closest('[data-ms-id]');
    if (stageRow) {
      const stage = (bar.stages || []).find(s => s.id === stageRow.dataset.stageId);
      if (stage && stage.done !== !!el.checked) {
        pushHistory();
        stage.done = !!el.checked;
        stageRow.classList.toggle('done', stage.done);
        saveState();
        refreshLanes();
      }
    } else if (msRow) {
      const ms = (bar.milestones || []).find(m => m.id === msRow.dataset.msId);
      if (ms && ms.done !== !!el.checked) {
        pushHistory();
        ms.done = !!el.checked;
        updateMilestoneRowMeta(ms, msRow);
        saveState();
        refreshLanes();
      }
    }
    return;
  }
  const isBarField = el.id === 'drawerTitle' || el.matches('[data-field]');
  const isStageField = el.matches('[data-stage-field]');
  const isMsField = el.matches('[data-ms-field]');
  if (!isBarField && !isStageField && !isMsField) return;

  const isDateField = el.dataset.field === 'start' || el.dataset.field === 'end' || el.dataset.stageField === 'start' || el.dataset.stageField === 'end' || el.dataset.msField === 'date';
  if (isDateField && !isValidDate(el.value)) {
    if (el.dataset.field === 'start') el.value = bar.start;
    else if (el.dataset.field === 'end') el.value = bar.end;
    else {
      const stageRow = el.closest('[data-stage-id]');
      const msRow = el.closest('[data-ms-id]');
      if (stageRow) {
        const stage = (bar.stages || []).find(s => s.id === stageRow.dataset.stageId);
        if (stage) el.value = stage[el.dataset.stageField];
      } else if (msRow) {
        const ms = (bar.milestones || []).find(m => m.id === msRow.dataset.msId);
        if (ms) el.value = ms.date;
      }
    }
    finalizeFieldEdit();
    showToast('日期格式应为 YYYY-MM-DD，已恢复为原值', 'warn', 2600);
    return;
  }

  // 兜底：若不支持 input 事件的控件在 change 时才产生值，补一次数据写入。
  if (!pendingFieldEdit) beginFieldEdit();
  if (el.id === 'drawerTitle') {
    bar.title = String(el.value || '').slice(0,200);
  } else if (isBarField) {
    const field = el.dataset.field;
    if (field === 'start' || field === 'end') {
      if (isValidDate(el.value)) applyBarField(bar, field, el.value, el);
    } else if (field === 'progress' || field === 'progress-number') {
      if (!el.value) el.value = String(bar.progress);
      else applyBarField(bar, 'progress', el.value, el);
    } else {
      applyBarField(bar, field, el.value, el);
    }
  } else if (isStageField) {
    const row = el.closest('[data-stage-id]');
    const stage = row ? (bar.stages || []).find(s => s.id === row.dataset.stageId) : null;
    if (stage) {
      const field = el.dataset.stageField;
      if (field === 'name') stage.name = String(el.value || '').slice(0,120);
      else if ((field === 'start' || field === 'end') && isValidDate(el.value)) {
        stage[field] = el.value;
        if (stage.end < stage.start) {
          if (field === 'start') stage.end = stage.start;
          else stage.start = stage.end;
        }
        updateStageInputs(stage);
      }
    }
  } else if (isMsField) {
    const row = el.closest('[data-ms-id]');
    const ms = row ? (bar.milestones || []).find(m => m.id === row.dataset.msId) : null;
    if (ms) {
      const field = el.dataset.msField;
      if (field === 'name') ms.name = String(el.value || '').slice(0,120);
      else if (field === 'note') ms.note = String(el.value || '').slice(0,1000);
      else if (field === 'date' && isValidDate(el.value)) {
        ms.date = el.value;
        updateMilestoneRowMeta(ms, row);
      }
    }
  }

  const needsRange = (el.dataset.field === 'start' || el.dataset.field === 'end' || el.dataset.field === 'laneId' || el.dataset.msField === 'date' || el.dataset.stageField === 'start' || el.dataset.stageField === 'end');
  finalizeFieldEdit();
  saveState();
  updateDrawerHeaderMeta();
  if (needsRange) {
    if (!pointerOp) refreshAll({ preserveView:true });
  } else if (!pointerOp) {
    refreshLanes();
  } else {
    updateKpis();
    renderReminderBar();
  }
}

function handleDrawerSelectChange(el){
  if (!selectedBarId) return;
  const bar = findBar(selectedBarId);
  if (!bar) return;
  if (el.dataset.drawerActionSelect === 'add-dep') {
    const depId = el.value;
    if (!depId) return;
    if (depId === bar.id) return;
    if (dependencyWouldCycle(bar.id, depId)) {
      showToast('不能添加：会形成循环依赖', 'error');
      el.value = '';
      return;
    }
    finalizeFieldEdit();
    pushHistory();
    bar.dependsOn = Array.from(new Set([...(bar.dependsOn || []), depId]));
    saveState();
    refreshLanes();
    renderDrawer();
    updateKpis();
    return;
  }
  if (el.dataset.drawerActionSelect === 'apply-template') {
    const tplId = el.value;
    if (!tplId) return;
    applyStageTemplate(bar, tplId);
    el.value = '';
  }
}
function dependencyWouldCycle(barId, newDepId){
  const seen = new Set();
  const stack = [newDepId];
  while (stack.length) {
    const id = stack.pop();
    if (!id || seen.has(id)) continue;
    if (id === barId) return true;
    seen.add(id);
    const bar = findBar(id);
    if (bar) (bar.dependsOn || []).forEach(x => stack.push(x));
  }
  return false;
}

function onDrawerClick(e){
  const el = e.target.closest('[data-drawer-action], [data-drawer-color]');
  if (!el) return;
  if (el.dataset.drawerColor) {
    handleDrawerAction(el);
    return;
  }
  if (el.dataset.drawerAction) {
    handleDrawerAction(el);
  }
}

function applyStageTemplate(bar, templateId){
  const tpl = (db.settings.stageTemplates || []).find(t => t.id === templateId);
  if (!tpl || !tpl.stages.length) {
    showToast('模板不存在或没有阶段', 'warn');
    return;
  }
  finalizeFieldEdit();
  pushHistory();
  const stages = [];
  tpl.stages.forEach(seg => {
    const start = addDays(bar.start, seg.offset);
    if (start > bar.end) return;
    let end = addDays(start, Math.max(1,seg.duration) - 1);
    if (end > bar.end) end = bar.end;
    stages.push({ id: uid('stage'), name: seg.name, start, end, done:false });
  });
  if (!stages.length) {
    showToast('该模板的日期偏移超出当前排期范围', 'warn');
    undoStack.pop();
    updateHistoryButtons();
    return;
  }
  bar.stages = stages;
  saveState();
  refreshAll({ preserveView:true });
  renderDrawer();
  showToast(`已套用阶段模板「${tpl.name}」`, 'success', 2400);
}

/* ============================================================
   通用弹窗与浮层菜单
   ============================================================ */
const previouslyFocused = [];
function openModal(options = {}){
  closePopover();
  if (modalState && typeof modalState.onClose === 'function') {
    try { modalState.onClose(); } catch (_) {}
  }
  const modal = $('modalBox');
  const layer = $('modalLayer');
  if (!modal || !layer) return;
  modal.className = 'modal' + (options.size === 'wide' ? ' wide' : options.size === 'xwide' ? ' xwide' : '');
  $('modalKicker').textContent = options.kicker || '工作排期工作站';
  $('modalTitle').textContent = options.title || '';
  const body = $('modalBody');
  if (options.body instanceof HTMLElement) {
    body.replaceChildren(options.body);
  } else {
    body.innerHTML = options.body == null ? '' : String(options.body);
  }
  const foot = $('modalFoot');
  foot.replaceChildren();
  if (options.footer && options.footer.length) {
    (options.footer || []).forEach(spec => {
      const btn = document.createElement('button');
      btn.type = spec.type || 'button';
      btn.className = spec.className || 'btn';
      btn.textContent = spec.label || '按钮';
      if (spec.disabled) btn.disabled = true;
      if (spec.onClick) btn.addEventListener('click', spec.onClick);
      foot.appendChild(btn);
    });
    if (options.footNote) {
      const note = document.createElement('span');
      note.className = 'left-note';
      note.textContent = options.footNote;
      foot.prepend(note);
    }
    foot.hidden = false;
  } else {
    foot.hidden = true;
  }
  previouslyFocused.push(document.activeElement);
  modalState = { ...options, closeOnBackdrop: options.closeOnBackdrop !== false };
  layer.classList.add('open');
  layer.setAttribute('aria-hidden','false');
  requestAnimationFrame(() => {
    let target = null;
    if (options.focusSelector) target = qs(options.focusSelector, body);
    if (!target) {
      target = body.querySelector('input:not([type="hidden"]),textarea,select,button');
    }
    if (!target) target = $('modalClose');
    if (target) target.focus({ preventScroll:true });
  });
}
function closeModal(){
  const layer = $('modalLayer');
  if (!layer || !layer.classList.contains('open')) return;
  layer.classList.remove('open');
  layer.setAttribute('aria-hidden','true');
  const state = modalState;
  modalState = null;
  const prev = previouslyFocused.pop();
  if (state && typeof state.onClose === 'function') {
    try { state.onClose(); } catch (_) {}
  }
  if (prev && typeof prev.focus === 'function') {
    try { prev.focus({ preventScroll:true }); } catch (_) {}
  }
}
function confirmDialog(options = {}){
  const wrap = document.createElement('div');
  wrap.innerHTML = `<p class="dialog-copy">${options.message || ''}</p>`;
  openModal({
    kicker: options.kicker || 'CONFIRM',
    title: options.title || '请确认',
    body: wrap,
    footer: [
      { label:'取消', className:'btn', onClick: closeModal },
      { label: options.okLabel || '确认', className: options.danger ? 'btn danger' : 'btn primary', onClick: () => {
        closeModal();
        if (typeof options.onOk === 'function') options.onOk();
      } }
    ],
    closeOnBackdrop: options.closeOnBackdrop !== false
  });
}
function isModalOpen(){ return !!modalState && $('modalLayer').classList.contains('open'); }

function closePopover(){
  const layer = $('menuLayer');
  if (!layer) return;
  layer.classList.remove('open');
  layer.setAttribute('aria-hidden','true');
  $('popoverHost').replaceChildren();
  if (activePopover && activePopover.anchor) {
    const a = activePopover.anchor;
    if (a.hasAttribute('aria-expanded')) a.setAttribute('aria-expanded','false');
  }
  activePopover = null;
}
function openPopover(anchor, items = [], options = {}){
  closePopover();
  if (!anchor) return;
  const layer = $('menuLayer');
  const host = $('popoverHost');
  const pop = document.createElement('div');
  pop.className = 'popover';
  pop.setAttribute('role','menu');
  items.forEach(item => {
    if (item.section) {
      const section = document.createElement('div');
      section.className = 'popover-section';
      section.textContent = item.section;
      pop.appendChild(section);
      return;
    }
    if (item.separator) {
      const sep = document.createElement('div');
      sep.className = 'popover-sep';
      pop.appendChild(sep);
      return;
    }
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'popover-item' + (item.danger ? ' danger' : '');
    btn.disabled = !!item.disabled;
    if (item.disabled) btn.style.opacity = '.4';
    btn.setAttribute('role','menuitem');
    btn.innerHTML = `<span class="mi">${esc(item.icon || '')}</span><span>${esc(item.label)}</span>${item.shortcut ? `<span class="shortcut">${esc(item.shortcut)}</span>` : ''}`;
    btn.addEventListener('click', () => {
      closePopover();
      if (typeof item.onClick === 'function') item.onClick();
    });
    pop.appendChild(btn);
  });
  host.appendChild(pop);
  layer.classList.add('open');
  layer.setAttribute('aria-hidden','false');
  const rect = anchor.getBoundingClientRect();
  const pr = pop.getBoundingClientRect();
  let left = rect.left;
  if (left + pr.width > window.innerWidth - 10) left = window.innerWidth - pr.width - 10;
  if (left < 10) left = 10;
  let top = rect.bottom + 5;
  if (top + pr.height > window.innerHeight - 10) {
    top = rect.top - pr.height - 5;
    if (top < 10) top = Math.max(10, window.innerHeight - pr.height - 10);
  }
  pop.style.left = Math.round(left) + 'px';
  pop.style.top = Math.round(top) + 'px';
  if (anchor.hasAttribute('aria-haspopup')) anchor.setAttribute('aria-expanded','true');
  activePopover = { anchor, element: pop };
  const first = pop.querySelector('.popover-item:not(:disabled)');
  if (first) first.focus({ preventScroll:true });
}

function openLaneEditor(lane = null, mode = 'add', focus = 'name'){

  let pickedColor = currentColor;
  const syncSwatches = () => {
    qsa('[data-lane-editor-color]', form).forEach(btn => btn.classList.toggle('active', btn.dataset.laneEditorColor === pickedColor));
    const colorInput = qs('#laneColorInput', form);
    if (colorInput && colorInput.value.toUpperCase() !== pickedColor) colorInput.value = pickedColor;
  };
  form.addEventListener('click', (e) => {
    const swatch = e.target.closest('[data-lane-editor-color]');
    if (swatch) {
      pickedColor = normalizeHex(swatch.dataset.laneEditorColor, pickedColor);
      syncSwatches();
    }
  });
  form.addEventListener('input', (e) => {
    if (e.target.id === 'laneColorInput') {
      pickedColor = normalizeHex(e.target.value, pickedColor);
      syncSwatches();
    }
  });
  form.addEventListener('submit', (e) => e.preventDefault());
  const title = isNew ? '新增登记列' : focus === 'color' ? '更换列颜色' : '重命名工作线';
  openModal({
    kicker: isNew ? 'NEW LANE' : 'EDIT LANE',
    title,
    body: form,
    focusSelector: isNew || focus === 'name' ? '#laneNameInput' : '#laneColorInput',
    footer: [
      { label:'取消', className:'btn', onClick: closeModal },
      { label: isNew ? '创建列' : '保存', className:'btn primary', onClick: () => {
        const nameInput = qs('#laneNameInput', form);
        const name = nameInput.value.trim();
        if (!name) {
          nameInput.focus();
          showToast('请填写工作线名称', 'warn');
          return;
        }
        if (isNew) {
          pushHistory();
          const maxOrder = db.lanes.length ? Math.max(...db.lanes.map(l => Number(l.order) || 0)) : -1;
          const newLane = { id: uid('lane'), name: name.slice(0,80), color: pickedColor, hidden:false, order:maxOrder + 1 };
          db.lanes.push(newLane);
          syncHiddenLanes();
          saveState();
          closeModal();
          refreshLanes();
          showToast('登记列已创建', 'success');
          requestAnimationFrame(() => {
            const canvas = $('canvas');
            if (canvas && currentRange) scrollCanvasToDate(todayISO(), { smooth:true, laneId:newLane.id });
          });
        } else {
          const changed = lane.name !== name.slice(0,80) || normalizeHex(lane.color) !== pickedColor;
          if (changed) {
            pushHistory();
            lane.name = name.slice(0,80);
            lane.color = pickedColor;
            saveState();
            refreshLanes();
            if (document.body.classList.contains('drawer-open')) renderDrawer();
          }
          closeModal();
        }
      } }
    ]
  });
  if (isNew) setTimeout(() => { const inp = qs('#laneNameInput', form); if (inp) inp.focus(); }, 0);
}

function laneMenu(anchor, laneId){

  if (!lane) return;

  openPopover(anchor, [
    { section:'登记列' },
    { label:'重命名', icon:'✎', onClick:() => openLaneEditor(lane, 'edit', 'name') },
    { label:'换色', icon:'◼', onClick:() => openLaneEditor(lane, 'color', 'color') },
    { separator:true },
    { label:'上移', icon:'↑', disabled: idx <= 0, onClick:() => moveLane(lane.id, -1) },
    { label:'下移', icon:'↓', disabled: idx < 0 || idx >= sorted.length - 1, onClick:() => moveLane(lane.id, 1) },
    { separator:true },
    { label:'隐藏此列', icon:'◌', onClick:() => hideLane(lane.id) },
    { label:'删除工作线…', icon:'⌫', danger:true, onClick:() => confirmDeleteLane(lane.id) }
  ]);
}
function moveLane(laneId, direction){
  const sorted = getAllLanesSorted();
  const idx = sorted.findIndex(l => l.id === laneId);
  const target = idx + direction;
  if (idx < 0 || target < 0 || target >= sorted.length) return;
  pushHistory();
  const tmpOrder = sorted[idx].order;
  sorted[idx].order = sorted[target].order;
  sorted[target].order = tmpOrder;
  // 规范化，避免相等 order 造成不稳定。
  getAllLanesSorted().forEach((lane, i) => { lane.order = i; });
  saveState();
  refreshLanes();
  showToast('列顺序已更新', 'info', 1800);
}
function hideLane(laneId){
  const lane = findLane(laneId);
  if (!lane) return;
  pushHistory();
  lane.hidden = true;
  syncHiddenLanes();
  saveState();
  if (selectedBarId) {
    const bar = findBar(selectedBarId);
    if (bar && bar.laneId === laneId) closeDrawer({ silent:true });
  }
  refreshLanes();
  showToast(`已隐藏「${lane.name}」，数据仍保留，可在列管理中恢复`, 'info', 4200);
}
function showAllLanes(options = {}){
  const hidden = db.lanes.filter(l => l.hidden);
  if (!hidden.length) {
    if (!options.quiet) showToast('所有列都已显示', 'info');
    return;
  }
  if (!options.skipHistory) pushHistory();
  db.lanes.forEach(l => { l.hidden = false; });
  syncHiddenLanes();
  saveState();
  refreshLanes();
  if (!options.quiet) showToast(`已恢复显示 ${hidden.length} 条登记列`, 'success');
}
function confirmDeleteLane(laneId){
  const lane = findLane(laneId);
  if (!lane) return;
  const count = db.bars.filter(b => b.laneId === laneId).length;
  confirmDialog({
    kicker:'DELETE LANE',
    title:'删除这条工作线？',
    message: count
      ? `将删除工作线 <strong>${esc(lane.name)}</strong> 以及其中的 <strong>${count} 条排期</strong>。删除后可以用 Ctrl+Z 撤销，但请先确认已经导出备份。`
      : `工作线 <strong>${esc(lane.name)}</strong> 中没有排期。删除后可用 Ctrl+Z 撤销。`,
    okLabel:'删除工作线',
    danger:true,
    onOk: () => deleteLane(laneId)
  });
}
function deleteLane(laneId){
  const lane = findLane(laneId);
  if (!lane) return;
  pushHistory();
  const removedBarIds = new Set(db.bars.filter(b => b.laneId === laneId).map(b => b.id));
  db.bars = db.bars.filter(b => b.laneId !== laneId);
  db.bars.forEach(b => { b.dependsOn = (b.dependsOn || []).filter(id => !removedBarIds.has(id)); });
  db.lanes = db.lanes.filter(l => l.id !== laneId);
  db.lanes.forEach((l,i) => { l.order = i; });
  syncHiddenLanes();
  saveState();
  if (selectedBarId && !findBar(selectedBarId)) closeDrawer({ silent:true });
  refreshAll({ preserveView:true });
  showToast(`已删除工作线「${lane.name}」`, 'info');
}

        pushHistory();
        lane.hidden = !input.checked;
        syncHiddenLanes();
        saveState();
        refreshLanes();
        renderList();
        const currentModalBody = $('modalBody');
        if (currentModalBody && currentModalBody.firstElementChild === root) {
          // renderList 只更新了根节点内部，弹窗本身保持打开。
        }
        showToast(input.checked ? `已显示「${lane.name}」` : `已隐藏「${lane.name}」，数据保留`, 'info', 2200);
      });
    });
    const weekendToggle = root.querySelector('#showWeekendToggle');
    if (weekendToggle) {
      weekendToggle.addEventListener('change', () => {
        db.settings.showWeekend = !!weekendToggle.checked;
        document.body.classList.toggle('hide-weekend', !db.settings.showWeekend);
        saveState();
      });
    }
    root.querySelectorAll('[data-manage-action]').forEach(btn => {
      btn.addEventListener('click', () => {
        const action = btn.dataset.manageAction;
        if (action === 'show-all') {
          showAllLanes({ skipHistory:false, quiet:true });
          renderList();
          showToast('已恢复显示全部登记列', 'success', 2200);
        } else if (action === 'add-lane') {
          closeModal();
          openLaneEditor(null, 'add');
        }
      });
    });
  };
  renderList();
  openModal({
    kicker:'LANES / 管理',
    title:'列管理',
    body: root,
    footer: [
      { label:'关闭', className:'btn', onClick: closeModal }
    ]
  });
}

/* ============================================================
   画布手势：框选 / 移动 / 缩放 / 点击 严格互斥
   ============================================================ */
function getRowHeight(){ return Number(db.settings.rowH) || 30; }
function showDragFloat(text, clientX, clientY){
  if (!dragFloatEl) dragFloatEl = $('dragFloat');
  if (!dragFloatEl) return;
  dragFloatEl.textContent = text;
  dragFloatEl.style.left = Math.round(clientX) + 'px';
  dragFloatEl.style.top = Math.round(clientY - 14) + 'px';
  dragFloatEl.hidden = false;
}
function hideDragFloat(){
  if (dragFloatEl) dragFloatEl.hidden = true;
}
function dayIndexFromClientY(grid, clientY){
  const rect = grid.getBoundingClientRect();
  const rh = getRowHeight();
  return clamp(Math.floor((clientY - rect.top) / rh), 0, Math.max(0, (currentRange ? currentRange.days : 1) - 1));
}
function onLanesMouseDown(e){
  if (e.button !== 0) return;
  if (isModalOpen()) return;
  if (pointerOp) return;
  const lanesRoot = $('lanes');
  if (!lanesRoot || !currentRange) return;
  const barEl = e.target.closest('.bar');
  if (barEl) {
    if (e.target.closest('[data-action]')) return;
    const bar = findBar(barEl.dataset.barId);
    if (!bar) return;
    e.preventDefault();
    finalizeFieldEdit();
    if (e.target.closest('.resize-handle')) startResize(bar, barEl, e);
    else startMove(bar, barEl, e);
    return;
  }
  const grid = e.target.closest('.lane-grid');
  if (!grid) return;
  if (e.target.closest('.create-selection')) return;
  startCreateSelection(grid, e);
}

function startMove(bar, barEl, e){
  closePopover();
  pointerOp = {
    type:'move',
    pointerId: e.pointerId || null,
    barId: bar.id,
    barEl,
    startX: e.clientX,
    startY: e.clientY,
    lastX: e.clientX,
    lastY: e.clientY,
    origStart: bar.start,
    origEnd: bar.end,
    delta: 0,
    moved: false
  };
  barEl.classList.add('is-dragging');
  document.body.classList.add('dragging-active');
  document.addEventListener('mousemove', onDocumentMouseMove, true);
  document.addEventListener('mouseup', onDocumentMouseUp, true);
}
function startResize(bar, barEl, e){
  closePopover();
  pointerOp = {
    type:'resize',
    barId: bar.id,
    barEl,
    startX: e.clientX,
    startY: e.clientY,
    lastX: e.clientX,
    lastY: e.clientY,
    origStart: bar.start,
    origEnd: bar.end,
    delta: 0,
    moved: false
  };
  barEl.classList.add('is-resizing');
  document.body.classList.add('dragging-active');
  document.addEventListener('mousemove', onDocumentMouseMove, true);
  document.addEventListener('mouseup', onDocumentMouseUp, true);
}
function startCreateSelection(grid, e){
  closePopover();
  const laneId = grid.dataset.laneId;
  const lane = findLane(laneId);
  if (!lane) return;
  const idx = dayIndexFromClientY(grid, e.clientY);
  const overlay = document.createElement('div');
  overlay.className = 'create-selection';
  const label = document.createElement('span');
  label.textContent = '新建 1 天';
  overlay.appendChild(label);
  grid.appendChild(overlay);
  pointerOp = {
    type:'create',
    laneId,
    grid,
    anchorIndex: idx,
    currentIndex: idx,
    overlay,
    label,
    startX: e.clientX,
    startY: e.clientY,
    lastX: e.clientX,
    lastY: e.clientY,
    moved: false
  };
  updateCreateSelectionVisual();
  document.body.classList.add('dragging-active');
  document.addEventListener('mousemove', onDocumentMouseMove, true);
  document.addEventListener('mouseup', onDocumentMouseUp, true);
  e.preventDefault();
}
function updateCreateSelectionVisual(){
  if (!pointerOp || pointerOp.type !== 'create') return;
  const rh = getRowHeight();
  const a = pointerOp.anchorIndex, b = pointerOp.currentIndex;
  const top = Math.min(a,b) * rh;
  const days = Math.abs(a-b) + 1;
  pointerOp.overlay.style.top = top + 'px';
  pointerOp.overlay.style.height = Math.max(8, days * rh - 2) + 'px';
  const startDate = addDays(currentRange.start, Math.min(a,b));
  const endDate = addDays(currentRange.start, Math.max(a,b));
  pointerOp.overlay.querySelector('span').textContent = `${fmtMD(startDate)}–${fmtMD(endDate)} · ${days} 天`;
}
function onDocumentMouseMove(e){
  if (!pointerOp) return;
  pointerOp.lastX = e.clientX;
  pointerOp.lastY = e.clientY;
  if (pointerOp.type === 'create') {
    const dy = e.clientY - pointerOp.startY;
    if (Math.abs(dy) > 3 || Math.abs(e.clientX - pointerOp.startX) > 6) pointerOp.moved = true;
    const idx = dayIndexFromClientY(pointerOp.grid, e.clientY);
    if (idx !== pointerOp.currentIndex) {
      pointerOp.currentIndex = idx;
      updateCreateSelectionVisual();
    }
    return;
  }
  const rh = getRowHeight();
  const dy = e.clientY - pointerOp.startY;
  if (Math.abs(dy) > 3) pointerOp.moved = true;
  if (!pointerOp.moved) return;
  const rawDelta = Math.round(dy / rh);
  if (pointerOp.type === 'move') {
    const minDelta = diffDays(pointerOp.origStart, currentRange.start);
    const maxDelta = diffDays(pointerOp.origEnd, currentRange.end);
    const delta = clamp(rawDelta, minDelta, maxDelta);
    pointerOp.delta = delta;
    pointerOp.barEl.style.transform = `translateY(calc(var(--row-h) * ${delta}))`;
    const ns = addDays(pointerOp.origStart, delta);
    const ne = addDays(pointerOp.origEnd, delta);
    showDragFloat(`${delta >= 0 ? '顺延' : '提前'} ${Math.abs(delta)} 天 · ${fmtShortRange(ns,ne)}`, e.clientX, e.clientY);
  } else if (pointerOp.type === 'resize') {
    const maxDelta = diffDays(pointerOp.origEnd, currentRange.end);
    const minDelta = diffDays(pointerOp.origEnd, pointerOp.origStart); // 负值：最多缩到开始日
    const delta = clamp(rawDelta, minDelta, maxDelta);
    pointerOp.delta = delta;
    const ne = addDays(pointerOp.origEnd, delta);
    const newEndIdx = clamp(diffDays(currentRange.start, ne), 0, currentRange.days - 1);
    const startIdx = clamp(diffDays(currentRange.start, pointerOp.origStart), 0, currentRange.days - 1);
    const visibleDays = Math.max(1, newEndIdx - startIdx + 1);
    pointerOp.barEl.style.height = `calc(var(--row-h) * ${visibleDays} - 4px)`;
    pointerOp.barEl.dataset.days = String(Math.max(1, diffDays(pointerOp.origStart, ne) + 1));
    showDragFloat(`结束 ${fmtYMD(ne)} · ${fmtShortRange(pointerOp.origStart, ne)}`, e.clientX, e.clientY);
  }
}

function onDocumentMouseUp(e){
  if (!pointerOp) return;
  const op = pointerOp;
  pointerOp = null;
  document.removeEventListener('mousemove', onDocumentMouseMove, true);
  document.removeEventListener('mouseup', onDocumentMouseUp, true);
  document.body.classList.remove('dragging-active');
  hideDragFloat();

  if (op.type === 'create') {
    const overlay = op.overlay;
    if (overlay) overlay.remove();
    if (!op.moved) return;
    createBarFromRange(op.laneId, Math.min(op.anchorIndex, op.currentIndex), Math.max(op.anchorIndex, op.currentIndex));
    return;
  }

  const bar = findBar(op.barId);
  const barEl = op.barEl;
  if (!bar || !barEl) return;
  barEl.classList.remove('is-dragging','is-resizing');
  barEl.style.transform = '';
  if (op.type === 'resize') {
    // 未真正拖动时不改变数据，点击缩放手柄不打开抽屉。
    if (!op.moved || op.delta === 0) {
      if (barEl) delete barEl.dataset.days;
      renderLanes({ preserveView:true });
      suppressBarClickUntil = Date.now() + 220;
      return;
    }
    commitResize(bar, op.origEnd, op.delta);
    return;
  }
  if (op.type === 'move') {
    if (!op.moved) {
      suppressBarClickUntil = Date.now() + 220;
      openDrawer(bar.id, { focusTitle:false });
      return;
    }
    if (op.delta === 0) {
      suppressBarClickUntil = Date.now() + 220;
      renderLanes({ preserveView:true });
      return;
    }
    commitMove(bar, op.delta);
  }
}

function createBarFromRange(laneId, startIndex, endIndex){
  const lane = findLane(laneId);
  if (!lane) return;
  const start = addDays(currentRange.start, startIndex);
  const end = addDays(currentRange.start, endIndex);
  pushHistory();
  const bar = {
    id: uid('bar'),
    laneId,
    title: '未命名排期',
    start,
    end,
    color: normalizeHex(lane.color, PRESET_COLORS[0]),
    status:'todo',
    prio:'mid',
    progress:0,
    owner:'',
    tags:[],
    note:'',
    stages:[],
    milestones:[],
    dependsOn:[]
  };
  db.bars.push(bar);
  saveState();
  refreshLanes();
  openDrawer(bar.id, { focusTitle:true });
  showToast(`已创建 ${fmtShortRange(start,end)} 的排期，可继续细分阶段与节点`, 'success', 3000);
}

function commitMove(bar, delta){
  if (!delta) return;
  pushHistory();
  bar.start = addDays(bar.start, delta);
  bar.end = addDays(bar.end, delta);
  // 同一事务同步平移阶段与里程碑，避免块内错位。
  (bar.stages || []).forEach(stage => {
    stage.start = addDays(stage.start, delta);
    stage.end = addDays(stage.end, delta);
  });
  (bar.milestones || []).forEach(ms => {
    ms.date = addDays(ms.date, delta);
  });
  saveState();
  suppressBarClickUntil = Date.now() + 320;
  refreshLanes();
  if (selectedBarId === bar.id) renderDrawer();
  showToast(`已${delta > 0 ? '顺延' : '提前'} ${Math.abs(delta)} 天，阶段与里程碑同步移动`, 'success', 2600);
}
function commitResize(bar, originalEnd, delta){
  const newEnd = addDays(originalEnd, delta);
  if (newEnd < bar.start) {
    showToast('结束日期不能早于开始日期', 'warn');
    renderLanes({ preserveView:true });
    return;
  }
  if (newEnd === bar.end) {
    renderLanes({ preserveView:true });
    return;
  }
  pushHistory();
  bar.end = newEnd;
  saveState();
  suppressBarClickUntil = Date.now() + 320;
  refreshLanes();
  if (selectedBarId === bar.id) renderDrawer();
  showToast(`结束日期已改为 ${fmtYMD(bar.end)}`, 'success', 2200);
}

function toggleStageFromCanvas(barId, stageId){

function setRowHeight(value){
  const v = Number(value);
  if (![24,30,40].includes(v) || v === Number(db.settings.rowH)) {
    syncRowHeightUi();
    return;
  }
  const canvas = $('canvas');
  const oldH = getRowHeight();
  const idx = canvas ? Math.max(0, Math.floor(canvas.scrollTop / oldH)) : 0;
  const frac = canvas ? (canvas.scrollTop - idx * oldH) : 0;
  db.settings.rowH = v;
  document.documentElement.style.setProperty('--row-h', `${v}px`);
  syncRowHeightUi();
  saveState();
  renderLanes({ preserveView:false });
  if (canvas) {
    canvas.scrollTop = Math.max(0, idx * v + (frac / oldH) * v);
  }
  refreshCompactStates();
  refreshChrome();
  applyFilters();
}

function downloadFile(filename, content, mime, withBom=false){
  try {
    const blob = new Blob(withBom ? ['\uFEFF' + content] : [content], { type: mime || 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      try { a.remove(); } catch (_) {}
      try { URL.revokeObjectURL(url); } catch (_) {}
    }, 500);
    return true;
  } catch (err) {
    showToast('文件生成失败：' + err.message, 'error', 5000);
    return false;
  }
}

}

function escapeICS(value){
  return String(value == null ? '' : value)
    .replace(/\\/g,'\\\\')
    .replace(/\r?\n/g,'\\n')
    .replace(/;/g,'\\;')
    .replace(/,/g,'\\,');
}
function foldICSLine(line){
  // 按字符折行，避免中文行过长；常见日历程序均可解析。
  if (line.length <= 72) return line;
  const parts = [];
  let rest = line;
  while (rest.length > 72) {
    parts.push(rest.slice(0,72));
    rest = ' ' + rest.slice(72);
  }
  parts.push(rest);
  return parts.join('\r\n');
}

  const lines = [
    'BEGIN:VCALENDAR',

    'CALSCALE:GREGORIAN',
    'PRODID:-//Schedule Station//Local//CN',
    'METHOD:PUBLISH'
  ];
  rows.forEach(({bar,ms,lane}) => {
    const desc = [
      `排期：${bar.title || '未命名排期'}`,
      `工作线：${lane ? lane.name : '未归属'}`,
      `排期范围：${bar.start} 至 ${bar.end}`,
      ms.note ? `备注：${ms.note}` : ''
    ].filter(Boolean).join('\n');
    lines.push('BEGIN:VEVENT');
    lines.push(`UID:${escapeICS(ms.id)}@schedule-station.local`);
    lines.push(`DTSTAMP:${dtstamp}`);
    lines.push(`DTSTART;VALUE=DATE:${ms.date.replace(/-/g,'')}`);
    lines.push(`SUMMARY:${escapeICS('◆ ' + (ms.name || '未命名节点') + ' · ' + (bar.title || '排期'))}`);
    lines.push(`DESCRIPTION:${escapeICS(desc)}`);
    lines.push(`CATEGORIES:${escapeICS(lane ? lane.name : '工作排期')}`);
    lines.push(`TRANSP:TRANSPARENT`);
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  const content = lines.map(foldICSLine).join('\r\n') + '\r\n';
  const ok = downloadFile(`schedule-station-milestones-${today}.ics`, content, 'text/calendar;charset=utf-8');
  if (ok) showToast(`已导出 ${rows.length} 个未完成里程碑到 .ics`, 'success', 3200);
  return rows.length;
}

function promptImportJSON(){

function handleImportFile(file){
  if (!file) return;
  if (file.size > 25 * 1024 * 1024) {
    showToast('文件过大，已拒绝导入（上限 25 MB）', 'error', 5000);
    return;
  }
  const reader = new FileReader();
  reader.onerror = () => showToast('读取备份文件失败', 'error', 4500);
  reader.onload = () => {
    try {
      const text = String(reader.result || '');
      const parsed = JSON.parse(text);
      if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) throw new Error('备份顶层必须是对象');
      if (!Array.isArray(parsed.lanes) || !Array.isArray(parsed.bars)) throw new Error('缺少 lanes / bars 数组');
      if (!parsed.settings || typeof parsed.settings !== 'object') throw new Error('缺少 settings 对象');
      const result = sanitizeState(parsed);
      showImportPreview(parsed, result);
    } catch (err) {
      showToast('无法恢复：' + err.message + '。请确认这是由本工作站导出的 JSON 备份。', 'error', 6000);
    }
  };
  reader.readAsText(file, 'utf-8');
}

function cloneBarWithShift(bar, shiftDays){
  const newStart = addDays(bar.start, shiftDays);
  const newEnd = addDays(bar.end, shiftDays);
  return {
    id: uid('bar'),
    laneId: bar.laneId,
    title: bar.title,
    start: newStart,
    end: newEnd,
    color: normalizeHex(bar.color),
    status: bar.status,
    prio: bar.prio,
    progress: clamp(Number(bar.progress)||0,0,100),
    owner: bar.owner || '',
    tags: (bar.tags || []).slice(),
    note: bar.note || '',
    stages: (bar.stages || []).map(stage => ({
      id: uid('stage'),
      name: stage.name,
      start: addDays(stage.start, shiftDays),
      end: addDays(stage.end, shiftDays),
      done: !!stage.done
    })),
    milestones: (bar.milestones || []).map(ms => ({
      id: uid('ms'),
      name: ms.name,
      date: addDays(ms.date, shiftDays),
      note: ms.note || '',
      done: !!ms.done
    })),
    dependsOn: (bar.dependsOn || []).slice()
  };
}
function copyShiftSeven(){
  if (!selectedBarId) return;
  const bar = findBar(selectedBarId);
  if (!bar) return;
  beginImmediateAction();
  const clone = cloneBarWithShift(bar, 7);

    if (outside) refreshAll({ preserveView:true });
    else refreshLanes();

}

function generateRecurringBars(baseBar, freq, count){
  closeModal();
  pushHistory();
  const duration = Math.max(0, diffDays(baseBar.start, baseBar.end));
  const created = [];
  for (let i=1; i<=count; i++) {
    const newStart = freq === 'week' ? addDays(baseBar.start, i*7) : addMonthsClamped(baseBar.start, i);
    const newEnd = addDays(newStart, duration);
    const shift = diffDays(baseBar.start, newStart);
    const clone = cloneBarWithShift(baseBar, shift);
    // cloneBarWithShift 的日期会与月度收束一致；用计算值确保终点持续天数不变。
    clone.start = newStart;
    clone.end = newEnd;
    clone.stages = (baseBar.stages || []).map(stage => ({
      id: uid('stage'),
      name: stage.name,
      start: addDays(stage.start, shift),
      end: addDays(stage.end, shift),
      done:false
    }));
    clone.milestones = (baseBar.milestones || []).map(ms => ({
      id: uid('ms'),
      name: ms.name,
      date: addDays(ms.date, shift),
      note: ms.note || '',
      done:false
    }));
    // 周期生成的是未来排期，不应继承模板的完成状态与进度。
    clone.status = 'todo';
    clone.progress = 0;
    db.bars.push(clone);
    created.push(clone);
  }
  saveState();
  refreshAll({ preserveView:true });
  if (selectedBarId === baseBar.id) renderDrawer();
  showToast(`已生成 ${created.length} 期${freq === 'week' ? '每周' : '每月'}排期`, 'success', 3200);
}

function fallbackCopyText(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly','');
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  ta.style.top = '0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (_) { ok = false; }
  ta.remove();
  return ok;
}
async function copyTextToClipboard(text){
  try {
    if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (_) {}
  return fallbackCopyText(text);
}

function collectMilestoneRows(from, to, laneId='all'){
  const rows = [];
  const laneMap = new Map(db.lanes.map(l => [l.id,l]));
  const today = todayISO();
  db.bars.forEach(bar => {
    if (laneId !== 'all' && bar.laneId !== laneId) return;
    (bar.milestones || []).forEach(ms => {
      if (ms.date < from || ms.date > to) return;
      rows.push({
        bar,
        ms,
        lane: laneMap.get(bar.laneId) || null,
        diff: diffDays(today, ms.date)
      });
    });
  });
  rows.sort((a,b) => a.ms.date.localeCompare(b.ms.date) || (a.bar.title || '').localeCompare(b.bar.title || '', 'zh-CN'));
  return rows;
}
function openMilestoneTable(options = {}){
  let from = isValidDate(options.from) ? options.from : todayISO();
  let to = isValidDate(options.to) ? options.to : addDays(todayISO(), 30);

    <div class="table-filters">

      <div class="form-field"><label class="field-label">至日期</label><input class="date-iso" type="text" inputmode="numeric" maxlength="10" autocomplete="off" spellcheck="false" id="msFilterTo" value="${escAttr(to)}" placeholder="YYYY-MM-DD"></div>

    stat.textContent = `${rows.length} 个节点`;

      tableWrap.innerHTML = '<div class="empty-table">当前筛选范围内没有里程碑。可调整日期区间或列筛选。</div>';

            else if (diff < 0) { countdown = `逾期 ${Math.abs(diff)} 天`; cls = 'overdue'; }
            else if (diff === 0) { countdown = '今天'; cls = 'overdue'; }
            else { countdown = `${diff} 天`; cls = diff <= 3 ? 'doing' : ''; }
            return `<tr>
              <td class="num">${esc(fmtYMD(ms.date))}</td>
              <td><span class="badge-pill ${cls}">${esc(countdown)}</span></td>
