}
function openMilestoneTableFromBucket(bucket){
  if (!bucket) {
    openMilestoneTable();
    return;
  }
  const all = getPendingMilestones().filter(item => item.bucket === bucket);
  if (!all.length) {
    openMilestoneTable();
    return;
  }
  const dates = all.map(x => x.milestone.date).sort();
  openMilestoneTable({ from:dates[0], to:dates[dates.length-1] });
}

/* ============================================================
   负载视图
   ============================================================ */
function openLoadView(){
  let mode = activeLoadMode === 'month' ? 'month' : 'week';
  let threshold = 4;
  const root = document.createElement('div');
  const render = () => {
    activeLoadMode = mode;
    const range = currentRange || makeRange();
    const periods = [];
    if (mode === 'week') {
      let p = startOfWeekISO(range.start);
      while (p <= range.end) {
        periods.push({ start:p, end:addDays(p,6), label:p.slice(5,7) + '/' + p.slice(8,10), title:`${fmtYMD(p)} 起` });
        p = addDays(p, 7);
      }
    } else {
      let p = startOfMonthISO(range.start);
      while (p <= range.end) {
        periods.push({ start:p, end:endOfMonthISO(p), label:p.slice(0,7), title:`${p.slice(0,7)}` });
        const next = startOfMonthISO(addMonthsClamped(p, 1));
        if (next <= p) break;
        p = next;
      }
    }
    const lanes = getAllLanesSorted();
    let maxLoad = 0;
    let hotPeriods = 0;
    const cellStats = [];
    const rowsHtml = lanes.map(lane => {
      const laneBars = db.bars.filter(b => b.laneId === lane.id && b.status !== 'done' && b.status !== 'cancel');
      const cells = periods.map(period => {
        const count = laneBars.filter(bar => bar.start <= period.end && bar.end >= period.start).length;
        maxLoad = Math.max(maxLoad, count);
        if (count >= threshold) hotPeriods++;
        cellStats.push({laneId:lane.id, start:period.start, count});
        const hot = count >= threshold;
        return `<td class="load-cell${hot ? ' hot' : ''}${lane.hidden ? ' hidden-lane-cell' : ''}" title="${escAttr(lane.name + ' · ' + period.label + ' · ' + count + ' 条同时进行')}">${count || '·'}</td>`;
      }).join('');
      return `<tr>
        <td class="sticky-lane" title="${escAttr(lane.name)}">${esc(lane.name)}${lane.hidden ? ' <span class="lm-hidden">隐藏</span>' : ''}</td>
        ${cells}
      </tr>`;
    }).join('');
    const totalActive = db.bars.filter(b => b.status !== 'done' && b.status !== 'cancel').length;
    const periodWord = mode === 'week' ? '周' : '月';
    root.innerHTML = `
      <div class="load-controls">
        <div class="segmented small" aria-label="统计粒度">
          <button type="button" data-load-mode="week" class="${mode === 'week' ? 'active' : ''}">按周</button>
          <button type="button" data-load-mode="month" class="${mode === 'month' ? 'active' : ''}">按月</button>
        </div>
        <label class="hint" style="display:flex;align-items:center;gap:5px">预警阈值
          <input type="number" id="loadThresholdInput" min="1" max="99" step="1" value="${threshold}" style="width:54px;height:27px">
          <span>条 / ${periodWord}</span>
        </label>
        <span class="load-legend">计数口径：状态非已完成 / 已取消，且日期区间与${periodWord}相交的排期数。</span>
      </div>
      <div class="load-summary">
        <span>活跃排期 <b>${totalActive}</b></span>
        <span>当前范围最高并发 <b>${maxLoad}</b></span>
        <span>超阈值单元格 <b>${hotPeriods}</b></span>
        <span>时间范围 <b>${esc(fmtYMD(range.start))} → ${esc(fmtYMD(range.end))}</b></span>
      </div>
      ${lanes.length ? `<div class="load-table-wrap"><table class="data-table load-table">
        <thead><tr><th class="sticky-lane">登记列 / ${mode === 'week' ? '周' : '月'}</th>${periods.map(p => `<th class="load-cell" title="${escAttr(p.title)}">${esc(p.label)}</th>`).join('')}</tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table></div>` : '<div class="empty-table">还没有登记列，无法统计负载。</div>'}
      <p class="table-hint">默认阈值：按周同列 ≥ 4 条同时进行即高亮预警；可按需调整。隐藏列仍计入统计。</p>`;
    root.querySelectorAll('[data-load-mode]').forEach(btn => {
      btn.addEventListener('click', () => {
        mode = btn.dataset.loadMode;
        render();
      });
    });
    const thInput = qs('#loadThresholdInput', root);
    if (thInput) {
      thInput.addEventListener('change', () => {
        threshold = clamp(Math.floor(Number(thInput.value) || 4), 1, 99);
        render();
      });
    }
    if (threshold < 1) threshold = 1;
  };
  render();
  openModal({
    kicker:'WORKLOAD / 负载',
    title:'负载视图',
    body: root,
    size:'xwide',
    footer: [{ label:'关闭', className:'btn primary', onClick: closeModal }]
  });
}

/* ============================================================
   依赖关系与关键路径
   ============================================================ */
function openDependencyView(){
  const bars = db.bars.slice();
  const barMap = new Map(bars.map(b => [b.id,b]));
  const laneMap = new Map(db.lanes.map(l => [l.id,l]));
  const depsMap = new Map();
  const edges = [];
  bars.forEach(bar => {
    const deps = (bar.dependsOn || []).filter(id => barMap.has(id));
    depsMap.set(bar.id, deps);
    deps.forEach(depId => edges.push({ from:bar, to:barMap.get(depId) }));
  });
  const indegree = new Map(bars.map(b => [b.id, depsMap.get(b.id).length]));
  const adj = new Map(bars.map(b => [b.id, []]));
  edges.forEach(({from,to}) => {
    if (!adj.has(to.id)) adj.set(to.id, []);
    adj.get(to.id).push(from.id);
  });
  const queue = bars.filter(b => indegree.get(b.id) === 0).map(b => b.id);
  const topo = [];
  while (queue.length) {
    const id = queue.shift();
    topo.push(id);
    (adj.get(id) || []).forEach(nextId => {
      indegree.set(nextId, (indegree.get(nextId) || 0) - 1);
      if (indegree.get(nextId) === 0) queue.push(nextId);
    });
  }
  const hasCycle = topo.length !== bars.length;
  const affected = bars.filter(b => !topo.includes(b.id));
  const unmet = edges.filter(({to}) => to.status !== 'done');
  let critical = [];
  let criticalDays = 0;
  if (!hasCycle && edges.length) {
    const weight = new Map();
    const prev = new Map();
    const topoBars = topo.map(id => barMap.get(id));
    topoBars.forEach(bar => {
      let best = 0;
      let bestDep = null;
      (depsMap.get(bar.id) || []).forEach(depId => {
        const w = weight.get(depId) || 0;
        if (w > best) { best = w; bestDep = depId; }
      });
      weight.set(bar.id, best + Math.max(1, diffDays(bar.start, bar.end) + 1));
      prev.set(bar.id, bestDep);
    });
    let last = null;
    bars.forEach(bar => {
      if (!last || (weight.get(bar.id)||0) > (weight.get(last.id)||0)) last = bar;
    });
    if (last) {
      const pathIds = [];
      let cur = last.id;
      const seen = new Set();
      while (cur && !seen.has(cur)) {
        seen.add(cur);
        pathIds.unshift(cur);
        cur = prev.get(cur);
      }
      critical = pathIds.map(id => barMap.get(id));
      criticalDays = weight.get(last.id) || 0;
      if (critical.length < 2) critical = [];
    }
  }
  const statusBadge = (status) => `<span class="badge-pill ${status === 'done' ? 'done' : status === 'blocked' ? 'blocked' : status === 'doing' ? 'doing' : ''}">${esc(STATUS[status] ? STATUS[status].label : status)}</span>`;
  const root = document.createElement('div');
  const pathHtml = critical.length ? `
    <div class="dep-chain">
      <div class="dep-chain-title">最长依赖链（按排期天数合计约 ${criticalDays} 天）</div>
      <div class="dep-chain-flow">
        ${critical.map((b,i) => `
          <button class="dep-chain-node" type="button" data-dep-open="${escAttr(b.id)}" title="打开排期详情">${esc(b.title || '未命名排期')}<span class="small-status">${esc(STATUS[b.status].label)}</span></button>
          ${i < critical.length - 1 ? '<span class="dep-arrow">→</span>' : ''}
        `).join('')}
      </div>
      <p class="table-hint" style="margin-bottom:0">仅按依赖链与排期持续天数给出本地列表估算，不会自动改动任何日期。</p>
    </div>` : '';
  const unmetHtml = unmet.length ? `
    <div class="dep-graph-note" style="margin-bottom:6px">未满足前置（${unmet.length}）：</div>
    ${unmet.map(({from,to}) => `<div class="dep-warning-row"><span class="dep-warning-icon">△</span><span><b>${esc(from.title || '未命名排期')}</b> 等待 <b>${esc(to.title || '未命名排期')}</b>（${esc(STATUS[to.status].label)}，结束 ${esc(fmtYMD(to.end))}）</span></div>`).join('')}
  ` : '';
  const rows = edges.map(({from,to}) => `
    <tr>
      <td><button class="table-link" type="button" data-dep-open="${escAttr(from.id)}">${esc(from.title || '未命名排期')}</button></td>
      <td><button class="table-link" type="button" data-dep-open="${escAttr(to.id)}">${esc(to.title || '未命名排期')}</button></td>
      <td>${statusBadge(to.status)}</td>
      <td>${to.status === 'done' ? '<span class="badge-pill done">已满足</span>' : '<span class="badge-pill overdue">未满足</span>'}</td>
    </tr>`).join('');
  root.innerHTML = `
    <div class="kpi-inline">
      <span>排期 <b>${bars.length}</b></span>
      <span>依赖关系 <b>${edges.length}</b></span>
      <span>未满足 <b>${unmet.length}</b></span>
      <span>循环/受影响 <b>${affected.length}</b></span>
    </div>
    ${hasCycle ? `<div class="modal-callout danger" style="margin-bottom:10px">检测到循环依赖或无法完成拓扑排序的排期（${affected.map(b => esc(b.title || '未命名排期')).join('、')}）。请先在详情抽屉中解除依赖，关键路径暂不可计算。</div>` : ''}
    ${pathHtml}
    ${unmetHtml}
    ${edges.length ? `<div class="milestone-table-wrap"><table class="data-table">
      <thead><tr><th>后置排期</th><th>前置排期</th><th>前置状态</th><th>判定</th></tr></thead>
      <tbody>${rows}</tbody></table></div>` : '<div class="empty-table">还没有依赖关系。可在排期详情的「前置依赖」中添加；前置未完成时，后置块会给出提示。</div>'}
    <p class="table-hint">依赖仅作为本地提示，不会自动调整排期日期；修改前置状态为“已完成”后，未满足提示自动消失。</p>`;
  root.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-dep-open]');
    if (!btn) return;
    const barId = btn.dataset.depOpen;
    closeModal();
    setTimeout(() => openDrawer(barId, { focusTitle:false }), 60);
  });
  openModal({
    kicker:'DEPENDENCIES / 关键路径',
    title:'依赖关系与关键路径',
    body: root,
    size:'wide',
    footer: [{ label:'关闭', className:'btn primary', onClick: closeModal }]
  });
}

/* ============================================================
   工作周报
   ============================================================ */
function buildWeeklyReport(weekStart){
  const weekEnd = addDays(weekStart, 6);
  const nextStart = addDays(weekStart, 7);
  const nextEnd = addDays(nextStart, 6);
  const today = todayISO();
  const laneMap = new Map(db.lanes.map(l => [l.id,l]));
  const laneName = bar => laneMap.get(bar.laneId)?.name || '未归属';
  const overview = bar => `[${laneName(bar)}] ${bar.title || '未命名排期'}（${fmtYMD(bar.start)} → ${fmtYMD(bar.end)}，进度 ${clamp(bar.progress||0,0,100)}%，${STATUS[bar.status].label}）`;
  const completed = [];
  const doing = [];
  const next = [];
  const risks = [];

  db.bars.forEach(bar => {
    if (bar.status === 'done' && bar.end >= weekStart && bar.end <= weekEnd) {
      completed.push(`- ${overview(bar)}`);
    }
    if (bar.status === 'doing' && bar.start <= weekEnd && bar.end >= weekStart) {
      doing.push(`- ${overview(bar)}`);
    }
    if (bar.status !== 'done' && bar.status !== 'cancel' && bar.start <= nextEnd && bar.end >= nextStart) {
      next.push(`- ${overview(bar)}`);
    }
  });
  db.bars.forEach(bar => {
    (bar.milestones || []).forEach(ms => {
      if (ms.done && ms.date >= weekStart && ms.date <= weekEnd) {
        completed.push(`- ◆ 已完成里程碑：${ms.name || '未命名节点'}（${fmtYMD(ms.date)}）· ${bar.title || '未命名排期'}`);
      }
      if (!ms.done && ms.date >= nextStart && ms.date <= nextEnd) {
        next.push(`- ◆ 里程碑计划：${ms.name || '未命名节点'}（${fmtYMD(ms.date)}）· ${bar.title || '未命名排期'}`);
      }
    });
  });

  const riskBarReasons = new Map();
  const addRisk = (bar, reason) => {
    if (!riskBarReasons.has(bar.id)) riskBarReasons.set(bar.id, { bar, reasons:[] });
    const record = riskBarReasons.get(bar.id);
    if (!record.reasons.includes(reason)) record.reasons.push(reason);
  };
  db.bars.forEach(bar => {
    if (bar.status === 'done' || bar.status === 'cancel') return;
    if (bar.end < today) addRisk(bar, `已逾期，结束日 ${fmtYMD(bar.end)}`);
    if (bar.status === 'blocked') addRisk(bar, '状态为阻塞');
    const unmet = unmetDependencies(bar);
    if (unmet.length) addRisk(bar, '前置未完成：' + unmet.map(x => x.title || '未命名排期').join('、'));
  });
  Array.from(riskBarReasons.values())
    .sort((a,b) => a.bar.end.localeCompare(b.bar.end))
    .forEach(({bar,reasons}) => {
      risks.push(`- ${overview(bar)}｜风险：${reasons.join('；')}`);
    });
  getPendingMilestones()
    .filter(item => item.diff < 0 || item.diff <= 7)
    .forEach(({bar,milestone,diff}) => {
      const when = diff < 0 ? `逾期 ${Math.abs(diff)} 天` : diff === 0 ? '今天' : `还有 ${diff} 天`;
      risks.push(`- ◆ ${milestone.name || '未命名节点'}（${fmtYMD(milestone.date)}，${when}）· ${bar.title || '未命名排期'}`);
    });

  const section = (title, items) => `${title}\n${items.length ? items.join('\n') : '- 无'}\n`;
  return [
    `工作周报（${fmtYMD(weekStart)} ~ ${fmtYMD(weekEnd)}）`,
    `统计时间：${fmtYMD(today)} · 本地生成`,
    '',
    section('一、本周已完成', completed),
    section('二、本周进行中', doing),
    section(`三、下周计划（${fmtYMD(nextStart)} ~ ${fmtYMD(nextEnd)}）`, next),
    section('四、逾期与风险', risks)
  ].join('\n');
}

  const root = document.createElement('div');

/* ============================================================
   事件绑定
   ============================================================ */
function focusSearch(){
  const input = $('searchInput');
  if (!input) return;
  input.focus();
  input.select();
}
function trapModalTab(e){
  if (!isModalOpen()) return;
  const modal = $('modalBox');
  const focusables = qsa('button:not(:disabled),input:not(:disabled):not([type="hidden"]),select:not(:disabled),textarea:not(:disabled),a[href],[tabindex]:not([tabindex="-1"])', modal)
    .filter(el => el.offsetWidth > 0 || el.offsetHeight > 0 || el === document.activeElement);
  if (!focusables.length) return;
  const first = focusables[0], last = focusables[focusables.length-1];
  if (e.shiftKey && (document.activeElement === first || !modal.contains(document.activeElement))) {
    e.preventDefault();
    last.focus();
  } else if (!e.shiftKey && document.activeElement === last) {
    e.preventDefault();
    first.focus();
  }
}
function onGlobalKeyDown(e){
  if (e.key === 'Tab') {
    trapModalTab(e);
    return;
  }
  if (e.key === 'Escape') {
    if (isModalOpen()) {
      e.preventDefault();
      closeModal();
      return;
    }
    if (activePopover) {
      e.preventDefault();
      closePopover();
      return;
    }
    if (document.body.classList.contains('drawer-open')) {
      e.preventDefault();
      closeDrawer();
      return;
    }
    return;
  }
  if (isModalOpen()) return;
  const target = e.target instanceof Element ? e.target : null;
  const inField = !!(target && (target.closest('input,textarea,select') || target.closest('[contenteditable="true"]')));
  const mod = e.ctrlKey || e.metaKey;
  if (mod && !e.altKey) {
    const key = String(e.key || '').toLowerCase();
    if (key === 'z') {
      e.preventDefault();
      if (e.shiftKey) redo(); else undo();
      return;
    }
    if (key === 'y') {
      e.preventDefault();
      redo();
      return;
    }
  }
  if (inField || mod || e.altKey || e.repeat) return;
  const keyLower = String(e.key || '').toLowerCase();
  if (e.key === '?') {
    e.preventDefault();
    openHelpModal();
    return;
  }
  if (keyLower === 'n') {
    e.preventDefault();
    quickNewBarToday();
    return;
  }
  if (keyLower === 't') {
    e.preventDefault();
    scrollToToday({ smooth:true, resetIfMissing:true });
    return;
  }
  if (e.key === '/') {
    e.preventDefault();
    focusSearch();
  }
}

  $('menuBackdrop')?.addEventListener('click', closePopover);

  document.addEventListener('keydown', onGlobalKeyDown);
  window.addEventListener('resize', syncChromeHeightSoon);
  window.addEventListener('blur', () => {
    if (pointerOp) {
      // 焦点丢失时安全取消未完成手势，不写入任何日期变更。
      const op = pointerOp;
      pointerOp = null;

      document.removeEventListener('mouseup', onDocumentMouseUp, true);
      document.body.classList.remove('dragging-active');

      const el = qs(sel);
      if (el) ro.observe(el);

  window.addEventListener('beforeprint', () => {

}

/* ============================================================
   B 版：云端同步（/api/schedule）+ 变更记录 + 冲突处理
   ------------------------------------------------------------
   设计原则：
   1. 本地 localStorage 仍是唯一真相源，云端是同步副本；断网照常编辑。
   2. 每次 put 必须带 baseRevision，服务端版本不等则 409，绝不静默覆盖。
   3. 变更记录由「同步前后快照 diff」生成，不侵入 A 版 50 处 saveState 调用点。
   4. 回滚按 changes 里保存的 from 值 / 删除快照还原，回滚本身也记一条。
   ============================================================ */
const CLOUD_META_KEY = 'schedule-station-cloud-v1';
const CLOUD_DEBOUNCE = 1200;
let cloudMeta = { revision: 0, lastSyncedAt: 0, lastBy: '', lastSnapshot: '' };
let cloudState = { kind: 'idle', text: '云端未连接', pending: 0, inFlight: false, online: null };
let cloudTimer = null;
let conflictPayload = null;
let changesCache = [];

cloudState.online = (typeof navigator === 'undefined') ? true : navigator.onLine !== false;

function cloudToken(){ return (window.ADMIN && window.ADMIN.token) || ''; }
function cloudUser(){ return (window.ADMIN && window.ADMIN.username) || ''; }
function cloudPost(payload){
  return fetch('/api/schedule', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(Object.assign({ token: cloudToken() }, payload))
  }).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (d) {
      return { status: r.status, data: d || {} };
    });
  });
}
function loadCloudMeta(){
  try {
    const t = localStorage.getItem(CLOUD_META_KEY);
    if (t) { const o = JSON.parse(t); if (o && typeof o === 'object') cloudMeta = Object.assign(cloudMeta, o); }
  } catch (_) {}
}
function saveCloudMeta(){
  try { localStorage.setItem(CLOUD_META_KEY, JSON.stringify(cloudMeta)); } catch (_) {}
}
function setCloudState(kind, text, pending){
  cloudState.kind = kind; cloudState.text = text;
  if (typeof pending === 'number') cloudState.pending = pending;
  const wrap = $('syncCloud'), label = $('syncCloudText'), badge = $('pendingBadge');
  if (wrap) {
    wrap.dataset.k = kind;
    wrap.title = text + (cloudState.pending ? '｜待同步 ' + cloudState.pending + ' 项' : '');
  }
  if (label) label.textContent = text;
  if (badge) { badge.textContent = String(cloudState.pending); badge.classList.toggle('show', cloudState.pending > 0); }
}
function currentSnapshot(){ return JSON.stringify({ lanes: db.lanes, bars: db.bars, settings: db.settings }); }
function fmtStamp(ts){
  if (!ts) return '未知时间';
  const d = new Date(Number(ts));
  const p = function (n) { return String(n).padStart(2, '0'); };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

/* ── 变更 diff：产出「谁 / 何时 / 改了哪个排期的哪些字段 / 旧值→新值」 ── */
const BAR_FIELD_LABEL = {
  title: '标题', start: '开始日', end: '结束日', color: '颜色', status: '状态', prio: '优先级',
  progress: '进度', owner: '负责人', tags: '标签', note: '备注', laneId: '所属列',
  stages: '阶段', milestones: '里程碑', dependsOn: '依赖'
};
function indexById(list){ const m = new Map(); (list || []).forEach(function (x) { if (x && x.id) m.set(x.id, x); }); return m; }
function sameVal(k, a, b){
  if (k === 'stages' || k === 'milestones' || k === 'dependsOn') return JSON.stringify(a || []) === JSON.stringify(b || []);
  return String(a == null ? '' : a) === String(b == null ? '' : b);
}
function diffStates(prev, next){
  const out = [];
  const p = prev || {}, n = next || {};
  const pLanes = indexById(p.lanes), nLanes = indexById(n.lanes);
  const pBars = indexById(p.bars), nBars = indexById(n.bars);
  const uid = function () { return 'ch_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); };

  nLanes.forEach(function (lane, id) {
    if (!pLanes.has(id)) { out.push({ type: 'add', scope: 'lane', targetId: id, title: lane.name || '(未命名列)', fields: [] }); return; }
    const o = pLanes.get(id), f = [];
    if (o.name !== lane.name) f.push({ k: '列名', from: o.name, to: lane.name });
    if (o.color !== lane.color) f.push({ k: '颜色', from: o.color, to: lane.color });
    if (!!o.hidden !== !!lane.hidden) f.push({ k: '显示', from: !o.hidden ? '显示' : '隐藏', to: !lane.hidden ? '显示' : '隐藏' });
    if (f.length) out.push({ type: 'mod', scope: 'lane', targetId: id, title: lane.name || '', fields: f });
  });
  pLanes.forEach(function (lane, id) {
    if (!nLanes.has(id)) out.push({ type: 'del', scope: 'lane', targetId: id, title: lane.name || '', fields: [], snapshot: lane });
  });

  nBars.forEach(function (bar, id) {
    if (!pBars.has(id)) { out.push({ type: 'add', scope: 'bar', targetId: id, title: bar.title || '(未命名排期)', fields: [] }); return; }
    const o = pBars.get(id), f = [];
    Object.keys(BAR_FIELD_LABEL).forEach(function (k) {
      if (!sameVal(k, o[k], bar[k])) f.push({ k: BAR_FIELD_LABEL[k], from: o[k], to: bar[k], key: k });
    });
    if (f.length) out.push({ type: 'mod', scope: 'bar', targetId: id, title: bar.title || '', fields: f });
  });
  pBars.forEach(function (bar, id) {
    if (!nBars.has(id)) out.push({ type: 'del', scope: 'bar', targetId: id, title: bar.title || '', fields: [], snapshot: bar });
  });

  return out.map(function (c) {
    return {
      id: uid(), at: Date.now(), by: cloudUser(),
      type: c.type, scope: c.scope, targetId: c.targetId, title: c.title,
      fields: (c.fields || []).slice(0, 12).map(function (f) {
        return { k: f.k, key: f.key || '', from: f.from, to: f.to };
      }),
      snapshot: c.snapshot || null
    };
  });
}

/* ── 节流：本地保存（50 处调用点）→ 统一在这里合流 ── */
function scheduleCloudSync(){
  if (!cloudToken()) { setCloudState('idle', '未登录后台'); return; }
  const snap = currentSnapshot();
  if (snap === cloudMeta.lastSnapshot) return;
  cloudState.pending += 1;
  setCloudState(cloudState.online ? 'syncing' : 'offline',
    cloudState.online ? '待同步' : '离线，稍后重试', cloudState.pending);
  clearTimeout(cloudTimer);
  cloudTimer = setTimeout(function () { flushCloud(); }, CLOUD_DEBOUNCE);
}

/* ── 提交 ── */
async function flushCloud(opts){
  const force = !!(opts && opts.force);
  if (!cloudToken()) return { ok: false, reason: 'no-token' };
  if (cloudState.inFlight) return { ok: false, reason: 'busy' };
  cloudState.online = navigator.onLine !== false;
  if (!cloudState.online && !force) { setCloudState('offline', '离线，稍后重试', cloudState.pending); return { ok: false, reason: 'offline' }; }

  const snap = currentSnapshot();
  if (!force && snap === cloudMeta.lastSnapshot) { setCloudState('saved', '已同步', 0); return { ok: true, unchanged: true }; }

  cloudState.inFlight = true;
  setCloudState('syncing', '同步中…');

  let changes = [];
  if (cloudMeta.lastSnapshot) {
    try { changes = diffStates(JSON.parse(cloudMeta.lastSnapshot), JSON.parse(snap)); } catch (_) { changes = []; }
  }

  try {
    const res = await cloudPost({
      action: 'put', baseRevision: cloudMeta.revision,
      data: { lanes: db.lanes, bars: db.bars, settings: db.settings },
      changes: changes
    });
    cloudState.inFlight = false;

    if (res.status === 200 && res.data.ok) {
      cloudMeta.revision = Number(res.data.revision) || (cloudMeta.revision + 1);
      cloudMeta.lastSnapshot = snap;
      cloudMeta.lastSyncedAt = res.data.updatedAt || Date.now();
      cloudMeta.lastBy = res.data.updatedBy || cloudUser();
      saveCloudMeta();
      setCloudState('saved', '已同步', 0);
      return { ok: true, revision: cloudMeta.revision };
    }
    if (res.status === 409 && res.data.conflict) {
      setCloudState('conflict', '有冲突，待处理');
      showConflictDialog(res.data);
      return { ok: false, reason: 'conflict' };
    }
    if (res.status === 401 || res.status === 403) { setCloudState('error', '登录已过期'); return { ok: false, reason: 'auth' }; }
    if (res.status === 413) {
      setCloudState('error', '数据过大');
      showToast(res.data.error || '排期数据超过上限，请清理变更记录', 'error', 7000);
      return { ok: false, reason: 'too-large' };
    }
    setCloudState('error', '同步失败', cloudState.pending);
    return { ok: false, reason: 'http-' + res.status, data: res.data };
  } catch (e) {
    cloudState.inFlight = false;
    cloudState.online = navigator.onLine !== false;
    setCloudState(cloudState.online ? 'error' : 'offline', cloudState.online ? '同步失败' : '离线，稍后重试', cloudState.pending);
    return { ok: false, reason: 'network' };
  }
}

async function pullCloud(withChanges){
  const res = await cloudPost({ action: 'get', withChanges: !!withChanges });
  if (res.status !== 200 || !res.data.ok) throw new Error((res.data && res.data.error) || ('HTTP ' + res.status));
  return res.data;
}

/* 把云端数据落地到本地并全量重绘（保留当前视图位置） */
function applyCloudData(d){
  const clean = sanitizeState({ lanes: d.lanes || [], bars: d.bars || [], settings: d.settings || {} });
  db.lanes = clean.state.lanes;
  db.bars = clean.state.bars;
  db.settings = Object.assign(makeDefaultSettings(), clean.state.settings);
  syncHiddenLanes();
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ lanes: db.lanes, bars: db.bars, settings: db.settings })); } catch (_) {}
  cloudMeta.lastSnapshot = currentSnapshot();
  saveCloudMeta();
  currentRange = makeRange();
  applyAllSettingsToUi();
  renderTimeline();
  refreshAll({ preserveView: true });
}

/* ── 启动：拉云端，决定用哪份 ── */
async function initCloudSync(){
  loadCloudMeta();
  if (!cloudToken()) { setCloudState('idle', '未登录后台'); return; }
  setCloudState(cloudState.online ? 'syncing' : 'offline', cloudState.online ? '读取云端…' : '离线');
  try {
    const d = await pullCloud(false);
    if (!d.found) {
      cloudMeta.revision = 0;
      setCloudState('syncing', '首次上传…');
      const r = await flushCloud({ force: true });
      if (r.ok) showToast('已把本机排期上传到云端（团队共享）', 'ok', 4200);
      return;
    }
    const serverSnap = JSON.stringify({ lanes: d.data.lanes || [], bars: d.data.bars || [], settings: d.data.settings || {} });
    const localSnap = currentSnapshot();
    const localClean = !cloudMeta.lastSnapshot || localSnap === cloudMeta.lastSnapshot;

    cloudMeta.revision = Number(d.revision) || 0;
    cloudMeta.lastSyncedAt = d.updatedAt || 0;
    cloudMeta.lastBy = d.updatedBy || '';
    saveCloudMeta();

    if (localClean) {
      if (localSnap !== serverSnap) {
        applyCloudData(d.data);
        showToast('已载入云端排期（' + (d.updatedBy || '同事') + ' 于 ' + fmtStamp(d.updatedAt) + ' 更新）', 'ok', 4600);
      }
      setCloudState('saved', '已同步', 0);
      return;
    }
    setCloudState('conflict', '有冲突，待处理');
    showConflictDialog({ serverRevision: d.revision, serverUpdatedAt: d.updatedAt, serverUpdatedBy: d.updatedBy, serverData: d.data });
  } catch (e) {
    setCloudState('error', '云端读取失败');
  }
}

/* ── 冲突：三选一 ── */
function showConflictDialog(server){
  conflictPayload = server;
  const mask = $('conflictMask');
  if (!mask) return;
  const who = server.serverUpdatedBy || '同事';
  const when = fmtStamp(server.serverUpdatedAt);
  const sBars = (server.serverData && server.serverData.bars) || [];
  const set = function (id, v) { const e = $(id); if (e) e.textContent = v; };
  set('cWho', who + '　' + when);
  set('cServerCount', '云端版本：' + sBars.length + ' 条排期');
  set('cLocalCount', '本地版本：' + db.bars.length + ' 条排期（含未同步改动）');
  mask.classList.add('open');
}
function closeConflict(){ const m = $('conflictMask'); if (m) m.classList.remove('open'); conflictPayload = null; }
async function resolveConflict(kind){
  if (!conflictPayload) { closeConflict(); return; }
  const server = conflictPayload;
  closeConflict();
  if (kind === 'server') {
    applyCloudData(server.serverData);
    cloudMeta.revision = Number(server.serverRevision) || cloudMeta.revision;
    cloudMeta.lastSnapshot = currentSnapshot();
    saveCloudMeta();
    setCloudState('saved', '已同步（采用云端）', 0);
    showToast('已采用云端版本', 'ok', 3200);
    return;
  }
  if (kind === 'local') {
    cloudMeta.revision = Number(server.serverRevision) || cloudMeta.revision;
    saveCloudMeta();
    setCloudState('syncing', '强制上传…');
    const r = await flushCloud({ force: true });
    if (r.ok) showToast('已用本地版本覆盖云端（' + (server.serverUpdatedBy || '同事') + ' 的改动已被覆盖）', 'warn', 6000);
    return;
  }
  // merge：以本地为基，把云端独有的列与排期补进来（条目级合并，同 id 以本地为准）
  const localBarIds = new Set(db.bars.map(function (b) { return b.id; }));
  const localLaneIds = new Set(db.lanes.map(function (l) { return l.id; }));
  let addLane = 0, addBar = 0;
  ((server.serverData && server.serverData.lanes) || []).forEach(function (l) {
    if (l && l.id && !localLaneIds.has(l.id)) { db.lanes.push(l); addLane++; }
  });
  ((server.serverData && server.serverData.bars) || []).forEach(function (b) {
    if (b && b.id && !localBarIds.has(b.id)) { db.bars.push(b); addBar++; }
  });
  currentRange = makeRange();
  applyAllSettingsToUi(); renderTimeline(); refreshAll({ preserveView: true });
  saveState({ quiet: true });
  cloudMeta.revision = Number(server.serverRevision) || cloudMeta.revision;
  saveCloudMeta();
  const r = await flushCloud({ force: true });
  showToast('已合并：补入云端 ' + addLane + ' 个列、' + addBar + ' 条排期；同 ID 以本地为准' + (r.ok ? '，已上传' : '，上传待重试'), r.ok ? 'ok' : 'warn', 6000);
}

/* ── 变更记录面板 ── */
function changeTag(t){
  if (t === 'add') return '<span class="cl-tag add">新增</span>';
  if (t === 'del') return '<span class="cl-tag del">删除</span>';
  return '<span class="cl-tag mod">修改</span>';
}
function renderChanges(){
  const box = $('changesBody');
  if (!box) return;
  if (!changesCache.length) { box.innerHTML = '<div class="cl-empty">还没有变更记录。团队成员每次保存都会在这里留痕。</div>'; return; }
  const rows = changesCache.slice().reverse().map(function (c) {
    const f = (c.fields || []).map(function (x) {
      const from = x.from == null ? '—' : String(x.from).slice(0, 26);
      const to = x.to == null ? '—' : String(x.to).slice(0, 26);
      return '<span class="cl-fields">' + escHtml(x.k) + '：' + escHtml(from) + ' → ' + escHtml(to) + '</span>';
    }).join('　');
    return '<div class="cl-item">' +
      '<span class="cl-time">' + escHtml(fmtStamp(c.at)) + '</span>' +
      '<div class="cl-body">' + changeTag(c.type) +
        '<span class="cl-title">' + escHtml(c.by || '未知') + '</span> ' +
        '<span class="cl-fields">' + (c.scope === 'lane' ? '列' : '排期') + '「' + escHtml(c.title || c.targetId || '') + '」</span>' +
        (f ? '<div>' + f + '</div>' : '') +
      '</div>' +
      '<button class="sync-x" type="button" title="撤销这条改动" data-rb="' + escHtml(c.id) + '">↺</button>' +
    '</div>';
  }).join('');
  box.innerHTML = rows;
  box.querySelectorAll('[data-rb]').forEach(function (btn) {
    btn.addEventListener('click', function () { rollbackChange(btn.dataset.rb); });
  });
}
function escHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
async function openChangesPanel(){
  const mask = $('changesMask');
  if (!mask) return;
  mask.classList.add('open');
  const box = $('changesBody');
  box.innerHTML = '<div class="cl-empty">读取中…</div>';
  try {
    const d = await pullCloud(true);
    changesCache = Array.isArray(d.changes) ? d.changes : [];
    renderChanges();
  } catch (e) {
    box.innerHTML = '<div class="cl-empty">读取失败：' + escHtml(e.message || e) + '</div>';
  }
}
function closeChanges(){ const m = $('changesMask'); if (m) m.classList.remove('open'); }

/* 单条回滚：add→删掉；del→用快照恢复；mod→把 from 写回 */
function rollbackChange(id){
  const c = changesCache.find(function (x) { return x.id === id; });
  if (!c) { showToast('找不到这条记录（可能是更早的历史，已被 500 条上限截断）', 'warn', 4200); return; }
  pushHistory();
  let done = false;
  if (c.type === 'add') {
    if (c.scope === 'lane') { const n = db.lanes.length; db.lanes = db.lanes.filter(function (l) { return l.id !== c.targetId; }); done = db.lanes.length < n; }
    else { const n = db.bars.length; db.bars = db.bars.filter(function (b) { return b.id !== c.targetId; }); done = db.bars.length < n; }
  } else if (c.type === 'del') {
    if (c.snapshot && c.snapshot.id) {
      if (c.scope === 'lane') { db.lanes.push(c.snapshot); done = true; }
      else { db.bars.push(c.snapshot); done = true; }
    }
  } else {
    const target = c.scope === 'lane'
      ? db.lanes.find(function (l) { return l.id === c.targetId; })
      : db.bars.find(function (b) { return b.id === c.targetId; });
    if (target) {
      (c.fields || []).forEach(function (f) {
        if (!f.key) return;
        target[f.key] = f.from;
      });
      done = true;
    }
  }
  if (!done) { showToast('回滚失败：对象已不存在或字段不可还原', 'warn', 4200); return; }
  currentRange = makeRange();
  applyAllSettingsToUi(); renderTimeline(); refreshAll({ preserveView: false });
  saveState({ quiet: true });
  showToast('已回滚该条改动（回滚本身也会记入变更记录）', 'ok', 4200);
  setTimeout(function () { flushCloud({ force: true }); }, 300);
}

/* ── 离线 / 在线 / 离开页面 ── */
window.addEventListener('online', function () {
  cloudState.online = true;
  showToast('网络已恢复，正在补同步…', 'ok', 3000);
  flushCloud({ force: true });
});
window.addEventListener('offline', function () {
  cloudState.online = false;
  setCloudState('offline', '离线，稍后重试', cloudState.pending);
});
window.addEventListener('beforeunload', function (e) {
  if (cloudState.pending > 0 && cloudMeta.lastSnapshot !== currentSnapshot()) {
    try {
      const body = JSON.stringify({ token: cloudToken(), action: 'put', baseRevision: cloudMeta.revision,
        data: { lanes: db.lanes, bars: db.bars, settings: db.settings }, changes: [] });
      navigator.sendBeacon && navigator.sendBeacon('/api/schedule', new Blob([body], { type: 'application/json' }));
    } catch (_) {}
  }
});

/* ── 到期提醒（里程碑 ≤N 天）：浏览器通知 + 站内 toast ── */
const NOTIFY_KEY = 'schedule-station-notify-v1';
function notifyPref(){
  const def = { enabled: false, days: 3, seen: {} };
  try {
    const t = localStorage.getItem(NOTIFY_KEY);
    if (!t) return def;
    const o = JSON.parse(t);
    return { enabled: !!o.enabled, days: Math.min(30, Math.max(1, Number(o.days) || 3)), seen: o.seen || {} };
  } catch (_) { return def; }
}
function saveNotifyPref(o){
  try { localStorage.setItem(NOTIFY_KEY, JSON.stringify({ enabled: !!o.enabled, days: o.days, seen: o.seen || {} })); } catch (_) {}
}
function collectDueMilestones(days){
  const today = todayISO();
  const limit = addDays(today, days);
  const out = [];
  (db.bars || []).forEach(function (bar) {
    (bar.milestones || []).forEach(function (ms) {
      if (!ms || ms.done || !ms.date) return;
      if (ms.date < today || ms.date > limit) return;
      out.push({ barId: bar.id, barTitle: bar.title || '', msId: ms.id, name: ms.name || '未命名节点', date: ms.date, left: diffDays(today, ms.date) });
    });
  });
  return out.sort(function (a, b) { return a.date.localeCompare(b.date); });
}
function renderNotifyUi(){
  const el = $('notifyToggle');
  if (!el) return;
  const p = notifyPref();
  const supported = (typeof Notification !== 'undefined');
  el.textContent = (p.enabled && supported) ? '🔔 提醒已开' : '🔕 提醒';
  el.title = supported
    ? (p.enabled ? '已开启：里程碑 ≤' + p.days + ' 天时弹浏览器通知，点此关闭' : '点此开启到期提醒（里程碑 ≤' + p.days + ' 天）')
    : '当前浏览器不支持系统通知，仅站内提示';
}
async function toggleNotify(){
  const p = notifyPref();
  if (typeof Notification === 'undefined') {
    showToast('当前浏览器不支持系统通知；到期节点仍会在顶部提醒条与「全部节点」中显示', 'warn', 5200);
    return;
  }
  if (p.enabled) {
    p.enabled = false; saveNotifyPref(p); renderNotifyUi();
    showToast('已关闭到期提醒（站内提醒条不受影响）', 'info', 3200);
    return;
  }
  let perm = Notification.permission;
  if (perm === 'default') { try { perm = await Notification.requestPermission(); } catch (_) { perm = 'denied'; } }
  if (perm !== 'granted') {
    showToast('浏览器拒绝了通知权限，可在地址栏左侧「网站设置 → 通知」里重新允许；站内提醒不受影响', 'warn', 6500);
    return;
  }
  p.enabled = true; saveNotifyPref(p); renderNotifyUi();
  showToast('已开启到期提醒：里程碑进入 ' + p.days + ' 天内会弹系统通知', 'ok', 3600);
  checkDueMilestones();
}
function checkDueMilestones(){
  const p = notifyPref();
  const due = collectDueMilestones(p.days);
  if (!due.length) return 0;
  // 清理 30 天前的 seen 记录，防止无限增长
  const cutoff = addDays(todayISO(), -30);
  Object.keys(p.seen).forEach(function (k) { if (String(p.seen[k]) < cutoff) delete p.seen[k]; });

  const fresh = due.filter(function (d) { return !p.seen[d.barId + ':' + d.msId + ':' + d.date]; });
  if (!fresh.length) return 0;

  if (p.enabled && typeof Notification !== 'undefined' && Notification.permission === 'granted') {
    const top = fresh.slice(0, 3).map(function (d) {
      return '· ' + d.name + '（' + d.date + '，还有 ' + d.left + ' 天）';
    }).join('\n');
    const more = fresh.length > 3 ? '\n…等 ' + fresh.length + ' 个节点' : '';
    try {
      const n = new Notification('排期到期提醒：' + fresh.length + ' 个节点将到期', {
        body: top + more,
        tag: 'schedule-due-' + todayISO(),
        requireInteraction: false
      });
      n.onclick = function () { try { window.focus(); } catch (_) {} n.close(); };
    } catch (_) {
      showToast('系统通知发送失败，改用站内提示', 'warn', 3600);
    }
  } else if (fresh.length) {
    // 未开启系统通知：站内轻提示（不打扰，只提示一次）
    showToast('有 ' + fresh.length + ' 个里程碑将在 ' + p.days + ' 天内到期，点顶部「🔔 提醒」可开启系统通知', 'info', 5200);
  }
  fresh.forEach(function (d) { p.seen[d.barId + ':' + d.msId + ':' + d.date] = todayISO(); });
  saveNotifyPref(p);
  return fresh.length;
}
function initNotify(){
  renderNotifyUi();
  const el = $('notifyToggle');
  if (el) {
    el.addEventListener('click', toggleNotify);
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleNotify(); }
    });
  }
  setTimeout(function () { checkDueMilestones(); }, 2600);
  setInterval(function () { checkDueMilestones(); }, 60 * 60 * 1000);
}

/* ── 面板与按钮绑定 ── */
function bindSyncUi(){
  const oc = $('openChanges');
  if (oc) {
    oc.addEventListener('click', function () { openChangesPanel(); });
    oc.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openChangesPanel(); }
    });
  }
  const cc = $('changesClose'); if (cc) cc.addEventListener('click', closeChanges);
  const cr = $('changesRefresh'); if (cr) cr.addEventListener('click', function () { openChangesPanel(); });
  const cm = $('changesMask');
  if (cm) cm.addEventListener('click', function (e) { if (e.target === cm) closeChanges(); });

  const xc = $('conflictClose');
  if (xc) xc.addEventListener('click', function () { closeConflict(); });
  const bs = $('conflictServer'); if (bs) bs.addEventListener('click', function () { resolveConflict('server'); });
  const bm = $('conflictMerge'); if (bm) bm.addEventListener('click', function () { resolveConflict('merge'); });
  const bl = $('conflictLocal'); if (bl) bl.addEventListener('click', function () { resolveConflict('local'); });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    const cm2 = $('changesMask'), fm = $('conflictMask');
    if (cm2 && cm2.classList.contains('open')) { closeChanges(); e.stopPropagation(); }
    else if (fm && fm.classList.contains('open')) { closeConflict(); e.stopPropagation(); }
  }, true);
}

function initialize(){
  db = loadStateFromStorage();
  initCloudSync();
  bindSyncUi();
  initNotify();
  syncHiddenLanes();
  currentRange = makeRange();
  applyAllSettingsToUi();
  bindEvents();
  renderTimeline();
  renderLanes({ preserveView:false });
  refreshChrome();
  setStatusFilter('all');
  setSearchQuery('');
  applyAllSettingsToUi();
  syncChromeHeight();
  syncChromeHeightSoon();

  const hasLoadError = bootIssues.some(x => x.includes('解析失败') || x.includes('无法读取'));
  if (bootIssues.length) {
    if (hasLoadError) setSaveIndicator('error','读取失败');
    else setSaveIndicator('warn','待保存');
    setTimeout(() => {
      bootIssues.forEach(issue => showToast(issue, 'error', 7000));
    }, 350);
  } else {
    saveState({ quiet:false });
  }

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      if (currentRange && currentRange.todayIndex >= 0) {
        scrollToToday({ smooth:false });
      } else {
        showToast('今天不在当前时间范围中：点击「今天」可重设范围', 'warn', 5200);
      }
      syncChromeHeightSoon();
      lastAutoScrolled = true;
    });
  });

  updateHistoryButtons();
  if (currentRange && currentRange.truncated && !bootIssues.length) {
    setTimeout(() => showToast(`时间范围超过 ${RANGE_LIMIT} 天上限，已按今天为中心截断显示`, 'warn', 5200), 420);
  }
}

initialize();
})();
