<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>数据统计 · 管理后台</title>
<style>
:root{--brand:#0D5C5A;--bg:#F7F5F0;--card:#fff;--line:#E8E4DB;--text:#4A5568;--green:#059669;--amber:#D97706}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
header{background:var(--brand);color:#fff;padding:1rem 2rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
header h1{font-size:1.2rem;font-weight:600}
header a{color:#b2d9d6;font-size:0.85rem;text-decoration:none}
header a:hover{color:#fff}
main{max-width:860px;margin:0 auto;padding:2rem 1rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin-bottom:1.5rem}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1.25rem}
.stat-card .label{font-size:0.82rem;color:#94a3b8}
.stat-card .nums{display:flex;gap:1.5rem;margin-top:0.6rem}
.stat-card .num{font-size:1.6rem;font-weight:600;color:var(--brand)}
.stat-card .num small{font-size:0.75rem;color:#94a3b8;font-weight:400}
.stat-card .num.dl{color:var(--amber)}
.table-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1.25rem}
.table-card h2{font-size:1rem;font-weight:600;color:var(--brand);margin-bottom:0.75rem}
table{width:100%;border-collapse:collapse}
th{background:var(--brand);color:#fff;padding:0.5rem 0.75rem;font-size:0.8rem;text-align:left}
td{padding:0.5rem 0.75rem;font-size:0.85rem;border-bottom:1px solid var(--line)}
.bar-cell{display:flex;align-items:center;gap:0.5rem}
.bar{height:14px;border-radius:4px;min-width:2px}
.bar.v{background:var(--brand)}
.bar.d{background:var(--amber)}
.refresh{font-size:0.78rem;color:#94a3b8;margin-top:0.75rem}

/* 总览 / 快照 */
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1.25rem;margin-top:1.5rem}
.panel h2{font-size:1rem;font-weight:600;color:var(--brand);margin-bottom:0.6rem}
.panel h3{font-size:0.88rem;font-weight:600;color:var(--brand);margin:1.1rem 0 0.5rem}
.meta{font-size:0.78rem;color:#94a3b8;line-height:1.8;word-break:break-all}
.meta b{color:var(--text);font-weight:500}
.badges{display:flex;flex-wrap:wrap;gap:0.35rem;margin-top:0.5rem}
.badge{font-size:0.7rem;padding:0.12rem 0.45rem;border-radius:999px;background:#eef4f4;color:var(--brand);border:1px solid #d3e4e3}
.badge.seed{background:#fef3c7;color:#92400e;border-color:#fde68a}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:0.7rem;margin-top:0.9rem}
.kpi{border:1px solid var(--line);border-radius:10px;padding:0.7rem 0.8rem;background:#fcfbf8}
.kpi .v{font-size:1.35rem;font-weight:600;color:var(--brand);line-height:1.2}
.kpi .k{font-size:0.74rem;color:#94a3b8;margin-top:0.2rem}
.warn{margin-top:0.75rem;padding:0.55rem 0.75rem;border-radius:8px;background:#fef3c7;border:1px solid #fde68a;color:#92400e;font-size:0.78rem;line-height:1.7}
.err{color:#dc2626;font-size:0.8rem}
.empty{font-size:0.8rem;color:#94a3b8;padding:0.5rem 0}
</style>
</head>
<body>
<script src="/admin/auth-check.js"></script>
<header>
  <h1>📊 数据统计</h1>
  <a href="/">← 回站点</a>
  <a href="/admin/index.html">课程管理</a>
  <a href="/admin/upload.html">资料上传</a>
  <a href="/admin/content.html">内容编辑</a>
<a href="javascript:;" onclick="logout()">退出</a>
</header>
<main>
  <div class="cards" id="cards"></div>
  <div class="table-card">
    <h2>最近 7 天趋势</h2>
    <div id="detailTable"></div>
    <div class="refresh" id="refreshTime"></div>
  </div>

  <div class="panel">
    <h2>站点数据总览</h2>
    <div class="meta" id="ovMeta">加载中…</div>
    <div class="badges" id="ovBadges"></div>
    <div class="warn" id="ovWarn" style="display:none"></div>
    <div class="grid" id="ovCards"></div>
    <h3>热门页面（近 7 天）</h3>
    <div id="ovPaths"></div>
  </div>

  <div class="panel">
    <h2>构建快照</h2>
    <div class="meta" id="snapMeta">加载中…</div>
    <div class="warn" id="snapWarn" style="display:none"></div>
    <div class="grid" id="snapCards"></div>
  </div>
</main>

<script>
var API = '/api/stats';

function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}

function load(){
  fetch(API, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(Object.assign({token:window.ADMIN.token},{action:'getStats'}))})
    .then(function(r){return r.json();})
    .then(function(d){
      renderCards(d);
      renderDetail(d.detail || []);
      document.getElementById('refreshTime').textContent = '数据更新于 ' + new Date().toLocaleString();
    })
    .catch(function(){
      document.getElementById('cards').innerHTML = '<p style="color:#dc2626">加载失败</p>';
    });
}

function renderCards(d){
  var cards = [
    {label:'今日', data:d.day},
    {label:'本周', data:d.week},
    {label:'本月', data:d.month}
  ];
  document.getElementById('cards').innerHTML = cards.map(function(c){
    return '<div class="stat-card"><div class="label">'+c.label+'</div>'+
      '<div class="nums">'+
      '<div class="num">'+(c.data.visits||0)+'<small> 访问</small></div>'+
      '<div class="num dl">'+(c.data.downloads||0)+'<small> 下载</small></div>'+
      '</div></div>';
  }).join('');
}

function renderDetail(detail){
  var max = 1;
  detail.forEach(function(x){ max = Math.max(max, x.visits, x.downloads); });
  var rows = detail.map(function(x){
    var vw = Math.max(2, Math.round(x.visits/max*100));
    var dw = Math.max(2, Math.round(x.downloads/max*100));
    var date = x.date.slice(5);
    return '<tr><td>'+date+'</td>'+
      '<td><div class="bar-cell"><div class="bar v" style="width:'+vw+'%"></div>'+x.visits+'</div></td>'+
      '<td><div class="bar-cell"><div class="bar d" style="width:'+dw+'%"></div>'+x.downloads+'</div></td></tr>';
  }).join('');
  document.getElementById('detailTable').innerHTML =
    '<table><thead><tr><th>日期</th><th>访问数</th><th>下载数</th></tr></thead><tbody>'+rows+'</tbody></table>';
}

/* ── 站点数据总览 ─────────────────────────────── */

var SRC_ORDER = ['materials','bank','contributors','users','checkins','traffic'];
var SRC_LABEL = {materials:'资料', bank:'题库', contributors:'贡献者', users:'学生账号', checkins:'打卡', traffic:'访问'};

function num(v){ var x = Number(v); return isFinite(x) ? x : 0; }
function fmt(v){ return num(v).toLocaleString('zh-CN'); }
function kpi(v, k){
  return '<div class="kpi"><div class="v">'+fmt(v)+'</div><div class="k">'+esc(k)+'</div></div>';
}
function showWarn(id, lines){
  var el = document.getElementById(id);
  if(!lines || !lines.length){ el.style.display = 'none'; el.innerHTML = ''; return; }
  el.style.display = 'block';
  el.innerHTML = lines.map(function(x){ return esc(x); }).join('<br>');
}

function loadOverview(){
  fetch('/api/overview', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({action:'get'})
  }).then(function(r){
    var cache = r.headers.get('x-metrics-cache') || '—';
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r.json().then(function(d){ return {d:d, cache:cache}; });
  }).then(function(x){
    renderOverview(x.d, x.cache);
  }).catch(function(e){
    document.getElementById('ovMeta').innerHTML = '<span class="err">加载失败：'+esc(e.message||'网络错误')+'</span>';
    document.getElementById('ovCards').innerHTML = '';
    document.getElementById('ovPaths').innerHTML = '';
  });
}

function renderOverview(d, cache){
  var live = d.live || {};
  var m = live.materials || {}, b = live.bank || {}, c = live.contributors || {};
  var s = live.students || {}, ci = live.checkins || {};

  document.getElementById('ovMeta').innerHTML =
    '数据更新于 <b>' + esc(new Date(num(d.serverTime)).toLocaleString()) + '</b>' +
    ' · 缓存 <b>' + esc(cache) + '</b>' +
    ' · TTL <b>' + fmt(d.ttl) + ' 秒</b>';

  var sources = d.sources || {};
  document.getElementById('ovBadges').innerHTML = SRC_ORDER.map(function(k){
    var v = sources[k] || 'seed';
    return '<span class="badge '+(v === 'cos' ? '' : 'seed')+'">'+esc(SRC_LABEL[k])+' '+esc(v)+'</span>';
  }).join('');

  var warns = [];
  if(d.partial === true){ warns.push('部分数据源读取失败，已回退到兜底快照：'); }
  if(Array.isArray(d.warnings)) d.warnings.forEach(function(w){ warns.push('· ' + w); });
  showWarn('ovWarn', warns);

  document.getElementById('ovCards').innerHTML = [
    kpi(m.items, '资料条目'),
    kpi(m.courses, '资料课程数'),
    kpi(b.questions, '题库题目'),
    kpi(b.courses, '题库课程数'),
    kpi(c.count, '贡献者人数'),
    kpi(c.contributions, '贡献次数'),
    kpi(s.registered, '注册学生'),
    kpi(ci.participants, '打卡人数'),
    kpi(ci.days, '累计打卡天数'),
    kpi(ci.minutes, '累计学习分钟'),
    kpi(ci.last7, '近 7 天打卡'),
    kpi(ci.today, '今日打卡')
  ].join('');

  var paths = Array.isArray(live.topPaths) ? live.topPaths : [];
  if(!paths.length){
    document.getElementById('ovPaths').innerHTML = '<div class="empty">暂无访问明细（统计结构 v1 或无数据）</div>';
  } else {
    var rows = paths.map(function(p){
      return '<tr><td>'+esc(p.path)+'</td><td>'+fmt(p.visits)+'</td></tr>';
    }).join('');
    document.getElementById('ovPaths').innerHTML =
      '<table><thead><tr><th>路径</th><th>近 7 天访问</th></tr></thead><tbody>'+rows+'</tbody></table>';
  }
}

/* ── 构建快照 ─────────────────────────────────── */

function loadSnapshot(){
  fetch('/data/site-metrics.json', {cache:'no-store'})
    .then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(renderSnapshot)
    .catch(function(e){
      document.getElementById('snapMeta').innerHTML = '<span class="err">读取失败：'+esc(e.message||'网络错误')+'</span>';
      document.getElementById('snapCards').innerHTML = '';
    });
}

function renderSnapshot(s){
  var co = s.courses || {}, site = s.site || {};
  var syl = (s.content && s.content.syllabus) || {};
  var gen = s.generatedAt ? new Date(s.generatedAt).toLocaleString() : '—';
  var hash = String(s.contentHash || '').replace(/^sha1:/, '').slice(0, 12) || '—';

  document.getElementById('snapMeta').innerHTML =
    '构建于 <b>' + esc(gen) + '</b> · 内容指纹 <b>' + esc(hash) + '</b>';

  showWarn('snapWarn', Array.isArray(s.warnings) ? s.warnings : []);

  document.getElementById('snapCards').innerHTML = [
    kpi(co.planEntries, '收录课程（排课条目）'),
    kpi(co.uniqueCodes, '唯一课程'),
    kpi(co.pages, '课程页面'),
    kpi(site.majors, '覆盖专业'),
    kpi(site.semesterPages, '学期页面'),
    kpi(site.stories, '学长分享'),
    kpi(syl.points, '知识点数'),
    kpi(syl.units, '章节数')
  ].join('');
}

load();
loadOverview();
loadSnapshot();
</script>
</body>
</html>
