<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>抽奖 · 管理后台</title>
<style>
:root{--brand:#0D5C5A;--bg:#F7F5F0;--card:#fff;--line:#E8E4DB;--text:#4A5568;--red:#dc2626;--green:#059669;--amber:#D97706;--gold:#C9A227;--silver:#8C9299;--bronze:#B87333}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
header{background:var(--brand);color:#fff;padding:1rem 2rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
header h1{font-size:1.2rem;font-weight:600}
header a{color:#b2d9d6;font-size:0.85rem;text-decoration:none}
header a:hover{color:#fff}
main{max-width:860px;margin:0 auto;padding:2rem 1rem}
.banner{background:var(--brand);color:#fff;border-radius:12px;padding:1.25rem 1.5rem;margin-bottom:1.25rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:0.75rem}
.banner .t{font-size:1.05rem;font-weight:600}
.banner .n{font-size:0.85rem;color:#b2d9d6}
.banner .n b{color:#fff;font-size:1.1rem}
.sync{display:inline-flex;align-items:center;gap:0.35rem;font-size:0.75rem;color:#b2d9d6}
.sync .dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block}
.sync.err .dot{background:var(--amber)}
.pool-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0.9rem;margin-bottom:1.25rem}
.pool-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1rem;text-align:center;position:relative;overflow:hidden}
.pool-card.empty{opacity:.5}
.pool-card .emoji{font-size:2.2rem;line-height:1;margin-bottom:0.4rem}
.pool-card .name{font-size:0.9rem;font-weight:600;color:var(--text)}
.pool-card .count{font-size:1.6rem;font-weight:700;color:var(--brand);margin-top:0.3rem}
.pool-card .count small{font-size:0.75rem;font-weight:400;color:#94a3b8}
.pool-card .bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:0.5rem}
.pool-card .bar i{display:block;height:100%;background:var(--brand);border-radius:3px;transition:width .3s}
.pool-card.tier1 .count{color:var(--gold)}
.pool-card.tier2 .count{color:var(--silver)}
.pool-card.tier3 .count{color:var(--bronze)}
.pool-card.tier1 .bar i{background:var(--gold)}
.pool-card.tier2 .bar i{background:var(--silver)}
.pool-card.tier3 .bar i{background:var(--bronze)}
.draw-panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:2rem 1.5rem;text-align:center;margin-bottom:1.25rem}
.result{min-height:3.5rem;display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:700;color:var(--text);margin-bottom:1.25rem;transition:all .2s}
.result.rolling{color:var(--brand);transform:scale(1.02)}
.result.won{color:var(--amber)}
.result .sub{font-size:0.85rem;color:#94a3b8;font-weight:400}
.draw-btn{display:inline-block;padding:0.9rem 3rem;border:none;border-radius:50px;font-size:1.15rem;font-weight:600;cursor:pointer;background:var(--brand);color:#fff;transition:all .15s;box-shadow:0 4px 14px rgba(13,92,90,.25)}
.draw-btn:hover{transform:translateY(-2px);opacity:.94}
.draw-btn:active{transform:translateY(0)}
.draw-btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.reset-btn{display:inline-block;margin-top:0.9rem;padding:0.4rem 1rem;border:1px solid var(--line);border-radius:6px;font-size:0.82rem;cursor:pointer;background:#fff;color:var(--red)}
.reset-btn:hover{border-color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1.25rem;margin-bottom:1.25rem}
.card h2{font-size:1rem;font-weight:600;color:var(--brand);margin-bottom:0.75rem}
.history{max-height:360px;overflow-y:auto}
.hrow{display:flex;align-items:center;gap:0.6rem;padding:0.45rem 0.5rem;border-bottom:1px solid #f0ede6;font-size:0.85rem}
.hrow:nth-child(odd){background:#faf9f6}
.hrow .idx{color:#94a3b8;font-size:0.75rem;width:2.4rem;text-align:right;flex-shrink:0}
.hrow .hn{flex:1;min-width:0}
.hrow .ht{color:#94a3b8;font-size:0.72rem;flex-shrink:0}
.empty-tip{text-align:center;color:#94a3b8;font-size:0.85rem;padding:1rem 0}
.name-row{display:flex;align-items:center;justify-content:center;gap:0.6rem;margin-bottom:1rem}
.name-row .name-label{font-size:0.85rem;color:#64748b;white-space:nowrap}
.name-row input{padding:0.5rem 0.9rem;border:1px solid var(--line);border-radius:8px;font-size:0.9rem;width:220px;max-width:60%;text-align:center;background:#fff}
.name-row input:focus{outline:none;border-color:var(--brand)}
.hrow .hwho{color:var(--brand);font-size:0.78rem;flex-shrink:0;max-width:30%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stats-table{width:100%;border-collapse:collapse;font-size:0.82rem}
.stats-table th{background:var(--brand);color:#fff;padding:0.5rem 0.6rem;text-align:center;font-size:0.78rem}
.stats-table td{padding:0.45rem 0.6rem;text-align:center;border-bottom:1px solid var(--line)}
.stats-table tr:hover{background:#f0faf8}
.stats-table td:first-child{text-align:left;font-weight:600}
@media(max-width:768px){main{padding:1rem 0.75rem}.result{font-size:1.25rem}.draw-btn{padding:0.8rem 2.2rem;font-size:1.05rem}.name-row input{width:60%}}
</style>
</head>
<body>
<script>
(function(){
  if (sessionStorage.getItem('admin_authed') === '1') return;
  var pw = prompt('请输入管理密码');
  if (pw !== '123456#') { alert('密码错误'); location.href = '/'; return; }
  sessionStorage.setItem('admin_authed', '1');
})();
</script>
<header>
  <h1>🎲 抽奖后台</h1>
  <a href="/">← 回站点</a>
  <a href="/admin/index.html">课程管理</a>
  <a href="/admin/upload.html">📤 资料上传</a>
  <a href="/admin/content.html">📝 内容编辑</a>
  <a href="/admin/stats.html">📊 数据统计</a>
</header>
<main>

  <div class="banner">
    <div class="t">🎉 奖池总览</div>
    <div class="n">剩余 <b id="totalLeft">0</b> 份 · 已抽出 <b id="totalDrawn">0</b> 份　<span class="sync" id="sync"><span class="dot"></span>云端同步中</span></div>
  </div>

  <div class="pool-grid" id="poolGrid"></div>

  <div class="draw-panel">
    <div class="name-row">
      <span class="name-label">🎯 抽奖人</span>
      <input type="text" id="drawerName" placeholder="输入姓名 / 学号" autocomplete="off">
    </div>
    <div class="result" id="result"><span class="sub">正在连接云端…</span></div>
    <button class="draw-btn" id="drawBtn">🎲 抽 奖</button>
    <div><button class="reset-btn" id="resetBtn">↺ 重置奖池</button></div>
  </div>

  <div class="card" id="statsCard" style="display:none">
    <h2>🏆 中奖统计</h2>
    <div style="overflow-x:auto"><table class="stats-table" id="statsTable"></table></div>
  </div>

  <div class="card">
    <h2>抽奖记录 <span style="color:#94a3b8;font-weight:400;font-size:0.8rem" id="histCount"></span></h2>
    <div class="history" id="history"><div class="empty-tip">暂无记录</div></div>
  </div>

</main>

<script>
var PRIZES = [
  {name:'一等奖 · 魔方', emoji:'🧊', total:10, tier:'tier1'},
  {name:'二等奖 · 毛绒挂件', emoji:'🧸', total:60, tier:'tier2'},
  {name:'三等奖 · 碱水面包挂件', emoji:'🥨', total:100, tier:'tier3'},
  {name:'参与奖', emoji:'🎁', total:800, tier:''}
];
var API = '/api/lottery';

var state = { remaining: PRIZES.map(function(p){return p.total;}), history: [] };
var rolling = false;
var lastSync = null;
var NAME_KEY = 'lottery_name';

function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}

function call(action, extra){
  return fetch(API, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(Object.assign({action:action}, extra||{}))
  }).then(function(r){return r.json();});
}

function totalRemaining(){return state.remaining.reduce(function(a,b){return a+b;},0);}

function setSync(ok){
  var el = document.getElementById('sync');
  el.className = 'sync' + (ok ? '' : ' err');
  el.innerHTML = '<span class="dot"></span>' + (ok ? '云端已同步' + (lastSync?' · '+lastSync:'') : '离线 · 重试中');
}

function applyServer(d){
  if (d && d.remaining && d.remaining.length === PRIZES.length){
    state.remaining = d.remaining;
    if (d.history) state.history = d.history;
    lastSync = new Date().toTimeString().slice(0,8);
    setSync(true);
  }
}

function refresh(){
  return call('getState').then(function(d){
    if (d.error){ setSync(false); throw new Error(d.error); }
    applyServer(d);
  }).catch(function(e){ setSync(false); });
}

function render(){
  var left = totalRemaining();
  var totalInit = PRIZES.reduce(function(a,p){return a+p.total;},0);
  document.getElementById('totalLeft').textContent = left;
  document.getElementById('totalDrawn').textContent = totalInit - left;

  var grid = document.getElementById('poolGrid');
  grid.innerHTML = PRIZES.map(function(p,i){
    var rem = state.remaining[i];
    var pct = p.total ? Math.round(rem/p.total*100) : 0;
    var empty = rem <= 0;
    return '<div class="pool-card '+p.tier+(empty?' empty':'')+'">'+
      '<div class="emoji">'+p.emoji+'</div>'+
      '<div class="name">'+esc(p.name)+'</div>'+
      '<div class="count">'+rem+'<small> / '+p.total+'</small></div>'+
      '<div class="bar"><i style="width:'+pct+'%"></i></div>'+
      '</div>';
  }).join('');

  var btn = document.getElementById('drawBtn');
  if (left <= 0){
    btn.disabled = true;
    btn.textContent = '🎉 奖池已抽空';
  } else {
    btn.disabled = rolling;
    btn.textContent = rolling ? '抽奖中…' : '🎲 抽 奖';
  }

  var hist = document.getElementById('history');
  var hc = document.getElementById('histCount');
  if (!state.history.length){
    hist.innerHTML = '<div class="empty-tip">暂无记录</div>';
    hc.textContent = '';
  } else {
    hc.textContent = '（最近 '+Math.min(state.history.length,100)+' / 共 '+state.history.length+' 次）';
    hist.innerHTML = state.history.slice(0,100).map(function(h,i){
      var t = h.time ? new Date(h.time) : null;
      var ts = t ? (pad(t.getHours())+':'+pad(t.getMinutes())+':'+pad(t.getSeconds())) : '';
      return '<div class="hrow"><span class="idx">#'+(state.history.length-i)+'</span>'+
        '<span class="hn">'+h.emoji+' '+esc(h.name)+'</span>'+
        '<span class="hwho">'+esc(h.by||'匿名')+'</span>'+
        '<span class="ht">'+ts+'</span></div>';
    }).join('');
  }
  renderStats();
}
function pad(n){return (n<10?'0':'')+n;}

function renderStats(){
  var tally = {};
  state.history.forEach(function(h){
    var by = (h.by && String(h.by).trim()) || '匿名';
    if (!tally[by]) tally[by] = { t1:0, t2:0, t3:0, t4:0 };
    tally[by]['t' + ((h.tier||3)+1)]++;
  });
  var names = Object.keys(tally);
  names.sort(function(a,b){
    if (tally[b].t1 !== tally[a].t1) return tally[b].t1 - tally[a].t1;
    if (tally[b].t2 !== tally[a].t2) return tally[b].t2 - tally[a].t2;
    if (tally[b].t3 !== tally[a].t3) return tally[b].t3 - tally[a].t3;
    return a.localeCompare(b);
  });
  var card = document.getElementById('statsCard');
  if (!names.length){ card.style.display = 'none'; return; }
  card.style.display = 'block';
  document.getElementById('statsTable').innerHTML =
    '<thead><tr><th>姓名/学号</th><th>🥇一等</th><th>🥈二等</th><th>🥉三等</th><th>🎁参与</th><th>合计</th></tr></thead><tbody>' +
    names.map(function(n){
      var t = tally[n];
      return '<tr><td>'+esc(n)+'</td><td>'+t.t1+'</td><td>'+t.t2+'</td><td>'+t.t3+'</td><td>'+t.t4+'</td><td><b>'+(t.t1+t.t2+t.t3+t.t4)+'</b></td></tr>';
    }).join('') + '</tbody>';
}

function draw(){
  if (rolling) return;
  var nm = document.getElementById('drawerName').value.trim();
  if (!nm){
    alert('请先输入你的姓名或学号');
    document.getElementById('drawerName').focus();
    return;
  }
  try{ localStorage.setItem(NAME_KEY, nm); }catch(e){}
  if (totalRemaining() <= 0){ alert('奖池已抽空！请点击「重置奖池」。'); return; }

  rolling = true;
  var btn = document.getElementById('drawBtn');
  btn.disabled = true;
  btn.textContent = '抽奖中…';

  var resultEl = document.getElementById('result');
  var minDuration = 1400;
  var startTime = Date.now();
  var rollDone = false;
  var settled = false;
  var serverPrize = null, serverState = null, serverErr = null;

  var rollTimer = setInterval(function(){
    var tmp = PRIZES[Math.floor(Math.random()*PRIZES.length)];
    resultEl.textContent = tmp.emoji + ' ' + tmp.name;
    resultEl.className = 'result rolling';
    if (Date.now() - startTime >= minDuration){
      rollDone = true;
      clearInterval(rollTimer);
      if (settled) finishDraw();
    }
  }, 90);

  function finishDraw(){
    if (serverErr){
      resultEl.textContent = serverErr.error === 'empty' ? '🎉 奖池已抽空' : '⚠️ ' + (serverErr.message || '请求失败');
      resultEl.className = 'result';
      if (serverErr.error === 'empty') state.remaining = PRIZES.map(function(){return 0;});
    } else if (serverPrize){
      resultEl.textContent = serverPrize.emoji + ' ' + serverPrize.name;
      resultEl.className = 'result won';
      if (serverState.remaining) state.remaining = serverState.remaining;
      if (serverState.history) state.history = serverState.history;
      lastSync = new Date().toTimeString().slice(0,8);
      setSync(true);
    }
    rolling = false;
    render();
  }

  call('draw', { name: nm }).then(function(d){
    if (d.error){ serverErr = d; }
    else { serverPrize = d.prize || null; serverState = d; }
    settled = true;
    if (rollDone) finishDraw();
  }).catch(function(e){
    serverErr = { error:'network', message: e && e.message ? e.message : '网络错误' };
    settled = true;
    if (rollDone) finishDraw();
  });

  // 兜底：8 秒无响应强制结束
  setTimeout(function(){
    if (!settled){
      serverErr = { error:'timeout', message:'请求超时' };
      settled = true;
      if (rollDone) finishDraw();
    }
  }, 8000);
}

document.getElementById('drawBtn').addEventListener('click', draw);

document.getElementById('resetBtn').addEventListener('click', function(){
  if (!confirm('确定要重置奖池吗？\n所有奖品数量将恢复，抽奖记录将被清空（云端同步生效）。')) return;
  this.disabled = true;
  call('reset').then(function(d){
    if (d.error){ alert('重置失败：' + (d.message || d.error)); return; }
    applyServer(d);
    document.getElementById('result').innerHTML = '<span class="sub">奖池已重置，点击下方按钮开始抽奖</span>';
    render();
  }).catch(function(e){
    alert('重置失败：网络错误');
  }).finally(function(){
    document.getElementById('resetBtn').disabled = false;
  });
});

// 初始加载
try{ document.getElementById('drawerName').value = localStorage.getItem(NAME_KEY) || ''; }catch(e){}
refresh().then(function(){ render(); }).catch(function(){ render(); });

// 轮询同步：每 3 秒拉一次云端，保证多设备共用（抽奖中不打扰）
setInterval(function(){
  if (rolling) return;
  refresh().then(function(){ render(); }).catch(function(){});
}, 3000);
</script>
</body>
</html>
