<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>抽奖已关闭</title>
<style>
:root{--brand:#0D5C5A;--bg:#F7F5F0;--card:#fff;--line:#E8E4DB;--text:#4A5568}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:3rem 2.5rem;text-align:center;max-width:420px;box-shadow:0 4px 20px rgba(0,0,0,.05)}
.emoji{font-size:3.5rem;line-height:1;margin-bottom:1rem}
h1{font-size:1.3rem;font-weight:600;color:var(--text);margin-bottom:.7rem}
p{font-size:.9rem;color:#94a3b8;margin-bottom:1.8rem}
a{display:inline-block;padding:.6rem 1.6rem;background:var(--brand);color:#fff;border-radius:50px;text-decoration:none;font-size:.9rem;font-weight:500;transition:opacity .15s}
a:hover{opacity:.9}
</style>
</head>
<body>
<div class="box">
  <div class="emoji">🚫</div>
  <h1>抽奖页面已关闭</h1>
  <p>本次活动已结束，抽奖入口已下线。<br>感谢大家的参与！</p>
  <a href="/admin/index.html">← 返回管理后台</a>
</div>
</body>
</html>
