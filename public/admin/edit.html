<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>编辑课程</title>
<style>
:root{--brand:#0D5C5A;--bg:#F7F5F0;--card:#fff;--line:#E8E4DB;--text:#4A5568;--red:#dc2626;--green:#059669}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
header{background:var(--brand);color:#fff;padding:0.75rem 2rem;display:flex;align-items:center;gap:1rem}
header a{color:#b2d9d6;font-size:0.85rem;text-decoration:none;flex-shrink:0}
header a:hover{color:#fff}
header h2{font-size:1rem;font-weight:500;flex:1}
main{max-width:800px;margin:2rem auto;padding:0 1rem}
.meta{display:flex;gap:1.5rem;flex-wrap:wrap;margin-bottom:1.5rem;font-size:0.85rem;color:var(--text)}
.meta span{background:var(--card);padding:0.25rem 0.75rem;border-radius:6px;border:1px solid var(--line)}
.section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1.25rem;margin-bottom:1rem}
.section h3{font-size:0.95rem;color:var(--brand);margin-bottom:0.5rem;display:flex;align-items:center;gap:0.5rem}
.section h3 .num{width:24px;height:24px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:0.75rem;flex-shrink:0}
.section textarea{width:100%;min-height:80px;padding:0.75rem;border:1px solid var(--line);border-radius:6px;font-size:0.88rem;font-family:inherit;line-height:1.7;resize:vertical}
.section textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(13,92,90,.1)}
/* 信息表格（介绍区） */
.info-table{display:grid;grid-template-columns:auto 1fr;gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:0.75rem}
.info-table>div{padding:0.4rem 0.75rem;font-size:0.82rem;border-bottom:1px solid var(--line)}
.info-table>div:nth-child(odd){background:#f8fafc;font-weight:600;color:var(--text);border-right:1px solid var(--line)}
.info-table>div:nth-child(even){color:var(--text)}
/* 文件上传区 */
.upload-zone{border:2px dashed var(--line);border-radius:8px;padding:1.5rem;text-align:center;color:var(--text);margin-bottom:0.75rem;transition:all .2s;cursor:pointer}
.upload-zone:hover,.upload-zone.dragover{border-color:var(--brand);background:rgba(13,92,90,.03)}
.upload-zone input{display:none}
.file-list{display:flex;flex-direction:column;gap:0.3rem;margin-bottom:0.75rem}
.file-item{display:flex;align-items:center;justify-content:space-between;padding:0.3rem 0.5rem;background:#f8fafc;border-radius:4px;font-size:0.78rem}
.file-item .remove{color:var(--red);cursor:pointer;font-size:0.7rem}
.actions{display:flex;gap:0.75rem;margin-top:1.5rem;justify-content:center;flex-wrap:wrap}
.btn{padding:0.6rem 1.5rem;border-radius:8px;font-size:0.9rem;cursor:pointer;border:none;font-weight:600;transition:all .15s}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{opacity:.9}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-outline{background:var(--card);color:var(--brand);border:1.5px solid var(--brand)}
.btn-outline:hover{background:var(--brand);color:#fff}
.btn-success{background:var(--green);color:#fff}
.btn-success:hover{opacity:.9}
.preview-toggle{margin:1rem 0 0.5rem;font-size:0.85rem;cursor:pointer;color:var(--brand);text-decoration:underline}
.preview-box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1.5rem;display:none;margin-top:0.5rem;overflow-x:auto;white-space:pre-wrap;font-size:0.82rem;line-height:1.6;max-height:400px;overflow-y:auto}
.preview-box.show{display:block}
.toast{position:fixed;top:1rem;right:1rem;background:var(--green);color:#fff;padding:0.75rem 1.25rem;border-radius:8px;font-size:0.85rem;z-index:999;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}
.toast.error{background:var(--red)}
.saving-overlay{position:fixed;inset:0;background:rgba(255,255,255,.7);z-index:998;display:none;align-items:center;justify-content:center;font-size:1.1rem;color:var(--brand);font-weight:600}
.saving-overlay.show{display:flex}
@media(max-width:768px){main{margin:1rem auto}.section{padding:1rem}.btn{padding:0.5rem 1rem}}
</style>
</head>
<body>
<header>
  <a href="/admin/index.html">← 返回列表</a>
  <h2 id="courseTitle">编辑课程</h2>
</header>
<main>
  <div class="meta" id="courseMeta"></div>

  <div id="editor">
    <div class="section">
      <h3><span class="num">①</span> 课程介绍</h3>
      <div class="info-table" id="infoTable">
        <div>课程名称</div><div id="tbl_name">-</div>
        <div>学分</div><div id="tbl_credits">-</div>
        <div>开设学期</div><div id="tbl_semester">-</div>
        <div>课程性质</div><div id="tbl_type">-</div>
      </div>
      <textarea id="sec_intro" placeholder="请填写课程简介、主要内容、先修要求等..."></textarea>
    </div>
    <div class="section">
      <h3><span class="num">②</span> 课程资料</h3>
      <div class="file-list" id="fileList"></div>
      <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
        📁 点击或拖拽上传文件（PDF/DOC/PPT/ZIP）
        <input type="file" id="fileInput" multiple accept=".pdf,.doc,.docx,.ppt,.pptx,.zip,.rar,.txt">
      </div>
      <textarea id="sec_materials" placeholder="在此补充资料说明、链接等信息..."></textarea>
    </div>
    <div class="section">
      <h3><span class="num">③</span> 练习题</h3>
      <textarea id="sec_exercises" placeholder="整理中。"></textarea>
    </div>
    <div class="section">
      <h3><span class="num">④</span> 推荐资源</h3>
      <textarea id="sec_resources" placeholder="待老师推荐。"></textarea>
    </div>
    <div class="section">
      <h3><span class="num">⑤</span> 优秀学长「ta 说」</h3>
      <textarea id="sec_tashuo" placeholder="招募中"></textarea>
    </div>
  </div>

  <div class="preview-toggle" onclick="togglePreview()">📄 预览 Markdown 源码</div>
  <div class="preview-box" id="previewBox"></div>

  <div class="actions">
    <button class="btn btn-primary" id="btnSave" onclick="saveToGitHub()">💾 保存并发布</button>
    <button class="btn btn-success" onclick="copyMd()">📋 复制到剪贴板</button>
    <button class="btn btn-outline" onclick="downloadMd()">📥 下载 .md</button>
    <button class="btn btn-outline" onclick="window.history.back()">取消</button>
  </div>
</main>

<div class="saving-overlay" id="savingOverlay">⏳ 正在保存到 GitHub...</div>
<div class="toast" id="toast"></div>

<script>
const API_URL = 'https://你的云函数地址.apigw.tencentcs.com/release/save-course';
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
const params=new URLSearchParams(location.search);
const coursePath=params.get('path')||'';
const courseName=params.get('name')||'';
const courseCredits=params.get('credits')||'';
const courseType=params.get('type')||'';
const courseMajor=params.get('major')||'';
const courseSemester=params.get('semester')||'';
let uploadedFiles=[];

document.getElementById('courseTitle').textContent='编辑：'+courseName;
const meta=document.getElementById('courseMeta');
meta.innerHTML='';
['📘 '+courseMajor,'📅 '+courseSemester,'🎓 '+courseCredits+'学分',courseType,coursePath].forEach(t=>{
  const s=document.createElement('span'); s.textContent=t; meta.appendChild(s);
});
if(coursePath) meta.lastChild.style='font-size:0.75rem;color:#94a3b8';

// 填充信息表格
document.getElementById('tbl_name').textContent=courseName;
document.getElementById('tbl_credits').textContent=courseCredits+' 学分';
document.getElementById('tbl_semester').textContent=courseSemester;
document.getElementById('tbl_type').textContent=courseType;

// ── 加载已有内容 ──
async function loadContent(){
  if(!coursePath) return;
  try{
    const res=await fetch('/'+coursePath+'.md');
    if(!res.ok) return;
    const text=await res.text();
    const sections={'intro':'','materials':'','exercises':'','resources':'','tashuo':''};
    const secNames={'① 课程介绍':'intro','② 课程资料':'materials','③ 练习题':'exercises','④ 推荐资源':'resources','⑤ 优秀学长「ta 说」':'tashuo'};
    const lines=text.split('\n');
    let currentSec=null;
    for(let i=0;i<lines.length;i++){
      for(const [key,val] of Object.entries(secNames)){
        if(lines[i].includes(key)){
          currentSec=val;
          i++;
          break;
        }
      }
      if(currentSec&&!lines[i].startsWith('##')&&!lines[i].startsWith('> 📩')&&!lines[i].startsWith('> 🔄')&&lines[i].trim()!=='---'){
        // 跳过①里的信息表格行
        if(currentSec==='intro'&&(lines[i].startsWith('|')||lines[i].startsWith('> 📦'))) continue;
        sections[currentSec]+=(sections[currentSec]?'\n':'')+lines[i];
      }
      if(lines[i].startsWith('##')&&currentSec){
        const nextSec=Object.keys(secNames).find(k=>lines[i].includes(k));
        if(nextSec) currentSec=null;
      }
    }
    for(const [sec,content] of Object.entries(sections)){
      const el=document.getElementById('sec_'+sec);
      const trimmed=content.trim();
      const isPlaceholder=!trimmed||trimmed.includes('正在整理中')||trimmed.includes('收集中')||trimmed.includes('整理中')||trimmed.includes('待老师推荐')||trimmed.includes('招募中');
      if(!isPlaceholder) el.value=trimmed;
    }
  }catch(e){}
}

// ── 生成 Markdown（含信息表格 + 学期标签） ──
function buildMd(){
  const semesterStyleMap={'大一上学期':'#eff6ff;color:#2563eb','大一下学期':'#eff6ff;color:#2563eb','大二上学期':'#f0fdf4;color:#059669','大二下学期':'#f0fdf4;color:#059669','大三上学期':'#fffbeb;color:#D97706','大三下学期':'#fffbeb;color:#D97706','大四上学期':'#fef2f2;color:#dc2626','大四下学期':'#fef2f2;color:#dc2626'};
  const style=semesterStyleMap[courseSemester]||'background:#f1f5f9;color:#64748b';
  const typeClass=courseType==='必修'?'badge-required':courseType==='专业方向课'?'badge-core':'badge-elective';

  let md=`# ${courseName}\n\n`;
  md+=`<span class="semester-badge" style="${style}">${courseSemester}</span>\n`;
  md+=`<span class="${typeClass} semester-badge">${courseType}</span>\n`;
  md+=`<span>**${courseCredits} 学分**</span>\n\n`;
  md+=`<a href="javascript:history.back()" class="back-link">← 返回</a>\n\n`;
  md+='---\n\n';

  // ① 课程介绍 — 含信息表格
  md+=`## ① 课程介绍\n\n`;
  md+=`| 项目 | 内容 |\n|------|------|\n`;
  md+=`| **课程名称** | ${courseName} |\n`;
  md+=`| **学分** | ${courseCredits} |\n`;
  md+=`| **开设学期** | ${courseSemester} |\n`;
  md+=`| **课程性质** | ${courseType} |\n\n`;
  const introVal=document.getElementById('sec_intro').value.trim();
  md+=introVal?`${introVal}\n\n`:'> 📦 该课程资料正在整理中，敬请期待！\n\n';

  // ② 课程资料
  md+=`## ② 课程资料\n\n`;
  const materialsVal=document.getElementById('sec_materials').value.trim();
  md+=materialsVal?`${materialsVal}\n\n`:'> 📄 资料收集中。\n\n';

  // ③ 练习题
  md+=`## ③ 练习题\n\n`;
  const exercisesVal=document.getElementById('sec_exercises').value.trim();
  md+=exercisesVal?`${exercisesVal}\n\n`:'> ✏️ 整理中。\n\n';

  // ④ 推荐资源
  md+=`## ④ 推荐资源\n\n`;
  const resourcesVal=document.getElementById('sec_resources').value.trim();
  md+=resourcesVal?`${resourcesVal}\n\n`:'> 🚧 待老师推荐。\n\n';

  // ⑤ ta 说
  md+=`## ⑤ 优秀学长「ta 说」\n\n`;
  const tashuoVal=document.getElementById('sec_tashuo').value.trim();
  if(tashuoVal){
    md+=tashuoVal+'\n\n';
  } else {
    md+=`<div class="ta-card" style="text-align:center;padding:32px;">\n`;
    md+=`  <p style="font-size:1.2rem;">🔎 招募中</p>\n`;
    md+=`  <p>如果你是学过《${courseName}》且成绩不错的同学，欢迎联系管理员。</p>\n`;
    md+=`  <p><a href="mailto:2286318767@qq.com">2286318767@qq.com</a></p>\n`;
    md+=`</div>\n\n`;
  }

  md+=`> 📩 联系管理员参与共建。\n\n`;
  md+=`> 🔄 本页内容同步自 [腾讯文档编辑后台](https://docs.qq.com/space/DZXBYSkhnRXRwSWpv)\n`;
  return md;
}

// ── 文件上传 ──
const fileInput=document.getElementById('fileInput');
const uploadZone=document.getElementById('uploadZone');
const fileList=document.getElementById('fileList');

uploadZone.addEventListener('dragover',e=>{e.preventDefault();uploadZone.classList.add('dragover')});
uploadZone.addEventListener('dragleave',()=>uploadZone.classList.remove('dragover'));
uploadZone.addEventListener('drop',e=>{
  e.preventDefault();uploadZone.classList.remove('dragover');
  handleFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change',()=>handleFiles(fileInput.files));

function handleFiles(files){
  for(const f of files){
    const reader=new FileReader();
    reader.onload=function(){
      uploadedFiles.push({name:f.name,data:reader.result.split(',')[1],type:f.type});
      renderFileList();
    };
    reader.readAsDataURL(f);
  }
}
function renderFileList(){
  fileList.innerHTML=uploadedFiles.map((f,i)=>`<div class="file-item"><span>📎 ${esc(f.name)}</span><span class="remove" onclick="removeFile(${i})">✕</span></div>`).join('');
}
function removeFile(i){uploadedFiles.splice(i,1);renderFileList();}

// ── 保存到 GitHub ──
async function saveToGitHub(){
  if(API_URL.includes('你的云函数地址')){
    toast('⚠️ 请先配置 API_URL（云函数地址）','error');
    return;
  }
  const btn=document.getElementById('btnSave');
  btn.disabled=true;
  document.getElementById('savingOverlay').classList.add('show');

  try{
    // 1. 保存 .md 文件
    const md=buildMd();
    const res=await fetch(API_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        path:coursePath+'.md',
        content:md,
        message:`✏️ 编辑 ${courseName}`
      })
    });
    if(!res.ok) throw new Error('Save failed: '+res.status);

    // 2. 上传附件
    for(const f of uploadedFiles){
      const filePath=`public/files/${coursePath.replace('majors/','').replace('/courses/','/')}/${f.name}`;
      await fetch(API_URL,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          path:filePath,
          file:{name:f.name,data:f.data,filePath}
        })
      });
    }

    uploadedFiles=[];
    renderFileList();
    toast('✅ 已保存！1-2分钟后站点自动更新');
  }catch(e){
    toast('❌ 保存失败: '+e.message,'error');
  }finally{
    btn.disabled=false;
    document.getElementById('savingOverlay').classList.remove('show');
  }
}

function downloadMd(){
  const md=buildMd();
  const blob=new Blob([md],{type:'text/markdown'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=(coursePath.split('/').pop()||courseName)+'.md';
  a.click();
  URL.revokeObjectURL(url);
  toast('✅ .md 文件已下载！');
}

async function copyMd(){
  const md=buildMd();
  await navigator.clipboard.writeText(md);
  toast('✅ 已复制到剪贴板！');
}

function togglePreview(){
  const box=document.getElementById('previewBox');
  box.classList.toggle('show');
  if(box.classList.contains('show')) box.textContent=buildMd();
}

function toast(msg,type){
  const el=document.getElementById('toast');
  el.textContent=msg;el.className='toast '+type+' show';
  setTimeout(()=>el.classList.remove('show'),2500);
}

loadContent();
</script>
</body>
</html>
