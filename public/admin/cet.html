<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>四六级考场管理 · 管理后台</title>
<style>
:root{--brand:#0D5C5A;--bg:#F7F5F0;--card:#fff;--line:#E8E4DB;--text:#4A5568;--green:#059669;--red:#dc2626;--amber:#D97706}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
header{background:var(--brand);color:#fff;padding:1rem 2rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
header h1{font-size:1.2rem;font-weight:600}
main{max-width:1080px;margin:0 auto;padding:2rem 1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1.25rem;margin-bottom:1.25rem}
.card h2{font-size:1rem;font-weight:600;color:var(--brand);margin-bottom:0.75rem}
input,select,textarea{font-family:inherit}
.field-input{width:100%;padding:0.55rem 0.7rem;border:1px solid var(--line);border-radius:8px;font-size:0.88rem;background:#fff;color:#1a1a1a}
.field-input:focus{outline:2px solid var(--brand);border-color:var(--brand)}
textarea.field-input{resize:vertical}
label.f{display:block;font-size:0.78rem;color:var(--text);margin:0.7rem 0 0.25rem}
.btn{display:inline-block;padding:0.5rem 1.1rem;border:none;border-radius:8px;font-size:0.85rem;cursor:pointer;background:var(--brand);color:#fff;transition:opacity .15s}
.btn:hover{opacity:.9}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-ghost{background:#fff;color:var(--brand);border:1px solid var(--brand)}
.btn-danger{background:#fff;color:var(--red);border:1px solid var(--red)}
.btn-sm{padding:0.25rem 0.6rem;font-size:0.76rem}
.tabs{display:flex;gap:8px;margin-bottom:1rem}
.tab{padding:0.5rem 1.2rem;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:0.88rem}
.tab.on{border-color:var(--brand);color:var(--brand);background:#E8F4F0;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:0.82rem}
th,td{padding:0.5rem 0.6rem;border-bottom:1px solid #f0ede6;text-align:left;vertical-align:top}
th{color:#1a1a1a;font-weight:600;background:#faf9f6}
.badge{display:inline-block;padding:0.05rem 0.5rem;border-radius:999px;font-size:0.7rem}
.b-on{background:#E6F7EF;color:var(--green)}
.b-off{background:#F1EFE9;color:#8a8578}
.b-cet4{background:#E8F4F0;color:var(--brand)}
.b-cet6{background:#FEF3E2;color:var(--amber)}
.row{display:flex;gap:0.8rem;flex-wrap:wrap}
.row>.col{flex:1;min-width:180px}
.muted{font-size:0.78rem;color:#8a8578}
.mono{font-family:Consolas,monospace;font-size:0.78rem}
.paper-sec{border:1px solid var(--line);border-radius:10px;padding:0.9rem;margin-top:0.8rem}
.paper-sec h3{font-size:0.85rem;color:var(--brand);margin-bottom:0.5rem}
.qpick{max-height:220px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:0.5rem}
.qpick label{display:flex;gap:0.4rem;font-size:0.8rem;padding:0.2rem 0;cursor:pointer}
.toast{position:fixed;top:70px;right:20px;background:#0D5C5A;color:#fff;padding:0.6rem 1rem;border-radius:8px;font-size:0.85rem;display:none;z-index:99}
.qfilter{display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:0.8rem}
.qfilter select{width:auto}
</style>
</head>
<body>
<header>
  <h1>四六级考场管理</h1>
  <span class="who" id="who"></span>
</header>
<main>
  <div class="tabs">
    <button class="tab on" data-tab="q">题库录入</button>
    <button class="tab" data-tab="p">试卷组合</button>
    <button class="tab" data-tab="c">考场配置</button>
  </div>

  <!-- ═══ 题库 ═══ -->
  <section id="tab-q" class="card">
    <h2>题目列表 <span class="muted" id="q-count"></span></h2>
    <div class="qfilter">
      <select id="f-exam" class="field-input"><option value="">全部考试</option><option value="cet4">四级</option><option value="cet6">六级</option></select>
      <select id="f-type" class="field-input"><option value="">全部题型</option><option value="listening">听力</option><option value="reading">阅读</option><option value="writing">写作</option><option value="translation">翻译</option></select>
      <select id="f-status" class="field-input"><option value="">全部状态</option><option value="on">已上架</option><option value="off">已下架</option></select>
      <button class="btn" id="q-new">＋ 新增题目</button>
    </div>
    <table>
      <thead><tr><th style="width:90px">ID</th><th>考试/题型</th><th>题干</th><th style="width:60px">分值</th><th style="width:70px">状态</th><th style="width:120px">操作</th></tr></thead>
      <tbody id="q-list"></tbody>
    </table>
  </section>

  <!-- ═══ 试卷 ═══ -->
  <section id="tab-p" class="card" style="display:none">
    <h2>试卷列表 <span class="muted" id="p-count"></span></h2>
    <button class="btn" id="p-new" style="margin-bottom:0.8rem">＋ 新增试卷</button>
    <table>
      <thead><tr><th>ID</th><th>名称</th><th>考试</th><th>分区(时长)</th><th>题数</th><th>状态</th><th style="width:170px">操作</th></tr></thead>
      <tbody id="p-list"></tbody>
    </table>
  </section>

  <!-- ═══ 配置 ═══ -->
  <section id="tab-c" class="card" style="display:none">
    <h2>考场配置</h2>
    <label class="f"><input type="checkbox" id="cfg-enabled" /> 开放考生端（关闭后考生大厅显示「暂未开放」）</label>
    <label class="f">公告（显示在考生大厅顶部，300 字内）</label>
    <textarea id="cfg-announce" class="field-input" rows="3" placeholder="例如：本周六 19:00 举行四级全真模考"></textarea>
    <div style="margin-top:1rem"><button class="btn" id="cfg-save">保存配置</button></div>
  </section>
</main>

<!-- 题目编辑弹层 -->
<div id="q-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.35);z-index:50;overflow-y:auto">
  <div class="card" style="max-width:720px;margin:40px auto">
    <h2 id="q-modal-t">新增题目</h2>
    <input type="hidden" id="q-id" />
    <div class="row">
      <div class="col"><label class="f">所属考试</label>
        <select id="q-exam" class="field-input"><option value="cet4">四级</option><option value="cet6">六级</option></select></div>
      <div class="col"><label class="f">题型</label>
        <select id="q-type" class="field-input"><option value="listening">听力</option><option value="reading">阅读</option><option value="writing">写作</option><option value="translation">翻译</option></select></div>
      <div class="col"><label class="f">难度（1-3）</label>
        <select id="q-diff" class="field-input"><option value="1">1 易</option><option value="2" selected>2 中</option><option value="3">3 难</option></select></div>
      <div class="col"><label class="f">分值</label><input id="q-score" type="number" class="field-input" value="10" min="1" max="100" /></div>
    </div>
    <label class="f">题号 ID（唯一，如 L4-001；留空自动生成）</label>
    <input id="q-code" class="field-input mono" placeholder="L4-001" />
    <label class="f">题干 / 听力原文 / 作文题目</label>
    <textarea id="q-stem" class="field-input" rows="4"></textarea>
    <label class="f">选项（客观题必填，每行一个；主观题留空）</label>
    <textarea id="q-options" class="field-input" rows="4" placeholder="A 选项内容&#10;B 选项内容&#10;C 选项内容&#10;D 选项内容"></textarea>
    <label class="f">正确答案（客观题填字母如 A；主观题填参考范文/参考译文）</label>
    <textarea id="q-answer" class="field-input" rows="3"></textarea>
    <label class="f">解析</label>
    <textarea id="q-analysis" class="field-input" rows="3"></textarea>
    <label class="f">易错点</label>
    <input id="q-traps" class="field-input" />
    <label class="f">听力材料 URL（音频地址，仅听力题）</label>
    <input id="q-audio" class="field-input mono" placeholder="https://…/listening1.mp3" />
    <label class="f"><input type="checkbox" id="q-status" checked /> 上架（考生可见）</label>
    <div style="display:flex;gap:0.6rem;margin-top:1rem;justify-content:flex-end">
      <button class="btn btn-ghost" id="q-cancel">取消</button>
      <button class="btn" id="q-save">保存题目</button>
    </div>
  </div>
</div>

<!-- 试卷编辑弹层 -->
<div id="p-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.35);z-index:50;overflow-y:auto">
  <div class="card" style="max-width:820px;margin:40px auto">
    <h2 id="p-modal-t">新增试卷</h2>
    <input type="hidden" id="p-id-old" />
    <div class="row">
      <div class="col"><label class="f">试卷 ID（唯一，如 cet4-full-01）</label><input id="p-id" class="field-input mono" /></div>
      <div class="col"><label class="f">试卷名称</label><input id="p-name" class="field-input" placeholder="四级全真模拟卷（一）" /></div>
      <div class="col"><label class="f">所属考试</label>
        <select id="p-exam" class="field-input"><option value="cet4">四级</option><option value="cet6">六级</option></select></div>
    </div>
    <div id="p-sections"></div>
    <button class="btn btn-ghost btn-sm" id="p-addsec" style="margin-top:0.8rem">＋ 添加分区</button>
    <div style="margin-top:1rem"><button class="btn" id="p-save">保存试卷（总时长须等于各分区之和）</button>
      <span class="muted" id="p-sum" style="margin-left:0.8rem"></span></div>
    <div style="margin-top:0.6rem"><button class="btn btn-ghost" id="p-cancel">取消</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="/admin/auth-check.js"></script>
<script src="/admin/admin-nav.js"></script>
<script>
var API = '/api/cet';
var EXAMS = { cet4: '四级', cet6: '六级' };
var TYPES = { listening: '听力', reading: '阅读', writing: '写作', translation: '翻译' };
var bank = { config: { enabled: true, announce: '' }, questions: [], papers: [] };

function post(action, payload) {
  return fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(Object.assign({ action: action, token: window.ADMIN.token }, payload)) })
    .then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d.error || 'HTTP ' + r.status); return d; }); });
}
function toast(msg, isErr) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.style.background = isErr ? '#dc2626' : '#0D5C5A'; t.style.display = 'block';
  setTimeout(function () { t.style.display = 'none'; }, 2200);
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

// ── Tabs ──
document.querySelectorAll('.tab').forEach(function (tb) {
  tb.onclick = function () {
    document.querySelectorAll('.tab').forEach(function (x) { x.classList.remove('on'); });
    tb.classList.add('on');
    ['q', 'p', 'c'].forEach(function (k) { document.getElementById('tab-' + k).style.display = k === tb.dataset.tab ? '' : 'none'; });
  };
});

// ── 载入 ──
function load() {
  return post('get').then(function (d) {
    bank.config = d.config || { enabled: true, announce: '' };
    bank.questions = d.questions || [];
    bank.papers = d.papers || [];
    renderQ(); renderP(); renderCfg();
  }).catch(function (e) { toast(e.message, true); });
}

// ── 题库 ──
function renderQ() {
  var fe = document.getElementById('f-exam').value, ft = document.getElementById('f-type').value, fs = document.getElementById('f-status').value;
  var list = bank.questions.filter(function (q) {
    return (!fe || q.exam === fe) && (!ft || q.type === ft) && (!fs || q.status === fs);
  });
  document.getElementById('q-count').textContent = '共 ' + list.length + ' 题（库内总 ' + bank.questions.length + '）';
  document.getElementById('q-list').innerHTML = list.map(function (q) {
    return '<tr><td class="mono">' + esc(q.id) + '</td>' +
      '<td><span class="badge b-' + q.exam + '">' + EXAMS[q.exam] + '</span> ' + TYPES[q.type] + '<br><span class="muted">难度' + q.difficulty + ' · ' + (q.options && q.options.length ? '客观' : '主观') + '</span></td>' +
      '<td>' + esc(String(q.stem).slice(0, 60)) + (String(q.stem).length > 60 ? '…' : '') + '</td>' +
      '<td>' + q.score + '</td>' +
      '<td><span class="badge b-' + q.status + '">' + (q.status === 'on' ? '上架' : '下架') + '</span></td>' +
      '<td><button class="btn btn-ghost btn-sm" onclick="editQ(\'' + esc(q.id) + '\')">编辑</button> ' +
      '<button class="btn btn-sm" style="background:' + (q.status === 'on' ? '#D97706' : '#059669') + '" onclick="toggleQ(\'' + esc(q.id) + '\')">' + (q.status === 'on' ? '下架' : '上架') + '</button> ' +
      '<button class="btn btn-danger btn-sm" onclick="delQ(\'' + esc(q.id) + '\')">删</button></td></tr>';
  }).join('') || '<tr><td colspan="6" class="muted">暂无题目</td></tr>';
}
['f-exam', 'f-type', 'f-status'].forEach(function (id) { document.getElementById(id).onchange = renderQ; });

function openQModal(q) {
  document.getElementById('q-modal-t').textContent = q ? '编辑题目' : '新增题目';
  document.getElementById('q-id').value = q ? q.id : '';
  document.getElementById('q-code').value = q ? q.id : '';
  document.getElementById('q-code').disabled = !!q;
  document.getElementById('q-exam').value = q ? q.exam : 'cet4';
  document.getElementById('q-type').value = q ? q.type : 'listening';
  document.getElementById('q-diff').value = q ? String(q.difficulty) : '2';
  document.getElementById('q-score').value = q ? q.score : 10;
  document.getElementById('q-stem').value = q ? q.stem : '';
  document.getElementById('q-options').value = q && q.options ? q.options.join('\n') : '';
  document.getElementById('q-answer').value = q ? q.answer : '';
  document.getElementById('q-analysis').value = q ? (q.analysis || '') : '';
  document.getElementById('q-traps').value = q ? (q.traps || '') : '';
  document.getElementById('q-audio').value = q ? (q.audio || '') : '';
  document.getElementById('q-status').checked = q ? q.status !== 'off' : true;
  document.getElementById('q-modal').style.display = '';
}
function closeQModal() { document.getElementById('q-modal').style.display = 'none'; }
document.getElementById('q-new').onclick = function () { openQModal(null); };
document.getElementById('q-cancel').onclick = closeQModal;

document.getElementById('q-save').onclick = function () {
  var oldId = document.getElementById('q-id').value;
  var id = document.getElementById('q-code').value.trim();
  if (!id) { id = document.getElementById('q-type').value.slice(0, 1).toUpperCase() + (document.getElementById('q-exam').value === 'cet4' ? 4 : 6) + '-' + Date.now().toString(36); }
  var opts = document.getElementById('q-options').value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
  var question = {
    id: id, exam: document.getElementById('q-exam').value, type: document.getElementById('q-type').value,
    difficulty: Number(document.getElementById('q-diff').value), score: Number(document.getElementById('q-score').value),
    stem: document.getElementById('q-stem').value.trim(), options: opts,
    answer: document.getElementById('q-answer').value.trim(),
    analysis: document.getElementById('q-analysis').value.trim(),
    traps: document.getElementById('q-traps').value.trim(),
    audio: document.getElementById('q-audio').value.trim(),
    status: document.getElementById('q-status').checked ? 'on' : 'off',
  };
  if (oldId && oldId !== id) { toast('题号不可修改', true); return; }
  post('saveQuestion', { question: question }).then(function () { toast('已保存'); closeQModal(); return load(); })
    .catch(function (e) { toast(e.message, true); });
};
function editQ(id) { var q = bank.questions.find(function (x) { return x.id === id; }); if (q) openQModal(q); }
function toggleQ(id) {
  var q = bank.questions.find(function (x) { return x.id === id; }); if (!q) return;
  q.status = q.status === 'on' ? 'off' : 'on';
  post('saveQuestion', { question: q }).then(function () { toast('已切换'); return load(); }).catch(function (e) { toast(e.message, true); });
}
function delQ(id) {
  if (!confirm('删除题目 ' + id + '？试卷中的引用会同步移除')) return;
  post('deleteQuestion', { id: id }).then(function () { toast('已删除'); return load(); }).catch(function (e) { toast(e.message, true); });
}

// ── 试卷 ──
function renderP() {
  document.getElementById('p-count').textContent = '共 ' + bank.papers.length + ' 套';
  document.getElementById('p-list').innerHTML = bank.papers.map(function (p) {
    var secs = p.sections.map(function (s) { return TYPES[s.type] + ' ' + Math.round(s.durationSec / 60) + 'min'; }).join(' + ');
    return '<tr><td class="mono">' + esc(p.id) + '</td><td>' + esc(p.name) + '</td>' +
      '<td>' + EXAMS[p.exam] + '</td><td>' + secs + '</td><td>' + p.questionIds.length + '</td>' +
      '<td><span class="badge b-' + p.status + '">' + (p.status === 'on' ? '上架' : '下架') + '</span></td>' +
      '<td><button class="btn btn-ghost btn-sm" onclick="editP(\'' + esc(p.id) + '\')">编辑</button> ' +
      '<button class="btn btn-sm" style="background:' + (p.status === 'on' ? '#D97706' : '#059669') + '" onclick="toggleP(\'' + esc(p.id) + '\')">' + (p.status === 'on' ? '下架' : '上架') + '</button> ' +
      '<button class="btn btn-danger btn-sm" onclick="delP(\'' + esc(p.id) + '\')">删</button></td></tr>';
  }).join('') || '<tr><td colspan="7" class="muted">暂无试卷</td></tr>';
}

function secEditor(sec, idx) {
  var div = document.createElement('div');
  div.className = 'paper-sec';
  var opts = bank.questions.filter(function (q) { return q.type === sec.type; })
    .map(function (q) {
      var on = sec.qids.indexOf(q.id) >= 0;
      return '<label><input type="checkbox" data-qid="' + esc(q.id) + '"' + (on ? ' checked' : '') + '> ' +
        '<span class="mono">' + esc(q.id) + '</span> ' + esc(String(q.stem).slice(0, 40)) + ' <span class="muted">(' + q.score + '分/' + (q.status === 'on' ? '上架' : '下架') + ')</span></label>';
    }).join('');
  div.innerHTML = '<h3>分区 ' + (idx + 1) + '：' + TYPES[sec.type] + '</h3><div class="row">' +
    '<div class="col"><label class="f">题型</label><select class="field-input s-type">' +
    Object.keys(TYPES).map(function (t) { return '<option value="' + t + '"' + (t === sec.type ? ' selected' : '') + '>' + TYPES[t] + '</option>'; }).join('') +
    '</select></div>' +
    '<div class="col"><label class="f">时长（分钟，0=不限）</label><input type="number" class="field-input s-min" min="0" value="' + Math.round(sec.durationSec / 60) + '" /></div>' +
    '<div class="col" style="flex:0"><label class="f">&nbsp;</label><button class="btn btn-danger btn-sm s-del">删分区</button></div></div>' +
    '<label class="f">题目（勾选加入，可多选）</label><div class="qpick">' + (opts || '<span class="muted">该题型暂无题目</span>') + '</div>';
  div.querySelector('.s-del').onclick = function () { div.remove(); updateSum(); };
  div.querySelector('.s-type').onchange = function () { sec.type = this.value; rebuildPick(div, sec); updateSum(); };
  div.querySelector('.s-min').oninput = updateSum;
  return div;
}
function rebuildPick(div, sec) {
  sec.qids = [];
  var opts = bank.questions.filter(function (q) { return q.type === sec.type; })
    .map(function (q) {
      return '<label><input type="checkbox" data-qid="' + esc(q.id) + '"> ' +
        '<span class="mono">' + esc(q.id) + '</span> ' + esc(String(q.stem).slice(0, 40)) + ' <span class="muted">(' + q.score + '分)</span></label>';
    }).join('');
  div.querySelector('.qpick').innerHTML = opts || '<span class="muted">该题型暂无题目</span>';
}
function collectSecs() {
  var secs = [];
  document.querySelectorAll('#p-sections .paper-sec').forEach(function (div) {
    var type = div.querySelector('.s-type').value;
    var min = Number(div.querySelector('.s-min').value) || 0;
    var qids = Array.prototype.map.call(div.querySelectorAll('input[data-qid]:checked'), function (c) { return c.dataset.qid; });
    secs.push({ type: type, name: TYPES[type], durationSec: min * 60, qids: qids });
  });
  return secs;
}
function updateSum() {
  var secs = collectSecs();
  var total = secs.reduce(function (s, x) { return s + x.durationSec; }, 0);
  document.getElementById('p-sum').textContent = '当前总时长 ' + Math.round(total / 60) + ' 分钟';
  return total;
}
function openPModal(p) {
  document.getElementById('p-modal-t').textContent = p ? '编辑试卷' : '新增试卷';
  document.getElementById('p-id-old').value = p ? p.id : '';
  document.getElementById('p-id').value = p ? p.id : '';
  document.getElementById('p-id').disabled = !!p;
  document.getElementById('p-name').value = p ? p.name : '';
  document.getElementById('p-exam').value = p ? p.exam : 'cet4';
  var box = document.getElementById('p-sections'); box.innerHTML = '';
  (p ? p.sections : [{ type: 'writing', name: '写作', durationSec: 1800, qids: [] }]).forEach(function (s) {
    box.appendChild(secEditor(JSON.parse(JSON.stringify(s)), box.children.length));
  });
  updateSum();
  document.getElementById('p-modal').style.display = '';
}
function closePModal() { document.getElementById('p-modal').style.display = 'none'; }
document.getElementById('p-new').onclick = function () { openPModal(null); };
document.getElementById('p-cancel').onclick = closePModal;
document.getElementById('p-addsec').onclick = function () {
  var box = document.getElementById('p-sections');
  box.appendChild(secEditor({ type: 'listening', name: '听力', durationSec: 1500, qids: [] }, box.children.length));
  updateSum();
};
document.getElementById('p-save').onclick = function () {
  var secs = collectSecs();
  var qids = [];
  secs.forEach(function (s) { s.qids.forEach(function (id) { qids.push(id); }); });
  var paper = {
    id: document.getElementById('p-id').value.trim(),
    name: document.getElementById('p-name').value.trim(),
    exam: document.getElementById('p-exam').value,
    kind: 'full',
    sections: secs,
    questionIds: qids,
    durationSec: secs.reduce(function (s, x) { return s + x.durationSec; }, 0),
    status: (bank.papers.find(function (x) { return x.id === document.getElementById('p-id').value.trim(); }) || {}).status || 'off',
  };
  post('savePaper', { paper: paper }).then(function () { toast('已保存'); closePModal(); return load(); })
    .catch(function (e) { toast(e.message, true); });
};
function editP(id) { var p = bank.papers.find(function (x) { return x.id === id; }); if (p) openPModal(p); }
function toggleP(id) {
  var p = bank.papers.find(function (x) { return x.id === id; }); if (!p) return;
  p.status = p.status === 'on' ? 'off' : 'on';
  post('savePaper', { paper: p }).then(function () { toast('已切换'); return load(); }).catch(function (e) { toast(e.message, true); });
}
function delP(id) {
  if (!confirm('删除试卷 ' + id + '？')) return;
  post('deletePaper', { id: id }).then(function () { toast('已删除'); return load(); }).catch(function (e) { toast(e.message, true); });
}

// ── 配置 ──
function renderCfg() {
  document.getElementById('cfg-enabled').checked = !!bank.config.enabled;
  document.getElementById('cfg-announce').value = bank.config.announce || '';
}
document.getElementById('cfg-save').onclick = function () {
  post('saveConfig', { config: { enabled: document.getElementById('cfg-enabled').checked, announce: document.getElementById('cfg-announce').value.trim() } })
    .then(function () { toast('已保存'); return load(); }).catch(function (e) { toast(e.message, true); });
};

load();
</script>
</body>
</html>
