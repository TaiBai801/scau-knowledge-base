<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>题库录入 · 管理后台</title>
<style>
:root{--brand:#0D5C5A;--bg:#F7F5F0;--card:#fff;--line:#E8E4DB;--text:#4A5568;--green:#059669;--red:#dc2626;--amber:#D97706}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
header{background:var(--brand);color:#fff;padding:1rem 2rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
header h1{font-size:1.2rem;font-weight:600}
header a{color:#b2d9d6;font-size:0.85rem;text-decoration:none}
header a:hover{color:#fff}
main{max-width:980px;margin:0 auto;padding:2rem 1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1.25rem;margin-bottom:1.25rem}
.card h2{font-size:1rem;font-weight:600;color:var(--brand);margin-bottom:0.75rem}
input,select,textarea{font-family:inherit}
.field-input{width:100%;padding:0.6rem 0.75rem;border:1px solid var(--line);border-radius:8px;font-size:0.9rem;background:#fff;color:#1a1a1a}
.field-input:focus{outline:2px solid var(--brand);border-color:var(--brand)}
textarea.field-input{resize:vertical}
.btn{display:inline-block;padding:0.5rem 1.1rem;border:none;border-radius:8px;font-size:0.85rem;cursor:pointer;background:var(--brand);color:#fff;transition:opacity .15s}
.btn:hover{opacity:.9}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-ghost{background:#fff;color:var(--brand);border:1px solid var(--brand)}
.btn-danger{background:#fff;color:var(--red);border:1px solid var(--red)}
.btn-sm{padding:0.3rem 0.7rem;font-size:0.78rem}
.search-results{max-height:260px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;margin-top:0.4rem}
.search-results .item{padding:0.5rem 0.75rem;cursor:pointer;font-size:0.85rem;border-bottom:1px solid #f0ede6}
.search-results .item:hover{background:#f0faf8}
.search-results .item .code{color:#94a3b8;font-size:0.72rem;margin-left:0.4rem}
.selected-course{display:flex;align-items:center;gap:0.6rem;padding:0.6rem 0.75rem;background:#f0faf8;border:1px solid #9fe1cb;border-radius:8px;margin-top:0.5rem;font-size:0.9rem}
.selected-course .code{color:var(--brand);font-weight:600}
.toolbar{display:flex;align-items:center;gap:0.6rem;flex-wrap:wrap;margin-bottom:0.9rem}
.q-count{font-size:0.85rem;color:#94a3b8;margin-left:auto}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:10px;overflow:hidden}
th{background:var(--brand);color:#fff;padding:0.55rem 0.7rem;font-size:0.8rem;text-align:left}
td{padding:0.5rem 0.7rem;font-size:0.83rem;border-bottom:1px solid var(--line);vertical-align:top}
tr:hover{background:#f0faf8}
.badge{display:inline-block;padding:0.12rem 0.5rem;border-radius:10px;font-size:0.7rem;font-weight:500;white-space:nowrap}
.badge-type{background:#eff6ff;color:#2563eb}
.badge-d1{background:#f0fdf4;color:var(--green)}
.badge-d2{background:#fffbeb;color:var(--amber)}
.badge-d3{background:#fef2f2;color:var(--red)}
.stem-cell{max-width:340px}
.stem-cell .stem-text{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:0.8rem;color:#333}
/* modal */
.mask{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:99;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:2rem 1rem}
.mask.show{display:flex}
.modal{background:var(--card);border-radius:14px;width:100%;max-width:720px;padding:1.5rem;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.modal h2{font-size:1.05rem;color:var(--brand);margin-bottom:1rem}
.form-row{display:grid;grid-template-columns:repeat(3,1fr);gap:0.75rem;margin-bottom:0.75rem}
.form-field label{display:block;font-size:0.78rem;color:#64748b;margin-bottom:0.3rem}
.opt-row{display:flex;align-items:center;gap:0.5rem;margin-bottom:0.5rem}
.opt-row .opt-letter{width:22px;font-weight:600;color:var(--brand);text-align:center}
.opt-row .field-input{flex:1}
.opt-row .opt-del{background:none;border:none;color:var(--red);cursor:pointer;font-size:1rem}
.hint{font-size:0.75rem;color:#94a3b8;margin-top:0.3rem}
.modal-actions{display:flex;gap:0.6rem;margin-top:1rem;justify-content:flex-end}
.msg{font-size:0.85rem;color:var(--green)}
.msg.err{color:var(--red)}
@media(max-width:640px){.form-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<script>
(function(){ if (sessionStorage.getItem('admin_authed')==='1') return;
  var pw=prompt('请输入管理密码');
  if(pw!=='123456#'){alert('密码错误');location.href='/';return;}
  sessionStorage.setItem('admin_authed','1');
})();
</script>
<header>
  <h1>🧩 题库录入后台</h1>
  <a href="/">← 回站点</a>
  <a href="/admin/index.html">课程管理</a>
  <a href="/admin/upload.html">资料上传</a>
  <a href="/admin/content.html">内容编辑</a>
</header>
<main>

  <div class="card">
    <h2>选择课程</h2>
    <input type="text" id="courseSearch" placeholder="输入课程名搜索，如「C语言」" autocomplete="off" class="field-input">
    <div class="search-results" id="searchResults" style="display:none"></div>
    <div class="selected-course" id="selectedCourse" style="display:none"></div>
  </div>

  <div id="editor" style="display:none">
    <div class="card">
      <div class="toolbar">
        <button class="btn" id="addBtn">＋ 新增题目</button>
        <button class="btn btn-ghost" id="importBtn">📥 批量导入</button>
        <span class="q-count" id="qCount"></span>
      </div>
      <div style="overflow-x:auto">
        <table id="qTable"><thead><tr>
          <th>ID</th><th>题型</th><th>难度</th><th>知识点</th><th>题干</th><th>操作</th>
        </tr></thead><tbody></tbody></table>
      </div>
    </div>
  </div>

</main>

<!-- 题目编辑弹窗 -->
<div class="mask" id="editMask">
  <div class="modal">
    <h2 id="editTitle">新增题目</h2>
    <div class="form-row">
      <div class="form-field"><label>题型</label>
        <select id="fType" class="field-input">
          <option value="single">单选题</option>
          <option value="multi">多选题</option>
          <option value="judge">判断题</option>
          <option value="blank">填空题</option>
          <option value="calc">程序阅读/计算</option>
          <option value="short">简答题</option>
        </select>
      </div>
      <div class="form-field"><label>难度</label>
        <select id="fDiff" class="field-input">
          <option value="1">简单</option>
          <option value="2" selected>中等</option>
          <option value="3">困难</option>
        </select>
      </div>
      <div class="form-field"><label>知识点</label>
        <input id="fKnowledge" class="field-input" list="knowledgeList" placeholder="如 指针">
      </div>
    </div>

    <div class="form-field" style="margin-bottom:0.75rem"><label>题干</label>
      <textarea id="fStem" class="field-input" rows="2" placeholder="题目内容"></textarea>
    </div>

    <div id="optArea" style="display:none">
      <label style="font-size:0.78rem;color:#64748b">选项（留空则忽略）</label>
      <div id="optList"></div>
      <button class="btn btn-ghost btn-sm" id="addOptBtn" type="button">＋ 添加选项</button>
    </div>

    <div class="form-field" style="margin:0.75rem 0"><label>答案</label>
      <div id="answerArea"></div>
    </div>

    <div class="form-field"><label>解析</label>
      <textarea id="fAnalysis" class="field-input" rows="2" placeholder="答案解析（可留空）"></textarea>
    </div>

    <div class="modal-actions">
      <span class="msg" id="editMsg"></span>
      <button class="btn btn-ghost" id="cancelBtn">取消</button>
      <button class="btn" id="saveBtn">保存</button>
    </div>
  </div>
</div>

<!-- 批量导入弹窗 -->
<div class="mask" id="importMask">
  <div class="modal">
    <h2>批量导入题目（JSON）</h2>
    <div class="form-field"><label>粘贴题目 JSON 数组（每项含 id/type/difficulty/knowledge/stem/options/answer/analysis）</label>
      <textarea id="importText" class="field-input" rows="10" placeholder='[{"id":"c-100","type":"single","difficulty":2,"knowledge":"指针","stem":"...","options":["A. ...","B. ..."],"answer":"A","analysis":"..."}]'></textarea>
    </div>
    <div class="form-field">
      <label><input type="radio" name="importMode" value="append" checked> 追加到现有题库</label>
      <label style="margin-left:1rem"><input type="radio" name="importMode" value="replace"> 覆盖全部题库</label>
    </div>
    <div class="hint">导入会经过字段校验；id 重复时追加模式会覆盖同名 id。</div>
    <div class="modal-actions">
      <span class="msg" id="importMsg"></span>
      <button class="btn btn-ghost" id="importCancel">取消</button>
      <button class="btn" id="importDo">导入</button>
    </div>
  </div>
</div>

<datalist id="knowledgeList"></datalist>

<script>
var API = '/api/bank';
var courses = [];
var selectedKey = null;
var selectedCode = null;
var questions = [];
var editingId = null;

function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function normName(s){
  var romans={'Ⅰ':'I','Ⅱ':'II','Ⅲ':'III','Ⅳ':'IV','Ⅴ':'V','Ⅵ':'VI','Ⅶ':'VII','Ⅷ':'VIII','Ⅸ':'IX','Ⅹ':'X'};
  s=String(s);
  for(var r in romans) s=s.split(r).join(romans[r]);
  return s.replace(/\s+/g,'').replace(/\u3000/g,'');
}
var TYPE_LABEL={single:'单选',multi:'多选',judge:'判断',blank:'填空',calc:'计算',short:'简答'};

fetch('/data/courses.json').then(function(r){return r.json();}).then(function(list){
  courses=list;
  var params=new URLSearchParams(location.search);
  var code=params.get('code');
  if(code) selectCourse(code);
});

document.getElementById('courseSearch').addEventListener('input',function(){
  var kw=this.value.trim().toLowerCase();
  var box=document.getElementById('searchResults');
  if(!kw){box.style.display='none';box.innerHTML='';return;}
  var matched=courses.filter(function(c){return c.name.toLowerCase().indexOf(kw)>=0;}).slice(0,30);
  box.innerHTML=matched.map(function(c){
    return '<div class="item" data-code="'+c.code+'">'+esc(c.name)+'<span class="code">'+c.code+'</span></div>';
  }).join('');
  box.style.display=matched.length?'block':'none';
  box.querySelectorAll('.item').forEach(function(it){
    it.addEventListener('click',function(){
      selectCourse(it.dataset.code);
      box.style.display='none';
      document.getElementById('courseSearch').value='';
    });
  });
});

function selectCourse(code){
  selectedCode=code;
  var c=courses.find(function(x){return x.code===code;});
  selectedKey=c?normName(c.name):null;
  var el=document.getElementById('selectedCourse');
  el.style.display='flex';
  el.innerHTML='<span>'+esc(c?c.name:'')+'</span><span class="code">'+code+'</span>'+
    '<button class="btn btn-sm btn-ghost" id="clearCourse" style="margin-left:auto">✕ 取消</button>';
  document.getElementById('clearCourse').addEventListener('click',function(){
    selectedKey=null;selectedCode=null;
    el.style.display='none';el.innerHTML='';
    document.getElementById('editor').style.display='none';
  });
  document.getElementById('editor').style.display='block';
  loadBank();
}

function post(action,payload){
  return fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({action:action},payload))})
    .then(function(r){return r.json();})
    .catch(function(e){return {error:'请求失败：'+e.message};});
}

function loadBank(){
  post('getBank',{courseKey:selectedKey,code:selectedCode}).then(function(d){
    if(d.error){alert(d.error);return;}
    questions=(d.entry&&d.entry.questions)||[];
    renderTable();
    renderKnowledgeList();
  });
}

function renderTable(){
  document.getElementById('qCount').textContent='共 '+questions.length+' 题';
  var tbody=document.querySelector('#qTable tbody');
  tbody.innerHTML='';
  questions.forEach(function(q){
    var tr=document.createElement('tr');
    var diffCls='badge-d'+(q.difficulty||2);
    tr.innerHTML='<td style="white-space:nowrap">'+esc(q.id)+'</td>'+
      '<td><span class="badge badge-type">'+TYPE_LABEL[q.type]+'</span></td>'+
      '<td><span class="badge '+diffCls+'">'+(q.difficulty||2)+'</span></td>'+
      '<td style="white-space:nowrap">'+esc(q.knowledge||'-')+'</td>'+
      '<td class="stem-cell"><div class="stem-text">'+esc(q.stem||'')+'</div></td>'+
      '<td style="white-space:nowrap"><button class="btn btn-ghost btn-sm" data-edit="'+esc(q.id)+'">编辑</button> '+
      '<button class="btn btn-danger btn-sm" data-del="'+esc(q.id)+'">删除</button></td>';
    tbody.appendChild(tr);
  });
  tbody.querySelectorAll('[data-edit]').forEach(function(b){
    b.addEventListener('click',function(){openEdit(b.dataset.edit);});
  });
  tbody.querySelectorAll('[data-del]').forEach(function(b){
    b.addEventListener('click',function(){
      if(!confirm('确认删除题目 '+b.dataset.del+' ？'))return;
      post('deleteQuestion',{courseKey:selectedKey,id:b.dataset.del}).then(function(d){
        if(d.error){alert(d.error);return;}
        loadBank();
      });
    });
  });
}

function renderKnowledgeList(){
  var set={};
  questions.forEach(function(q){if(q.knowledge)set[q.knowledge]=1;});
  document.getElementById('knowledgeList').innerHTML=Object.keys(set).map(function(k){return '<option value="'+esc(k)+'">';}).join('');
}

// ============ 题目表单 ============
var optCount=0;
function openEdit(id){
  editingId=id||null;
  document.getElementById('editTitle').textContent=id?'编辑题目 '+id:'新增题目';
  document.getElementById('editMsg').textContent='';
  var q=id?questions.find(function(x){return x.id===id;}):null;
  document.getElementById('fType').value=q?q.type:'single';
  document.getElementById('fDiff').value=q?q.difficulty:2;
  document.getElementById('fKnowledge').value=q?(q.knowledge||''):'';
  document.getElementById('fStem').value=q?(q.stem||''):'';
  document.getElementById('fAnalysis').value=q?(q.analysis||''):'';
  var opts=(q&&q.options)||['','','',''];
  buildOpts(opts);
  buildAnswer(q);
  syncType();
  document.getElementById('editMask').classList.add('show');
}

function buildOpts(opts){
  optCount=Math.max(opts.length,2);
  var html='';
  var letters='ABCDEFGH';
  for(var i=0;i<optCount;i++){
    html+='<div class="opt-row"><span class="opt-letter">'+letters[i]+'.</span>'+
      '<input class="field-input opt-input" data-i="'+i+'" value="'+esc(opts[i]||'')+'">'+
      '<button class="opt-del" data-delopt="'+i+'" type="button">✕</button></div>';
  }
  document.getElementById('optList').innerHTML=html;
  document.getElementById('optList').querySelectorAll('[data-delopt]').forEach(function(b){
    b.addEventListener('click',function(){removeOpt(+b.dataset.delopt);});
  });
}
function getOpts(){
  var arr=[];
  document.querySelectorAll('#optList .opt-input').forEach(function(inp){
    arr.push(inp.value.trim());
  });
  return arr;
}
function removeOpt(i){
  var arr=getOpts();
  arr.splice(i,1);
  if(arr.length<2)arr.push('');
  buildOpts(arr);
  buildAnswerFromCurrent();
}
document.getElementById('addOptBtn').addEventListener('click',function(){
  var arr=getOpts();
  arr.push('');
  buildOpts(arr);
  buildAnswerFromCurrent();
});

function buildAnswer(q){
  // 根据题型渲染答案控件；q 存在则回填
  document.getElementById('answerArea').innerHTML='';
  var type=document.getElementById('fType').value;
  var area=document.getElementById('answerArea');
  if(type==='single'){
    var letters='ABCDEFGH';
    var sel='<select id="fAnswer" class="field-input">';
    for(var i=0;i<optCount;i++){
      sel+='<option value="'+letters[i]+'"'+((q&&q.answer===letters[i])?' selected':'')+'>'+letters[i]+'. '+(q&&q.options&&q.options[i]?q.options[i]:'选项'+(i+1))+'</option>';
    }
    sel+='</select>';
    area.innerHTML=sel;
  } else if(type==='multi'){
    area.innerHTML='<input id="fAnswer" class="field-input" placeholder="多选答案字母串，如 AC" value="'+esc(q?q.answer:'')+'">';
  } else if(type==='judge'){
    area.innerHTML='<select id="fAnswer" class="field-input"><option value="对"'+(q&&q.answer==='对'?' selected':'')+'>对</option><option value="错"'+(q&&q.answer==='错'?' selected':'')+'>错</option></select>';
  } else if(type==='blank'||type==='calc'){
    area.innerHTML='<input id="fAnswer" class="field-input" placeholder="标准答案文本" value="'+esc(q?q.answer:'')+'">';
  } else if(type==='short'){
    area.innerHTML='<textarea id="fAnswer" class="field-input" rows="3" placeholder="参考答案（学生自评对照）">'+esc(q?q.answer:'')+'</textarea>';
  }
}
function buildAnswerFromCurrent(){
  var type=document.getElementById('fType').value;
  if(type==='single')buildAnswer(null);
}
function syncType(){
  var type=document.getElementById('fType').value;
  var optArea=document.getElementById('optArea');
  optArea.style.display=(type==='single'||type==='multi')?'block':'none';
  buildAnswer(null);
}
document.getElementById('fType').addEventListener('change',function(){
  syncType();
  // 单选选项变化时刷新答案下拉
});

document.getElementById('saveBtn').addEventListener('click',function(){
  var type=document.getElementById('fType').value;
  var stem=document.getElementById('fStem').value.trim();
  var knowledge=document.getElementById('fKnowledge').value.trim();
  var analysis=document.getElementById('fAnalysis').value.trim();
  var answerEl=document.getElementById('fAnswer');
  var answer=answerEl?answerEl.value.trim():'';
  if(!stem){alert('请填写题干');return;}
  if(!answer){alert('请填写答案');return;}

  var q={id:editingId||('c-'+Date.now().toString(36)),type:type,difficulty:+document.getElementById('fDiff').value,
    knowledge:knowledge,stem:stem,answer:answer,analysis:analysis};
  if(type==='single'||type==='multi'){
    var opts=getOpts().filter(function(s){return s!=='';});
    if(opts.length<2){alert('请至少填写 2 个选项');return;}
    q.options=opts;
  }
  var msg=document.getElementById('editMsg');
  post('saveQuestion',{courseKey:selectedKey,code:selectedCode,question:q}).then(function(d){
    if(d.error){msg.textContent=d.error;msg.className='msg err';return;}
    msg.textContent='✓ 已保存';msg.className='msg';
    setTimeout(function(){document.getElementById('editMask').classList.remove('show');loadBank();},500);
  });
});
document.getElementById('cancelBtn').addEventListener('click',function(){document.getElementById('editMask').classList.remove('show');});
document.getElementById('addBtn').addEventListener('click',function(){openEdit(null);});

// ============ 批量导入 ============
document.getElementById('importBtn').addEventListener('click',function(){
  document.getElementById('importText').value='';
  document.getElementById('importMsg').textContent='';
  document.getElementById('importMask').classList.add('show');
});
document.getElementById('importCancel').addEventListener('click',function(){document.getElementById('importMask').classList.remove('show');});
document.getElementById('importDo').addEventListener('click',function(){
  var text=document.getElementById('importText').value.trim();
  if(!text){alert('请粘贴 JSON');return;}
  var list;
  try{list=JSON.parse(text);}catch(e){alert('JSON 解析失败：'+e.message);return;}
  if(!Array.isArray(list)){alert('需要 JSON 数组');return;}
  var mode=document.querySelector('input[name="importMode"]:checked').value;
  var msg=document.getElementById('importMsg');
  post('batchImport',{courseKey:selectedKey,code:selectedCode,questions:list,mode:mode}).then(function(d){
    if(d.error){msg.textContent=d.error;msg.className='msg err';return;}
    msg.textContent='✓ 已导入 '+d.count+' 题';msg.className='msg';
    setTimeout(function(){document.getElementById('importMask').classList.remove('show');loadBank();},500);
  });
});
</script>
</body>
</html>
